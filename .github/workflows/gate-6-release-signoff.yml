name: Gate 6 - Release signoff

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      run_ids:
        required: true
        type: string
        description: "Upstream runs as gate:runId,gate:runId"
permissions: {}

concurrency:
  group: gate-6-${{ inputs.candidate_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reviewer-one:
    runs-on: ubuntu-latest
    environment: recovery-release-review-1
    permissions: {}
    steps:
      - run: echo "Approval 1 recorded by GitHub environment review"

  reviewer-two:
    needs: reviewer-one
    runs-on: ubuntu-latest
    environment: recovery-release-review-2
    permissions: {}
    steps:
      - run: echo "Approval 2 recorded by GitHub environment review"

  qualification:
    needs: [reviewer-one, reviewer-two]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BRANCH: ${{ vars.FROZEN_CANDIDATE_BRANCH }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_ENABLED: "false"
      RUN_IDS: ${{ inputs.run_ids }}
      REQUIRE: "1,2,3,4,5"
      EXTRA_VERIFY_ARGS: "--approvals"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen candidate
        run: node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA"
      - name: Verify Gates 1-5, attestations, and two distinct approvers
        run: scripts/gates/fetch-and-verify.sh
      - name: Verify production recovery stays disabled
        run: |
          mkdir -p proofs
          node scripts/gates/check-flags.mjs candidate | tee proofs/gate6-flags.log
      - name: Write evidence
        run: node scripts/gates/write-evidence.mjs --gate 6 --sha "$CANDIDATE_SHA" --proof proofs/gate6-flags.log
      - name: Upload evidence
        uses: actions/upload-artifact@REPLACE_WITH_FULL_40_CHAR_SHA # v4.x
        with:
          name: gate-6-evidence-${{ inputs.candidate_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Attest evidence record
        uses: actions/attest-build-provenance@REPLACE_WITH_FULL_40_CHAR_SHA # v2.x
        with:
          subject-path: evidence/gate-6.json
