name: Gate 6 - Final qualification and release review
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen candidate SHA (40 lowercase hex)
        required: true
        type: string
      run_ids:
        description: Distinct successful run IDs for gates 1–5 and manual SMS/device attestations
        required: true
        type: string
permissions: {}
concurrency:
  group: gate-6-release-${{ inputs.candidate_sha }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == format('refs/heads/{0}', vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RUN_IDS: ${{ inputs.run_ids }}
      CANDIDATE_BRANCH: ${{ vars.CANDIDATE_BRANCH || 'work/p0-storage-hardening' }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout trusted gate tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate candidate and all seven distinct evidence run IDs before requesting approvals
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA" --repo "$REPO" --branch "$CANDIDATE_BRANCH"
          node --input-type=module <<'NODE'
          const value = JSON.parse(process.env.RUN_IDS);
          const expected = ['1', '2', '3', '4', '5', 'device', 'sms'].sort();
          if (!value || Array.isArray(value) || typeof value !== 'object' ||
              JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(expected)) throw new Error('RUN_IDS must contain exactly gates 1–5, sms and device');
          const ids = expected.map(key => String(value[key]));
          if (ids.some(id => !/^[1-9][0-9]{0,15}$/.test(id) || !Number.isSafeInteger(Number(id))) ||
              new Set(ids).size !== ids.length) throw new Error('RUN_IDS must contain seven distinct positive safe integers');
          NODE
  owner-signoff:
    needs: preflight
    if: github.ref == format('refs/heads/{0}', vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch')
    runs-on: ubuntu-latest
    environment: recovery-release-owner
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Candidate owner approval
        run: echo "Candidate owner sign-off recorded by the protected environment."
  independent-reviewer-one:
    needs: [preflight, owner-signoff]
    if: github.ref == format('refs/heads/{0}', vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch')
    runs-on: ubuntu-latest
    environment: recovery-release-review-1
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: First independent release reviewer approval
        run: echo "First independent release approval recorded by the protected environment."
  independent-reviewer-two:
    needs: [preflight, owner-signoff, independent-reviewer-one]
    if: github.ref == format('refs/heads/{0}', vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch')
    runs-on: ubuntu-latest
    environment: recovery-release-review-2
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Second independent release reviewer approval
        run: echo "Second independent release approval recorded by the protected environment."
  verify-and-attest:
    needs: [preflight, owner-signoff, independent-reviewer-one, independent-reviewer-two]
    if: github.ref == format('refs/heads/{0}', vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RUN_IDS: ${{ inputs.run_ids }}
      CANDIDATE_BRANCH: ${{ vars.CANDIDATE_BRANCH || 'work/p0-storage-hardening' }}
      CONTROL_BRANCH: ${{ vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch' }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.triggering_actor }}
      RELEASE_OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted gate tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Gates 1–5, both manual attestations, matching APK and owner sign-off and two distinct independent approvals
        run: node scripts/gates/verify-qualification.mjs
      - name: Write and bundle Gate 6 release-review evidence
        run: |
          set -euo pipefail
          node scripts/gates/write-evidence.mjs --gate 6 --sha "$CANDIDATE_SHA" --status PASS
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf bundle.tar evidence
      - name: Attest Gate 6 evidence bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: bundle.tar
      - name: Upload Gate 6 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-6-evidence
          path: bundle.tar
          if-no-files-found: error
          retention-days: 90
