name: Node contract tests

on:
  push:
    branches:
      - main
      - feature/aurelia-upi-sovereign-redesign-2026-11-26
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run repository contract tests
        run: npm test
      - name: Verify web bundle preparation
        run: npm run build
