name: Gate 5 - Production security audit

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string

permissions: {}

concurrency:
  group: gate-5-${{ inputs.candidate_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: recovery-production-audit
    permissions: {contents: read, id-token: write, attestations: write}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BRANCH: ${{ vars.FROZEN_CANDIDATE_BRANCH }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen candidate
        run: node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA"
      - name: Verify production recovery flags (fail closed)
        run: |
          mkdir -p proofs
          node scripts/gates/check-flags.mjs candidate | tee proofs/gate5-flags.log
      - name: Audit production configuration (read-only credentials)
        run: node scripts/gates/audit-production.mjs | tee proofs/gate5-audit.json
      - name: Write evidence
        run: node scripts/gates/write-evidence.mjs --gate 5 --sha "$CANDIDATE_SHA" --proof proofs/gate5-flags.log --proof proofs/gate5-audit.json
      - name: Upload evidence
        uses: actions/upload-artifact@REPLACE_WITH_FULL_40_CHAR_SHA # v4.x
        with:
          name: gate-5-evidence-${{ inputs.candidate_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Attest evidence record
        uses: actions/attest-build-provenance@REPLACE_WITH_FULL_40_CHAR_SHA # v2.x
        with:
          subject-path: evidence/gate-5.json
