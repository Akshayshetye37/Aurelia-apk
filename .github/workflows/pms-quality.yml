name: PMS source tests (no build)

on:
  push:
    branches:
      - feature/multi-provider-payment-backend
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: pms-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PMS
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete PMS test suite
        run: npm test
