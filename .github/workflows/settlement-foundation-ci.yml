name: Aurelia settlement foundation CI
# Exact-SHA gate fan-out: candidate commits run this workstream's full acceptance suite.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/multi-provider-payment-backend
      - 'work/**'
    paths:
      - "src/payments/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/settlement-foundation-ci.yml"
  pull_request:
    branches:
      - '**'
    paths:
      - "src/payments/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/settlement-foundation-ci.yml"

permissions:
  contents: read

concurrency:
  group: aurelia-settlement-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settlement-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Syntax-check settlement modules
        run: |
          node --check src/payments/canonical.mjs
          node --check src/payments/settlement-authorization.mjs
          node --check src/payments/settlement-journal.mjs
          node --check src/payments/settlement-service.mjs
          node --check src/payments/settlement-projector.mjs
          node --check src/payments/payment-device-bridge.mjs
          node --check tests/settlement-projector.test.mjs
      - name: Run full application test suite
        run: npm test
      - name: Build production web assets
        run: npm run build
