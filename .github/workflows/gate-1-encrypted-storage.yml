name: Gate 1 - Encrypted storage evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string

permissions: {}

concurrency:
  group: gate-1-${{ inputs.candidate_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BRANCH: ${{ vars.FROZEN_CANDIDATE_BRANCH }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen candidate
        run: node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA"
      - name: Verify encrypted storage tests
        run: |
          mkdir -p proofs
          node scripts/gates/verify-runs.mjs --sha "$CANDIDATE_SHA" --repo "$REPO" --group gate1 | tee proofs/gate1-runs.log
      - name: Write evidence
        run: node scripts/gates/write-evidence.mjs --gate 1 --sha "$CANDIDATE_SHA" --proof proofs/gate1-runs.log
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.x
        with:
          name: gate-1-evidence-${{ inputs.candidate_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Attest evidence record
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.x
        with:
          subject-path: evidence/gate-1.json
