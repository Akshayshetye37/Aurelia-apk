name: Gate - Reviewer-approved manual SMS or device attestation
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen candidate SHA (40 lowercase hex)
        required: true
        type: string
      kind:
        description: Manual qualification type
        required: true
        type: choice
        options: [sms, device]
      gate3_run_id:
        description: Successful Gate 3 run ID
        required: true
        type: string
      attestation:
        description: Redacted attestation JSON; never include OTPs, phone numbers or secrets
        required: true
        type: string
permissions: {}
concurrency:
  group: manual-attestation-${{ inputs.kind }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false
jobs:
  attest:
    if: github.ref == format('refs/heads/{0}', vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch')
    runs-on: ubuntu-latest
    environment: recovery-attestation
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      KIND: ${{ inputs.kind }}
      GATE3_RUN: ${{ inputs.gate3_run_id }}
      ATTESTATION: ${{ inputs.attestation }}
      REPO: ${{ github.repository }}
      CONTROL_BRANCH: ${{ vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch' }}
      CANDIDATE_BRANCH: fix/backup-consolidated-integration
      ACTOR: ${{ github.triggering_actor }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted gate tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Candidate is the exact frozen branch head
        run: node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA" --repo "$REPO" --branch "$CANDIDATE_BRANCH"
      - name: Validate reviewer attestation against the Gate 3 APK
        run: node scripts/gates/validate-attestation.mjs --kind "$KIND" --sha "$CANDIDATE_SHA" --repo "$REPO" --gate3-run "$GATE3_RUN" --control-branch "$CONTROL_BRANCH"
      - name: Write and bundle manual attestation
        run: |
          set -euo pipefail
          node scripts/gates/write-evidence.mjs --gate "$KIND" --sha "$CANDIDATE_SHA" --status PASS
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf bundle.tar evidence
      - name: Attest manual evidence bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: bundle.tar
      - name: Upload manual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-${{ inputs.kind }}-evidence
          path: bundle.tar
          if-no-files-found: error
          retention-days: 90
