name: Build Aurelia PMS APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android/templates/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  # Run on every PR so this check can safely be required by main branch rules.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app
        run: npm run build

      - name: Generate Android project and restore Aurelia native templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$RUNNER_TEMP/aurelia-android-templates"
          mkdir -p "$template_dir"
          if [[ -d android/templates ]]; then
            cp -a android/templates/. "$template_dir/"
          fi
          # The repository intentionally stores templates only, not a generated Android project.
          rm -rf android
          npx cap add android
          mkdir -p android/templates
          cp -a "$template_dir/." android/templates/
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Apply Aurelia native Android configuration
        run: node scripts/patch-android.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify generated native project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/aurelia/pms/MainActivity.java
          grep -q 'AureliaNative' android/app/src/main/java/com/aurelia/pms/MainActivity.java
          grep -q 'CapacitorPmsStoragePlugin.lockForLifecycle' android/app/src/main/java/com/aurelia/pms/MainActivity.java

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-pms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
