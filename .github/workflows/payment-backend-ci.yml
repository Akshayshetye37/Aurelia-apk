name: Aurelia payment backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/multi-provider-payment-backend
      - 'work/**'
    paths:
      - "payment-backend/**"
      - ".github/workflows/payment-backend-ci.yml"
  pull_request:
    branches:
      - feature/multi-provider-payment-backend
    paths:
      - "payment-backend/**"
      - ".github/workflows/payment-backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: aurelia-payment-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run payment backend contract and security tests
        run: npm test
      - name: Verify payment backend JavaScript syntax
        run: |
          find src test -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Build production Cloud Run container image
        run: docker build --pull --file Dockerfile.cloud --tag aurelia-payment-backend:ci .
      - name: Verify production image runs as non-root
        run: test "$(docker image inspect aurelia-payment-backend:ci --format '{{.Config.User}}')" = "node"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # hashicorp/setup-terraform v3.1.2
        with:
          terraform_version: "1.9.8"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize Terraform providers
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate Cloud Run infrastructure
        run: terraform -chdir=infra/terraform validate
