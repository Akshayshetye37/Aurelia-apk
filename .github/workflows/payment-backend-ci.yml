name: Aurelia payment backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/multi-provider-payment-backend
      - 'work/**'
    paths:
      - "payment-backend/**"
      - ".github/workflows/payment-backend-ci.yml"
  pull_request:
    branches:
      - feature/multi-provider-payment-backend
    paths:
      - "payment-backend/**"
      - ".github/workflows/payment-backend-ci.yml"

permissions:
  contents: write

concurrency:
  group: aurelia-payment-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate root dependency lockfile
        run: npm install --package-lock-only --no-audit --no-fund
        working-directory: .
      - name: Generate payment backend dependency lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify root clean install
        run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Verify payment backend clean install
        run: npm ci --no-audit --no-fund
      - name: Run complete PMS regression suite
        run: npm test
        working-directory: .
      - name: Run payment backend contract and security tests
        run: npm run test:ci
      - name: Verify payment backend JavaScript syntax
        run: |
          find src test -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Build production Cloud Run container image
        run: docker build --pull --file Dockerfile.cloud --tag aurelia-payment-backend:ci .
      - name: Verify production image runs as non-root
        run: test "$(docker image inspect aurelia-payment-backend:ci --format '{{.Config.User}}')" = "node"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize Terraform providers
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate Cloud Run infrastructure
        run: terraform -chdir=infra/terraform validate

      - name: Commit generated lockfiles on work branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/')
        working-directory: .
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json payment-backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "build: add reproducible npm lockfiles"
          git push origin "HEAD:${BRANCH_NAME}"
