name: Aurelia payment backend CI

on:
  push:
    branches:
      - feature/multi-provider-payment-backend
    paths:
      - "payment-backend/**"
      - ".github/workflows/payment-backend-ci.yml"
  pull_request:
    branches:
      - feature/multi-provider-payment-backend
    paths:
      - "payment-backend/**"
      - ".github/workflows/payment-backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: aurelia-payment-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run payment backend contract and security tests
        run: npm test
      - name: Build production Cloud Run container image
        run: docker build --pull --file Dockerfile.cloud --tag aurelia-payment-backend:ci .
