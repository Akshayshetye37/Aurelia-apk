name: Aurelia payment architecture CI

on:
  push:
    branches:
      - feature/multi-provider-payment-backend
  pull_request:
    branches:
      - feature/multi-provider-payment-backend

permissions:
  contents: read

jobs:
  pms-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  payment-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
