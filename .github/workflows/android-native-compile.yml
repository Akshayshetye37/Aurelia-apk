name: Aurelia Android native compile check

# Compiles the generated Android Java sources only. This workflow never assembles or uploads an APK.
on:
  push:
    branches:
      - feature/aurelia-upi-sovereign-redesign-2026-11-26
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run build

      - name: Generate Android project and restore Aurelia templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$RUNNER_TEMP/aurelia-android-templates"
          if [[ -d android/templates ]]; then
            mv android/templates "$template_dir"
          fi
          if [[ -d android ]]; then
            rmdir android
          fi
          npx cap add android
          if [[ -d "$template_dir" ]]; then
            mkdir -p android/templates
            cp -a "$template_dir/." android/templates/
          fi
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Apply Aurelia native templates
        run: node scripts/patch-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Compile Android Java sources only
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac

      - name: Assert no APK was assembled
        shell: bash
        run: |
          set -euo pipefail
          if find android/app/build/outputs -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "Unexpected APK output in compile-only workflow"
            exit 1
          fi
          echo "Native Java compilation completed without producing an APK."
