name: Full history secret scan

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks — all reachable Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pinned Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$HOME/go/bin/gitleaks" version

      - name: Scan every reachable branch and tag history
        run: |
          "$HOME/go/bin/gitleaks" git \
            --log-opts="--all --full-history" \
            --redact \
            --exit-code 1
