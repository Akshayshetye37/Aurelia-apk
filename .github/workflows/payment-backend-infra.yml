name: Payment backend infrastructure validation

on:
  push:
    branches: [feature/multi-provider-payment-backend]
    paths:
      - "payment-backend/infra/terraform/**"
      - ".github/workflows/payment-backend-infra.yml"
  pull_request:
    paths:
      - "payment-backend/infra/terraform/**"
      - ".github/workflows/payment-backend-infra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-backend/infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # hashicorp/setup-terraform v3.1.2
        with:
          terraform_version: "1.9.8"
      # Run formatting before provider initialization so HCL style failures are isolated.
      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive
      - name: Initialize without remote backend
        run: terraform init -backend=false
      - name: Validate infrastructure configuration
        run: terraform validate
