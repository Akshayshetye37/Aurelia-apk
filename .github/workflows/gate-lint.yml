name: Gate pipeline lint
on:
  push:
    branches:
      - integration/ledger-patch
      - work/gate-3-google-email-link
  pull_request:
    branches:
      - integration/ledger-patch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-lint-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve any release-tag actions to immutable commit SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gates/pin-actions.sh
      - name: Ensure pinning made no uncommitted workflow changes
        run: git diff --exit-code -- .github/workflows
      - name: Parse every gate workflow and the staging dependency as YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/gate-*.yml", ".github/workflows/recovery-staging-deploy.yml"].each { |file| YAML.parse_file(file); puts "valid YAML: #{file}" }'
      - name: Lint gate workflows
        run: node scripts/gates/lint-workflows.mjs
      - name: Validate shell pinning script
        run: bash -n scripts/gates/pin-actions.sh
      - name: Validate gate scripts parse
        run: |
          set -euo pipefail
          for file in scripts/gates/*.mjs; do node --check "$file"; done
      - name: Run gate security regression tests
        run: node --test tests/gates.test.mjs
      - name: Validate required workflow manifest
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('gates/required-runs.json','utf8')); for (const k of ['gate1','gate2']) if (!Array.isArray(c[k]) || c[k].length !== 3) process.exit(1);"
