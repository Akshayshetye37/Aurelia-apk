name: Recovery Functions CI

on:
  workflow_dispatch:
  push:
    branches: [work/p0-storage-hardening]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/recovery-functions.yml'
      - '.github/workflows/otp-recovery-android-instrumentation.yml'
      - 'android/templates/**'
      - 'tests/otp-recovery-*.test.mjs'
      - 'scripts/patch-android.js'
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/recovery-functions.yml'
      - 'android/templates/**'
      - 'tests/otp-recovery-*.test.mjs'
      - 'scripts/patch-android.js'

permissions:
  contents: read

jobs:
  recovery-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
        working-directory: functions
      - name: Compile TypeScript
        run: npm run build
        working-directory: functions
      - name: Run backend security contract tests
        run: npm test
        working-directory: functions

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase Emulator CLI
        run: npm install --global firebase-tools@13.31.2

      - name: Run Auth and Firestore emulator recovery state-machine tests
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --only auth,firestore --project demo-aurelia-recovery "cd functions && npm run test:emulator" 2>&1 | tee recovery-emulator-runtime.log

      - name: Upload raw Firebase Emulator runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-emulator-runtime-logs
          path: recovery-emulator-runtime.log
          if-no-files-found: error
          retention-days: 14

  otp-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run OTP source-contract regression tests
        run: node --test tests/otp-recovery-gate.test.mjs tests/otp-recovery-end-to-end.test.mjs
