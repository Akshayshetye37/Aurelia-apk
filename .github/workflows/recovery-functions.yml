name: Recovery Functions CI

on:
  push:
    branches: [work/p0-storage-hardening, work/gate2-firebase-emulator]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/recovery-functions.yml'
      - 'android/templates/**'
      - 'tests/otp-recovery-*.test.mjs'
      - 'scripts/patch-android.js'
      - 'docs/GATE-3-PHYSICAL-DEVICE-QUALIFICATION.md'
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/recovery-functions.yml'
      - 'android/templates/**'
      - 'tests/otp-recovery-*.test.mjs'
      - 'scripts/patch-android.js'

permissions:
  contents: read

jobs:
  recovery-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
        working-directory: functions
      - name: Compile TypeScript
        run: npm run build
        working-directory: functions
      - name: Run backend security contract tests
        run: npm test
        working-directory: functions

  recovery-functions-emulator-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Functions dependencies
        run: npm install --ignore-scripts
        working-directory: functions
      - name: Build Functions for emulator loading
        run: npm run build
        working-directory: functions
      - name: Generate isolated emulator signing material
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { generateKeyPairSync, randomBytes } from "node:crypto";
          import { writeFileSync } from "node:fs";
          const { privateKey } = generateKeyPairSync("ec", {
            namedCurve: "prime256v1",
            privateKeyEncoding: { type: "pkcs8", format: "pem" },
            publicKeyEncoding: { type: "spki", format: "pem" }
          });
          const pepper = randomBytes(32).toString("hex");
          const escapedKey = privateKey.trim().replace(/\\n/g, "\\\\n");
          writeFileSync("functions/.secret.local",
            `PHONE_PEPPER=${pepper}\nRECOVERY_SIGNING_KEY_PKCS8="${escapedKey}"\n`,
            { mode: 0o600 });
          writeFileSync(process.env.GITHUB_ENV,
            `PHONE_PEPPER=${pepper}\nRECOVERY_SIGNING_KEY_PKCS8<<GATE2KEY\n${privateKey}GATE2KEY\n`,
            { flag: "a", mode: 0o600 });
          NODE
      - name: Run grant issue, atomic consume, replay and binding tests against Firebase emulators
        env:
          GATE2_EMULATOR: "1"
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
          GCLOUD_PROJECT: demo-aurelia-recovery
        run: |
          npx --yes firebase-tools@14.12.1 emulators:exec \
            --project demo-aurelia-recovery \
            --only auth,firestore,functions \
            "npm test"
        working-directory: functions

  otp-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run OTP source-contract regression tests
        run: node --test tests/otp-recovery-gate.test.mjs tests/otp-recovery-end-to-end.test.mjs
