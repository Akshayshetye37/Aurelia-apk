name: OTP Recovery Android Instrumentation

on:
  workflow_dispatch:
  push:
    branches: [work/p0-storage-hardening, work/otp-recovery-hardening]
    paths:
      - 'android/templates/**'
      - 'scripts/patch-android.js'
      - 'scripts/verify-android-instrumentation-results.mjs'
      - 'functions/src/**'
      - 'functions/test/**'
      - 'functions/test/**'
      - 'functions/src/**'
      - 'tests/otp-recovery-*.test.mjs'
      - 'tests/native-security-template.test.mjs'
      - '.github/workflows/recovery-functions.yml'
      - '.github/workflows/recovery-attestation-ci.yml'
      - '.github/workflows/otp-recovery-android-instrumentation.yml'
  pull_request:
    paths:
      - 'android/templates/**'
      - 'scripts/patch-android.js'
      - 'scripts/verify-android-instrumentation-results.mjs'
      - 'tests/native-security-template.test.mjs'
      - '.github/workflows/otp-recovery-android-instrumentation.yml'

permissions:
  contents: read

concurrency:
  group: otp-recovery-android-instrumentation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  sqlcipher-recovery-instrumentation:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Run repository regression suite
        run: npm test

      - name: Prepare web application
        run: npm run build

      - name: Generate Android project and restore native templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$RUNNER_TEMP/aurelia-android-templates"
          mv android/templates "$template_dir"
          rmdir android
          npx cap add android
          mkdir -p android/templates
          cp -a "$template_dir/." android/templates/
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Apply native security and instrumentation templates
        env:
          RECOVERY_GRANT_PUBLIC_KEYS_JSON: ${{ vars.RECOVERY_GRANT_PUBLIC_KEYS_JSON }}
        run: node scripts/patch-android.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Compile Android and instrumentation sources
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac compileDebugKotlin compileDebugAndroidTestJavaWithJavac testDebugUnitTest assembleDebug

      - name: Enable Linux KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::KVM device is unavailable on this runner; refusing a slow software-emulated x86_64 test."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "KVM device is present and accessible."

      - name: Install Android 34 emulator image and create AVD
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"; fi
          if [[ ! -x "$AVDMANAGER" ]]; then AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name avdmanager -perm -u+x | sort | tail -n 1)"; fi
          test -x "$SDKMANAGER" && test -x "$AVDMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force --name aurelia-recovery-api34 --package "system-images;android-34;google_apis;x86_64" --device pixel_2
          avd_config="$HOME/.android/avd/aurelia-recovery-api34.avd/config.ini"
          test -f "$avd_config"
          sed -i -E 's/^hw\.ramSize=.*/hw.ramSize=4096/; s/^hw\.cpu\.ncore=.*/hw.cpu.ncore=4/; s/^vm\.heapSize=.*/vm.heapSize=512/' "$avd_config"

      - name: Start API 34 emulator with KVM and capture console output
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/aurelia-recovery-emulator"
          mkdir -p "$log_dir"
          nohup "$ANDROID_HOME/emulator/emulator" -avd aurelia-recovery-api34 -accel on \
            -memory 4096 -cores 4 -no-window -gpu swiftshader_indirect -no-audio \
            -no-boot-anim -no-snapshot -no-snapshot-save -wipe-data -verbose \
            >"$log_dir/emulator.stdout-stderr.log" 2>&1 &
          echo "$!" > "$log_dir/emulator.pid"
          timeout -k 2s 10s "$ANDROID_HOME/platform-tools/adb" start-server
          timeout -k 2s 10s $ANDROID_HOME/platform-tools/adb devices -l || true

      - name: Wait for API 34 emulator boot completion
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/aurelia-recovery-emulator"
          if ! timeout -k 2s 60s $ANDROID_HOME/platform-tools/adb wait-for-device; then
            echo "ADB enumeration was delayed; continuing bounded boot diagnostics."
          fi
          deadline=$((SECONDS + 900))
          booted=false
          while (( SECONDS < deadline )); do
            state="$(timeout -k 2s 5s $ANDROID_HOME/platform-tools/adb get-state 2>&1 || true)"
            if [[ "$state" == "device" ]]; then
              boot="$(timeout -k 2s 5s $ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            else
              boot="unavailable"
            fi
            echo "Emulator health: adb_state=$state sys.boot_completed=$boot elapsed=$((900 - (deadline - SECONDS)))s"
            if [[ "$state" == "device" && "$boot" == "1" ]]; then booted=true; break; fi
            sleep 10
          done
          timeout -k 2s 5s $ANDROID_HOME/platform-tools/adb devices -l > "$log_dir/adb-devices-after-boot.txt" 2>&1 || true
          if [[ "$booted" != true ]]; then
            echo "::error::Android emulator did not reach sys.boot_completed=1 within 900 seconds."
            exit 1
          fi
          $ANDROID_HOME/platform-tools/adb shell getprop ro.build.fingerprint
          test "$($ANDROID_HOME/platform-tools/adb shell getprop ro.build.version.sdk | tr -d '\r')" = "34"
          $ANDROID_HOME/platform-tools/adb shell settings put global window_animation_scale 0
          $ANDROID_HOME/platform-tools/adb shell settings put global transition_animation_scale 0
          $ANDROID_HOME/platform-tools/adb shell settings put global animator_duration_scale 0

      - name: Run local recovery suites with a real process-death boundary
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/aurelia-recovery-emulator"
          results_root="$RUNNER_TEMP/aurelia-recovery-results"
          mkdir -p "$results_root"
          cd android
          run_suite() {
            local suite="$1"
            local selector="$2"
            rm -rf app/build/outputs/androidTest-results/connected app/build/reports/androidTests/connected
            timeout -k 10s 1500s ./gradlew --no-daemon connectedDebugAndroidTest \
              "-Pandroid.testInstrumentationRunnerArguments.class=$selector" 2>&1 | tee "$log_dir/$suite.log"
            mkdir -p "$results_root/$suite"
            cp -a app/build/outputs/androidTest-results/connected/. "$results_root/$suite/"
          }
          run_suite sqlcipher com.aurelia.pms.OtpRecoverySqlCipherInstrumentedTest
          run_suite recovery-phone-store com.aurelia.pms.security.AureliaSecurityInstrumentedTest#recoveryEnvelopeAndPhoneStoresRetainAuthenticatedKeystoreState
          run_suite grant-verifier com.aurelia.pms.security.RecoveryGrantVerifierInstrumentedTest
          adb_bin="$ANDROID_HOME/platform-tools/adb"
          app_apk="app/build/outputs/apk/debug/app-debug.apk"
          test_apk="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test_runner="com.aurelia.pms.test/androidx.test.runner.AndroidJUnitRunner"

          # Gradle uninstalls the target app after connectedDebugAndroidTest. Install
          # both APKs once, then use am instrument for both phases so Keystore and app
          # data survive the host-issued force-stop between them.
          test -f "$app_apk"
          test -f "$test_apk"
          "$adb_bin" install -r "$app_apk"
          "$adb_bin" install -r -t "$test_apk"

          run_instrumentation_test() {
            local suite="$1"
            local selector="$2"
            local raw_log="$log_dir/$suite.log"
            local suite_dir="$results_root/$suite"
            local class_name="${selector%%#*}"
            local method_name="${selector##*#}"
            mkdir -p "$suite_dir"
            set +e
            "$adb_bin" shell am instrument -w -r -e class "$selector" "$test_runner" 2>&1 | tee "$raw_log"
            local adb_status=${PIPESTATUS[0]}
            set -e
            echo "$adb_status" > "$log_dir/$suite-adb-exit-code.txt"
            node --input-type=module - "$raw_log" "$suite_dir/TEST-$suite.xml" "$class_name" "$method_name" "$adb_status" <<'NODE'
          import fs from "node:fs";
          const [logPath, xmlPath, className, methodName, adbStatusText] = process.argv.slice(2);
          const raw = fs.readFileSync(logPath, "utf8");
          const adbStatus = Number(adbStatusText);
          const declaredTests = [...raw.matchAll(/INSTRUMENTATION_STATUS: numtests=(\d+)/g)]
            .map(match => Number(match[1]));
          const completed = [...raw.matchAll(/INSTRUMENTATION_STATUS_CODE: 0\b/g)].length;
          const negativeCodes = [...raw.matchAll(/INSTRUMENTATION_STATUS_CODE: (-\d+)/g)]
            .map(match => Number(match[1]));
          const observedMethods = [...raw.matchAll(/INSTRUMENTATION_STATUS: test=([^\r\n]+)/g)]
            .map(match => match[1].trim());
          const instrumentationCode = raw.match(/INSTRUMENTATION_CODE: (-?\d+)/)?.[1];
          const rawTestCount = declaredTests.length ? Math.max(...declaredTests) : 0;
          const rawStatusPassed = rawTestCount === 1 && completed === 1 &&
            negativeCodes.length === 0 && instrumentationCode === "-1" &&
            observedMethods.includes(methodName);
          const compactClassLine = raw.split(/\r?\n/).map(line => line.trim())
            .find(line => line.startsWith(`${className}:`));
          const compactMarker = compactClassLine?.slice(className.length + 1).trim();
          const compactPassed = /OK \(1 test\)/.test(raw) && compactMarker === ".";
          const passed = adbStatus === 0 && (rawStatusPassed || compactPassed);
          const testCount = rawTestCount || (compactPassed ? 1 : 0);
          const skipped = negativeCodes.some(code => code === -3 || code === -4) ||
            compactMarker === "I" ? 1 : 0;
          const failures = negativeCodes.some(code => code === -2) ||
            compactMarker === "F" ? 1 : 0;
          const errors = passed || failures || skipped ? 0 : 1;
          const escape = value => String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
          const failureXml = passed ? "" :
            `<failure message="AndroidJUnitRunner did not report one successful, non-skipped test">${escape(raw.slice(-12000))}</failure>`;
          const xml = `<?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="${escape(methodName)}" tests="${testCount}" failures="${failures}" errors="${errors}" skipped="${skipped}">
            <testcase classname="${escape(className)}" name="${escape(methodName)}">${failureXml}</testcase>
          </testsuite>`;
          fs.writeFileSync(xmlPath, xml);
          if (!passed) {
            console.error(`::error::${methodName}: AndroidJUnitRunner did not prove exactly one successful test.`);
            process.exit(1);
          }
          NODE
          }

          phase_one="com.aurelia.pms.RecoveryProcessDeathInstrumentedTest#phaseOnePersistsPinAAndDatabaseBeforeForceStop"
          phase_two="com.aurelia.pms.RecoveryProcessDeathInstrumentedTest#phaseTwoUnlocksPinAAndReadsDatabaseAfterForceStop"
          # Phase one runs only in the host-managed background process below.
          # It intentionally blocks after PHASE_ONE_READY until the host force-stops it.

          wait_for_target_pid() {
            local pid=""
            for attempt in {1..15}; do
              pid="$("$adb_bin" shell pidof com.aurelia.pms | tr -d '\r' | awk '{print $1}')"
              if [[ -n "$pid" ]]; then printf '%s' "$pid"; return 0; fi
              sleep 1
            done
            return 1
          }
          wait_for_log_marker() {
            local marker="$1"
            local command_pid="$2"
            for attempt in {1..90}; do
              if "$adb_bin" logcat -d -s RecoveryProcessDeath:I 2>/dev/null | grep -Fq "$marker"; then
                return 0
              fi
              if ! kill -0 "$command_pid" 2>/dev/null; then
                echo "::error::Instrumentation exited before marker $marker."
                return 1
              fi
              sleep 1
            done
            echo "::error::Timed out waiting for instrumentation marker $marker."
            return 1
          }

          # Phase one remains inside the target process after persisting its
          # encrypted envelope and SQLCipher record. The host kills that exact
          # live process only after observing the durable-state marker.
          "$adb_bin" logcat -c
          phase_one_log="$log_dir/process-death-phase-one.log"
          timeout -k 5s 1800s "$adb_bin" shell am instrument -w -r -e class "$phase_one" "$test_runner" \
            > "$phase_one_log" 2>&1 &
          phase_one_command_pid=$!
          wait_for_log_marker "PHASE_ONE_READY" "$phase_one_command_pid" || {
            cat "$phase_one_log"
            exit 1
          }
          if ! grep -Fq "INSTRUMENTATION_STATUS: test=phaseOnePersistsPinAAndDatabaseBeforeForceStop" "$phase_one_log"; then
            echo "::error::Phase one did not execute the required instrumentation method."
            exit 1
          fi
          before_pid="$(wait_for_target_pid)" || {
            echo "::error::Phase-one target app process was not alive at the durable-state marker."
            exit 1
          }
          "$adb_bin" shell am force-stop com.aurelia.pms
          after_stop=""
          for attempt in {1..15}; do
            after_stop="$("$adb_bin" shell pidof com.aurelia.pms | tr -d '\r' || true)"
            [[ -z "$after_stop" ]] && break
            sleep 1
          done
          if [[ -n "$after_stop" ]]; then
            echo "::error::adb force-stop did not terminate the phase-one target app process."
            exit 1
          fi
          set +e
          wait "$phase_one_command_pid"
          phase_one_exit=$?
          set -e
          if [[ "$phase_one_exit" -eq 124 || "$phase_one_exit" -eq 137 ]]; then
            echo "::error::Phase-one instrumentation command timed out instead of exiting after force-stop."
            exit 1
          fi
          # Keep phase-one process-death evidence separate from JUnit totals.
          # Do not fabricate a completed JUnit case for the intentionally killed
          # instrumentation process; phase two supplies the completed JUnit test.
          {
            echo "phase=process-death-phase-one"
            echo "test_method=phaseOnePersistsPinAAndDatabaseBeforeForceStop"
            echo "marker=PHASE_ONE_READY"
            echo "target_pid_before_force_stop=$before_pid"
            echo "target_pid_after_force_stop=absent"
            echo "force_stop_command=adb shell am force-stop com.aurelia.pms"
            echo "instrumentation_command_exit=$phase_one_exit"
            echo "result=HOST_VERIFIED_PROCESS_TERMINATION"
          } > "$log_dir/process-death-phase-one-evidence.txt"

          # Phase two executes in the newly started target process. It verifies
          # PIN A, offline recovery key, same DEK, PIN B rotation and original
          # SQLCipher data before emitting its marker and returning.
          "$adb_bin" logcat -c
          run_instrumentation_test process-death-phase-two "$phase_two" &
          phase_two_command_pid=$!
          wait_for_log_marker "PHASE_TWO_VERIFIED" "$phase_two_command_pid" || {
            wait "$phase_two_command_pid" || true
            exit 1
          }
          after_pid="$(wait_for_target_pid)" || {
            echo "::error::Phase-two instrumentation process was not alive after persisted-state verification."
            exit 1
          }
          if [[ "$after_pid" == "$before_pid" ]]; then
            echo "::error::Phase two reused the phase-one target app PID."
            exit 1
          fi
          wait "$phase_two_command_pid"
          mkdir -p app/build/outputs/androidTest-results/connected
          cp -a "$results_root/." app/build/outputs/androidTest-results/connected/

      - name: Capture recovery emulator diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          log_dir="$RUNNER_TEMP/aurelia-recovery-emulator"
          mkdir -p "$log_dir"
          timeout -k 2s 8s "$ANDROID_HOME/platform-tools/adb" devices -l > "$log_dir/adb-devices-final.txt" 2>&1 || true
          timeout -k 2s 8s "$ANDROID_HOME/platform-tools/adb" logcat -d > "$log_dir/logcat.txt" 2>&1 || true

      - name: Verify instrumentation results contain no failures or ignored tests
        if: always()
        run: node scripts/verify-android-instrumentation-results.mjs android/app/build/outputs/androidTest-results/connected android/templates

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: otp-recovery-sqlcipher-instrumentation-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
            ${{ runner.temp }}/aurelia-recovery-emulator/**
          if-no-files-found: warn
          retention-days: 30
