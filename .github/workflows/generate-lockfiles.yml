name: Generate reproducible npm lockfiles

on:
  push:
    branches:
      - work/phase-0-feature-registry
    paths:
      - '.github/workflows/generate-lockfiles.yml'
      - 'package.json'
      - 'payment-backend/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurelia-lockfile-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Akshayshetye37/Aurelia-apk' && github.ref == 'refs/heads/work/phase-0-feature-registry'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: 22
      - name: Generate root lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate payment backend lockfile without running package scripts
        run: npm --prefix payment-backend install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json payment-backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match package manifests."
            exit 0
          fi
          git commit -m "build: add reproducible npm lockfiles"
          git push
