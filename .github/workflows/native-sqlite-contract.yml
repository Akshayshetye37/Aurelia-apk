name: Aurelia native SQLite contract

on:
  push:
    branches:
      - work/p0-storage-hardening
  pull_request:
    branches:
      - feature/multi-provider-payment-backend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-native-sqlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-sqlite-instrumentation:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Run source regression suite
        run: npm test

      - name: Prepare web application
        run: npm run build

      - name: Generate Android project from repository templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$RUNNER_TEMP/aurelia-android-templates"
          if [[ -d android/templates ]]; then mv android/templates "$template_dir"; fi
          if [[ -d android ]]; then rmdir android; fi
          npx cap add android
          if [[ -d "$template_dir" ]]; then mkdir -p android/templates && cp -a "$template_dir/." android/templates/; fi
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Apply native PMS and instrumentation configuration
        run: node scripts/patch-android.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Install Android 34 emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"
          mkdir -p "$RUNNER_TEMP/aurelia-emulator"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Compile native sources, unit tests and instrumentation APK
        working-directory: android
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          log_dir="$RUNNER_TEMP/aurelia-emulator"
          mkdir -p "$log_dir"
          set +e
          ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            compileDebugJavaWithJavac \
            compileReleaseJavaWithJavac \
            testDebugUnitTest \
            assembleDebug \
            assembleDebugAndroidTest 2>&1 | tee "$log_dir/compile-native-gradle.log"
          gradle_status=${PIPESTATUS[0]}
          echo "$gradle_status" > "$log_dir/compile-gradle-exit-code.txt"
          exit "$gradle_status"

      - name: Verify native ABI and instrumentation APK contents
        shell: bash
        run: |
          set -euo pipefail
          app_apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test_apk="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -f "$app_apk"
          test -f "$test_apk"
          if ! unzip -Z1 "$app_apk" | grep -Fxq 'lib/x86_64/libsqlcipher.so'; then
            echo "::error::The app APK does not contain SQLCipher's x86_64 native library."
            unzip -Z1 "$app_apk" | grep '^lib/' || true
            exit 1
          fi
          dex_symbols="$(mktemp)"
          while IFS= read -r dex; do
            unzip -p "$test_apk" "$dex" | strings >> "$dex_symbols"
          done < <(unzip -Z1 "$test_apk" | grep 'classes.*dex' || true)
          if ! grep -q 'LocalPmsRepositoryInstrumentedTest' "$dex_symbols"; then
            echo "::error::The androidTest APK does not contain LocalPmsRepositoryInstrumentedTest."
            exit 1
          fi
          if ! grep -q 'AndroidJUnitRunner' "$dex_symbols"; then
            echo "::error::The androidTest APK does not contain AndroidJUnitRunner symbols."
            exit 1
          fi
          echo "SQLCipher x86_64 library and instrumentation test classes are present."

      - name: Create Android 34 AVD
        shell: bash
        run: |
          set -euo pipefail
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$AVDMANAGER" ]]; then
            AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name avdmanager -perm -u+x | sort | tail -n 1)"
          fi
          test -x "$AVDMANAGER"
          echo no | "$AVDMANAGER" create avd \
            --force --name aurelia-ci-api34 \
            --package "system-images;android-34;google_apis;x86_64" \
            --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo on > "$RUNNER_TEMP/aurelia-emulator/acceleration-mode.txt"
          else
            echo off > "$RUNNER_TEMP/aurelia-emulator/acceleration-mode.txt"
          fi

      - name: Start emulator and capture console output
        shell: bash
        run: |
          set -euo pipefail
          emulator="$ANDROID_HOME/emulator/emulator"
          log_dir="$RUNNER_TEMP/aurelia-emulator"
          accel="$(cat "$log_dir/acceleration-mode.txt")"
          echo "Starting emulator with KVM acceleration: $accel"
          nohup "$emulator" -avd aurelia-ci-api34 -accel "$accel" \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -verbose \
            >"$log_dir/emulator.stdout-stderr.log" 2>&1 &
          echo "$!" > "$log_dir/emulator.pid"
          echo "Emulator process started: PID $(cat "$log_dir/emulator.pid")"
          timeout -k 2s 10s adb start-server || {
            echo "::error::ADB server failed to start within 10 seconds."
            exit 1
          }
          timeout -k 2s 10s adb devices -l || true

      - name: Wait for Android emulator boot completion
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/aurelia-emulator"
          echo "Waiting up to 60 seconds for ADB device enumeration."
          if ! timeout -k 2s 60s adb wait-for-device; then
            echo "ADB did not enumerate the emulator within 60 seconds; continuing bounded boot diagnostics."
          fi
          deadline=$((SECONDS + 900))
          booted=false
          while (( SECONDS < deadline )); do
            state="$(timeout -k 2s 5s adb get-state 2>&1 || true)"
            if [[ "$state" == "device" ]]; then
              boot="$(timeout -k 2s 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            else
              boot="unavailable"
            fi
            echo "Emulator health: adb_state=$state sys.boot_completed=$boot elapsed=$((900 - (deadline - SECONDS)))s"
            if [[ "$state" == "device" && "$boot" == "1" ]]; then
              booted=true
              break
            fi
            sleep 10
          done
          timeout -k 2s 5s adb devices -l > "$log_dir/adb-devices-after-boot.txt" 2>&1 || true
          if [[ "$booted" != true ]]; then
            echo "::error::Android emulator did not reach sys.boot_completed=1 within 900 seconds."
            exit 1
          fi
          adb shell getprop ro.build.fingerprint
          adb shell getprop ro.build.version.sdk

      - name: Execute real SQLite contract tests
        if: success()
        working-directory: android
        shell: bash
        run: |
          set -uo pipefail
          log_dir="$RUNNER_TEMP/aurelia-emulator"
          set +e
          ./gradlew --no-daemon --stacktrace --info connectedDebugAndroidTest 2>&1 | tee "$log_dir/connectedDebugAndroidTest.log"
          gradle_status=${PIPESTATUS[0]}
          echo "$gradle_status" > "$log_dir/gradle-exit-code.txt"
          exit "$gradle_status"

      - name: Require at least one completed instrumentation test
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import glob,sys,xml.etree.ElementTree as ET; paths=glob.glob("android/app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True); total=sum(int(ET.parse(p).getroot().attrib.get("tests","0")) for p in paths); print(f"Instrumentation XML files: {len(paths)}; tests executed: {total}"); sys.exit(0 if total > 0 else "ERROR: zero native instrumentation tests executed")'

      - name: Capture emulator, instrumentation and APK diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          log_dir="$RUNNER_TEMP/aurelia-emulator"
          diag_dir="android/app/build/diagnostics"
          mkdir -p "$log_dir" "$diag_dir"
          {
            echo '=== runner / emulator process ==='
            date -u
            ps -efww | grep -E '[e]mulator|[q]emu|[a]db' || true
            if [[ -f "$log_dir/emulator.pid" ]]; then
              pid="$(cat "$log_dir/emulator.pid")"
              echo "emulator_pid=$pid"
              tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true
              echo
              readlink "/proc/$pid/fd/1" 2>/dev/null || true
              readlink "/proc/$pid/fd/2" 2>/dev/null || true
            fi
            echo '=== adb devices ==='
            timeout -k 2s 5s adb devices -l
            echo '=== adb wait-for-device (bounded) ==='
            timeout -k 2s 8s adb wait-for-device
            echo "wait_for_device_exit=$?"
            echo '=== boot properties ==='
            timeout -k 2s 5s adb shell getprop sys.boot_completed
            timeout -k 2s 5s adb shell getprop ro.build.fingerprint
            timeout -k 2s 5s adb shell getprop ro.build.version.sdk
            echo '=== instrumentation registry ==='
            timeout -k 2s 5s adb shell pm list instrumentation -f
            echo '=== app/test package install state ==='
            echo 'app APK install path:'
            timeout -k 2s 5s adb shell pm path com.aurelia.pms
            echo 'test APK install path:'
            timeout -k 2s 5s adb shell pm path com.aurelia.pms.test
            timeout -k 2s 5s adb shell dumpsys package com.aurelia.pms.test
            echo '=== app/test process exit history ==='
            timeout -k 2s 5s adb shell dumpsys activity exit-info com.aurelia.pms
            timeout -k 2s 5s adb shell dumpsys activity exit-info com.aurelia.pms.test
          } > "$diag_dir/device-state.txt" 2>&1
          timeout -k 2s 8s adb logcat -b crash -d -v threadtime > "$diag_dir/logcat-crash.txt" 2>&1 || true
          timeout -k 2s 8s adb logcat -b all -d -v threadtime > "$diag_dir/logcat-full.txt" 2>&1 || true
          timeout -k 2s 8s adb logcat -b all -d -v threadtime '*:S' AndroidRuntime:E DEBUG:E libc:F linker:E ActivityManager:E ActivityTaskManager:E Instrumentation:E TestRunner:V SQLiteLog:E > "$diag_dir/logcat-startup-filtered.txt" 2>&1 || true
          if [[ -f "$log_dir/emulator.stdout-stderr.log" ]]; then cp "$log_dir/emulator.stdout-stderr.log" "$diag_dir/emulator.stdout-stderr.log"; fi
          if [[ -f "$log_dir/connectedDebugAndroidTest.log" ]]; then cp "$log_dir/connectedDebugAndroidTest.log" "$diag_dir/connectedDebugAndroidTest.log"; fi
          if [[ -f "$log_dir/compile-native-gradle.log" ]]; then cp "$log_dir/compile-native-gradle.log" "$diag_dir/compile-native-gradle.log"; fi
          if [[ -f "$log_dir/compile-gradle-exit-code.txt" ]]; then cp "$log_dir/compile-gradle-exit-code.txt" "$diag_dir/compile-gradle-exit-code.txt"; fi
          if [[ -f "$log_dir/gradle-exit-code.txt" ]]; then cp "$log_dir/gradle-exit-code.txt" "$diag_dir/gradle-exit-code.txt"; fi
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            [[ -f "$apk" ]] || continue
            name="$(basename "$apk" .apk)"
            {
              echo "=== $apk ==="
              unzip -l "$apk"
              echo '=== native ABI libraries ==='
              unzip -Z1 "$apk" | grep -E '^lib/(x86_64|arm64-v8a)/.*\.so$' || true
              echo '=== test/runner DEX symbols ==='
              unzip -Z1 "$apk" | grep 'classes.*dex' | while IFS= read -r dex; do
                unzip -p "$apk" "$dex" | strings | grep -E 'LocalPmsRepositoryInstrumentedTest|AndroidJUnitRunner|com/aurelia/pms' || true
              done
            } > "$diag_dir/$name-apk-inspection.txt" 2>&1
          done
          {
            echo "app_apk_present=$([[ -f android/app/build/outputs/apk/debug/app-debug.apk ]] && echo yes || echo no)"
            echo "test_apk_present=$([[ -f android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ]] && echo yes || echo no)"
            echo "emulator_log_present=$([[ -f "$log_dir/emulator.stdout-stderr.log" ]] && echo yes || echo no)"
            echo "instrumentation_log_present=$([[ -f "$log_dir/connectedDebugAndroidTest.log" ]] && echo yes || echo no)"
          } > "$diag_dir/diagnostic-summary.txt"
          cp -a "$log_dir/." "$diag_dir/emulator-runtime/" 2>/dev/null || true
          exit 0

      - name: Upload native instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-native-sqlite-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
            android/app/build/diagnostics/**
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            ${{ runner.temp }}/aurelia-emulator/**
          if-no-files-found: warn
          retention-days: 14
