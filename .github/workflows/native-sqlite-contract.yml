name: Aurelia native SQLite contract

on:
  push:
    branches:
      - work/p0-storage-hardening
  pull_request:
    branches:
      - feature/multi-provider-payment-backend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-native-sqlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-sqlite-instrumentation:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Run source regression suite
        run: npm test

      - name: Prepare web application
        run: npm run build

      - name: Generate Android project from repository templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$RUNNER_TEMP/aurelia-android-templates"
          if [[ -d android/templates ]]; then mv android/templates "$template_dir"; fi
          if [[ -d android ]]; then rmdir android; fi
          npx cap add android
          if [[ -d "$template_dir" ]]; then mkdir -p android/templates && cp -a "$template_dir/." android/templates/; fi
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Apply native PMS and instrumentation configuration
        run: node scripts/patch-android.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Compile native sources and unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac compileReleaseJavaWithJavac testDebugUnitTest assembleDebug

      - name: Execute real SQLite contract tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set +e
            cd android
            ./gradlew --no-daemon --stacktrace --info connectedDebugAndroidTest
            gradle_status=$?

            diagnostics="app/build/diagnostics"
            mkdir -p "$diagnostics"
            {
              echo "=== emulator ==="
              adb devices -l
              adb shell getprop ro.build.fingerprint
              adb shell getprop ro.build.version.sdk
              echo "=== registered instrumentation ==="
              adb shell pm list instrumentation -f
              echo "=== app process exit history ==="
              adb shell dumpsys activity exit-info com.aurelia.pms
              adb shell dumpsys activity exit-info com.aurelia.pms.test
              echo "=== test package metadata ==="
              adb shell dumpsys package com.aurelia.pms.test
            } > "$diagnostics/device-state.txt" 2>&1 || true

            adb logcat -b crash -d -v threadtime > "$diagnostics/logcat-crash.txt" 2>&1 || true
            adb logcat -b all -d -v threadtime '*:S' AndroidRuntime:E DEBUG:E libc:F linker:E ActivityManager:E ActivityTaskManager:E Instrumentation:E TestRunner:V SQLiteLog:E > "$diagnostics/logcat-startup-filtered.txt" 2>&1 || true

            test_apk="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            if [ -f "$test_apk" ]; then
              {
                echo "=== test APK entries ==="
                unzip -l "$test_apk"
                echo "=== instrumentation/test class DEX strings ==="
                while IFS= read -r dex; do
                  unzip -p "$test_apk" "$dex" | strings | grep -E 'LocalPmsRepositoryInstrumentedTest|AndroidJUnitRunner|com/aurelia/pms' || true
                done < <(unzip -Z1 "$test_apk" | grep -E '^classes([0-9]+)?\\.dex
      - name: Upload native instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-native-sqlite-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
            android/app/build/diagnostics/**
          if-no-files-found: warn
          retention-days: 14
)
              } > "$diagnostics/test-apk-inspection.txt" 2>&1 || true
            fi
            exit "$gradle_status"

      - name: Upload native instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-native-sqlite-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
