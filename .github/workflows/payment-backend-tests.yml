name: Payment backend tests

on:
  push:
    branches: [feature/multi-provider-payment-backend]
    paths:
      - 'payment-backend/**'
      - '.github/workflows/payment-backend-tests.yml'
  pull_request:
    paths:
      - 'payment-backend/**'
      - '.github/workflows/payment-backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
