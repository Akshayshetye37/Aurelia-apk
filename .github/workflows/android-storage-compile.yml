name: Android SQLite storage compile gate
on:
  push:
    branches: ["fix/p0-storage-authority"]
    paths:
      - "src/storage/**"
      - "tests/storage-adapter-quota.test.mjs"
      - "android/templates/LocalPmsRepository.java"
      - "android/templates/CapacitorPmsStoragePlugin.java"
      - "scripts/patch-android.js"
      - "scripts/prepare-web.js"
      - "scripts/check-android-storage-boundary.mjs"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-storage-compile.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/storage/**"
      - "android/templates/LocalPmsRepository.java"
      - "android/templates/CapacitorPmsStoragePlugin.java"
      - "scripts/patch-android.js"
      - "scripts/prepare-web.js"
      - "scripts/check-android-storage-boundary.mjs"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-storage-compile.yml"
permissions:
  contents: read
concurrency:
  group: android-sqlite-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run android:build
      - name: Generate clean Capacitor Android project and restore native templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$RUNNER_TEMP/aurelia-android-templates"
          mv android/templates "$template_dir"
          rmdir android
          npx cap add android
          mkdir -p android/templates
          cp -a "$template_dir/." android/templates/
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - name: Increase Gradle wrapper download timeout
        working-directory: android
        run: |
          set -euo pipefail
          wrapper="gradle/wrapper/gradle-wrapper.properties"
          grep -q '^networkTimeout=' "$wrapper" || printf '\\nnetworkTimeout=120000\\n' >> "$wrapper"
      - name: Compile native SQLite repository and Capacitor plugin
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify packaged assets exclude IndexedDB business adapter
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          if unzip -l "$apk" | grep -E 'assets/public/src/storage/(indexeddb-pms-repository|indexeddb-storage-adapter)\\.mjs'; then
            echo "::error::IndexedDB business adapter was packaged into Android APK."
            exit 1
          fi
          unzip -l "$apk" | grep -F 'assets/public/src/storage/sqlite-storage-adapter.mjs'
          unzip -l "$apk" | grep -F 'assets/public/src/storage/capacitor-pms-storage.mjs'
