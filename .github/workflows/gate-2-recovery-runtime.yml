name: Gate 2 - Recovery runtime evidence
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Frozen candidate SHA (40 lowercase hex)
        required: true
        type: string
  push:
    branches:
      - integration/ledger-patch
    paths:
      - gates/qualification-candidate-sha.txt
      - scripts/gates/**
      - tests/gates.test.mjs
      - .github/workflows/gate-1-encrypted-storage.yml
      - .github/workflows/gate-2-recovery-runtime.yml
permissions: {}
concurrency:
  group: gate-2-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false
jobs:
  evidence:
    if: github.ref == format('refs/heads/{0}', vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BRANCH: fix/backup-consolidated-integration
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted gate tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve frozen candidate SHA for trusted push trigger
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(cat gates/qualification-candidate-sha.txt)"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'CANDIDATE_SHA=%s\n' "$candidate_sha" >> "$GITHUB_ENV"
      - name: Candidate is the exact frozen branch head
        run: node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA" --repo "$REPO" --branch "$CANDIDATE_BRANCH"
      - name: Checkout candidate source for static tripwire only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Recovery workflows are green on the exact candidate SHA
        run: node scripts/gates/verify-runs.mjs --sha "$CANDIDATE_SHA" --repo "$REPO" --group gate2
      - name: Protected flags OFF and App Check source tripwire
        run: node scripts/gates/check-flags.mjs candidate
      - name: Write and bundle Gate 2 evidence
        run: |
          set -euo pipefail
          node scripts/gates/write-evidence.mjs --gate 2 --sha "$CANDIDATE_SHA" --status PASS
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf bundle.tar evidence
      - name: Attest Gate 2 evidence bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: bundle.tar
      - name: Upload Gate 2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-2-evidence
          path: bundle.tar
          if-no-files-found: error
          retention-days: 90
