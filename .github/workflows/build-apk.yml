name: Build and verify Aurelia PMS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'README.md'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run payment and evidence regression tests
        run: npm test

      - name: Prepare web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Install native backup and file bridge
        run: node scripts/patch-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish debug APK as a private-repository prerelease asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="aurelia-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" android/app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Aurelia PMS debug APK (run ${GITHUB_RUN_NUMBER})" \
            --notes "Debug APK built from commit ${GITHUB_SHA}. This is not a production-signed release. Automatic folio settlement remains disabled."
