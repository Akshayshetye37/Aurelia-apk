name: Bootstrap deterministic npm lockfiles on work branches

on:
  workflow_dispatch:
  push:
    branches:
      - 'work/**'
    paths:
      - "package.json"
      - "payment-backend/package.json"
      - ".github/workflows/npm-lockfile-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: aurelia-npm-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate root lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Generate payment backend lockfile
        run: npm --prefix payment-backend install --package-lock-only --no-audit --no-fund
      - name: Verify root clean install
        run: npm ci --no-audit --no-fund
      - name: Verify payment backend clean install
        run: npm --prefix payment-backend ci --no-audit --no-fund
      - name: Verify complete PMS suite
        run: npm test
      - name: Verify guarded payment backend suite
        run: npm --prefix payment-backend run test:ci
      - name: Commit generated lockfiles to this work branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json payment-backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "build: add reproducible npm lockfiles"
          git push origin "HEAD:${BRANCH_NAME}"
