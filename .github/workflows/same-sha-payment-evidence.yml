name: Same-SHA payment evidence gate

on:
  workflow_run:
    workflows:
      - Aurelia payment backend CI
      - PMS source tests and production web packaging
    types:
      - completed
    branches:
      - work/local-ledger-receipt
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: same-sha-payment-evidence-${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  same-sha-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for both required workflows on the exact SHA
        uses: actions/github-script@v7
        with:
          script: |
            const expectedSha = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.candidate_sha
              : context.payload.workflow_run.head_sha;
            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed('Invalid candidate SHA');
              return;
            }

            const required = new Map([
              [406286294, 'Aurelia payment backend CI'],
              [403493159, 'PMS source tests and production web packaging'],
            ]);
            let completed = false;

            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: expectedSha,
                per_page: 100,
              });
              const outcomes = [];
              for (const [workflowId, label] of required) {
                const matching = data.workflow_runs
                  .filter(run => run.workflow_id === workflowId && run.head_sha === expectedSha)
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                const run = matching[0];
                if (!run) {
                  outcomes.push(`${label}: missing`);
                } else {
                  outcomes.push(`${label}: ${run.status}/${run.conclusion || 'pending'} (${run.html_url})`);
                }
              }
              core.info(`Attempt ${attempt}/30 for ${expectedSha}: ${outcomes.join('; ')}`);

              const runs = [...required.keys()].map(workflowId =>
                data.workflow_runs
                  .filter(run => run.workflow_id === workflowId && run.head_sha === expectedSha)
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0]
              );
              if (runs.every(Boolean) && runs.every(run => run.status === 'completed')) {
                const failures = runs.filter(run => run.conclusion !== 'success');
                if (failures.length) {
                  core.setFailed(`Required workflow failure on ${expectedSha}: ${failures.map(run => `${run.name}=${run.conclusion}`).join(', ')}`);
                  return;
                }
                completed = true;
                core.notice(`Both required workflows passed on exact SHA ${expectedSha}`);
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 20000));
            }

            if (!completed) {
              core.setFailed(`Timed out waiting for both required workflows to complete successfully on ${expectedSha}`);
            }
