name: Validate Aurelia PMS Debug Build (not for Pay Bridge pairing)

# Manual QA-only workflow. Do not run until the documented PMS release gates authorize device-build validation.
# The resulting debug APK is not a signed production release and is not compatible with the Pay Bridge pairing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelia-pms-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout PMS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Run PMS regression suite
        run: npm test

      - name: Prepare web application
        run: npm run build

      - name: Generate Android project from Capacitor templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$RUNNER_TEMP/aurelia-android-templates"
          if [[ -d android/templates ]]; then
            mv android/templates "$template_dir"
          fi
          if [[ -d android ]]; then
            rmdir android
          fi
          npx cap add android
          if [[ -d "$template_dir" ]]; then
            mkdir -p android/templates
            cp -a "$template_dir/." android/templates/
          fi
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Configure Aurelia staging Firebase SDK
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.FIREBASE_GOOGLE_SERVICES_JSON;
          if (!raw) {
            throw new Error('Missing GitHub Actions secret FIREBASE_GOOGLE_SERVICES_JSON. Add the staging google-services.json contents as this secret before running the build.');
          }
          let config;
          try {
            config = JSON.parse(raw);
          } catch {
            throw new Error('FIREBASE_GOOGLE_SERVICES_JSON is not valid JSON.');
          }
          const clients = Array.isArray(config.client) ? config.client : [];
          const validClient = clients.some(client =>
            client?.client_info?.android_client_info?.package_name === 'com.aurelia.pms' &&
            client?.client_info?.mobilesdk_app_id === '1:761295649001:android:065c781ce7176b3dedd878'
          );
          if (
            config?.project_info?.project_id !== 'aurelia-staging-992db' ||
            config?.project_info?.project_number !== '761295649001' ||
            !validClient
          ) {
            throw new Error('Firebase config does not match the registered Aurelia-Staging Android app; refusing to write Firebase config.');
          }
          fs.mkdirSync('android/app', { recursive: true });
          fs.writeFileSync('android/app/google-services.json', raw, { encoding: 'utf8', mode: 0o600, flag: 'wx' });
          console.log('Validated Aurelia-Staging Firebase config for com.aurelia.pms. Do not print or upload google-services.json.');
          NODE

      - name: Apply PMS Android configuration
        run: node scripts/patch-android.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac compileReleaseJavaWithJavac testDebugUnitTest assembleDebug

      - name: Run real SQLite instrumentation suite on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Preserve Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aurelia-pms-android-instrumentation-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK package identity and signature
        working-directory: android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/aurelia-pms-badging.txt"
          grep -F "package: name='com.aurelia.pms'" "$RUNNER_TEMP/aurelia-pms-badging.txt"
          sha256sum "$apk" > "$apk.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/aurelia-pms-signing-certificate.txt"
          grep -F "Signer #1 certificate SHA-1 digest:" "$RUNNER_TEMP/aurelia-pms-signing-certificate.txt"
          grep -F "Signer #1 certificate SHA-256 digest:" "$RUNNER_TEMP/aurelia-pms-signing-certificate.txt"
          {
            echo "### Exact debug APK signing certificate fingerprints"
            echo 'Register the SHA-1 in Firebase Android app settings and the SHA-256 in Firebase App Check for this exact APK.'
            echo '\`\`\`text'
            cat "$RUNNER_TEMP/aurelia-pms-signing-certificate.txt"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload standalone PMS debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aurelia-pms-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Mark debug build as standalone only
        run: |
          echo "This debug APK is not compatible with the signature-protected Pay Bridge service." >> "$GITHUB_STEP_SUMMARY"
          echo "Use the signed release workflow and install the PMS/Pay Bridge pair built with the same release keystore." >> "$GITHUB_STEP_SUMMARY"
