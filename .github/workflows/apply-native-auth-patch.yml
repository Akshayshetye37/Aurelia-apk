name: Apply native authentication and SQLCipher cutover
on:
  push:
    branches:
      - feature/native-device-auth-sqlcipher-cutover
permissions:
  contents: write
concurrency:
  group: native-auth-patch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reassemble and apply isolated source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/native-auth.patch.chunk.*.bin > "$RUNNER_TEMP/native-auth.patch.gz"
          gzip -t "$RUNNER_TEMP/native-auth.patch.gz"
          gzip -dc "$RUNNER_TEMP/native-auth.patch.gz" > "$RUNNER_TEMP/native-auth.patch"
          git apply --index "$RUNNER_TEMP/native-auth.patch"
          git diff --cached --check
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run repository contract and regression tests
        run: npm test
      - name: Prepare production web bundle
        run: npm run build
      - name: Audit locked dependency tree
        run: npm audit
      - name: Remove temporary patch transport and build output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          git rm -r .github/patches
          git add -A
          git diff --cached --check
      - name: Commit verified source changes to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No source changes were staged."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use Android device authentication for canonical SQLCipher PMS storage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
