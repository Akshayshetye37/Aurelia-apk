name: Aurelia R1 local-first required checks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: aurelia-r1-local-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r1-local-quality:
    name: R1 / Local PMS tests, build and release-boundary guard
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert checkout is the event SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Scan repository for committed credentials
        run: node scripts/check-secrets.mjs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Assert R1 release flags default OFF
        run: node --test tests/release-defaults.test.mjs
      - name: Run complete PMS test suite
        run: npm test

      - name: Enforce canonical storage boundary
        run: node scripts/check-storage-boundaries.mjs
      - name: Build production web bundle
        run: npm run build
      - name: Enforce production asset privacy boundaries
        run: node scripts/check-release-boundaries.mjs
      - name: Record exact candidate and R1 boundary in job summary
        run: |
          {
            echo "## R1 local-first verification"
            echo "- Candidate SHA: ${GITHUB_SHA}"
            echo "- Checkout SHA: $(git rev-parse HEAD)"
            echo "- Scope: local PMS tests, production web bundle and release-boundary check."
            echo "- Not qualified: Android APK/device, accounting backup/sign-off, provider sandbox, Pay Bridge, sync or production release."
          } >> "$GITHUB_STEP_SUMMARY"
