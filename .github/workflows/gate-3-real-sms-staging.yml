name: Gate 3 - Real SMS staging

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      run_ids:
        required: true
        type: string
        description: "Upstream runs as gate:runId,gate:runId"
permissions: {}

concurrency:
  group: gate-3-${{ inputs.candidate_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  staging-deploy:
    uses: ./.github/workflows/recovery-staging-deploy.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
    permissions: {contents: read, id-token: write}

  evidence:
    needs: staging-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: recovery-staging-evidence
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BRANCH: ${{ vars.FROZEN_CANDIDATE_BRANCH }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_ENABLED: "false"
      RUN_IDS: ${{ inputs.run_ids }}
      REQUIRE: "1,2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen candidate
        run: node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA"
      - name: Verify Gates 1-2 evidence and attestations
        run: scripts/gates/fetch-and-verify.sh
      - name: Probe staging App Check
        run: |
          mkdir -p proofs
          node scripts/gates/staging-probes.mjs | tee proofs/gate3-probes.log
      - name: Validate independent real-SMS attestation
        run: node scripts/gates/validate-attestation.mjs --kind sms --file gates/attestations/gate3-sms.json --sha "$CANDIDATE_SHA"
      - name: Write evidence
        run: node scripts/gates/write-evidence.mjs --gate 3 --sha "$CANDIDATE_SHA" --proof proofs/gate3-probes.log --proof gates/attestations/gate3-sms.json
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.x
        with:
          name: gate-3-evidence-${{ inputs.candidate_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Attest evidence record
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.x
        with:
          subject-path: evidence/gate-3.json
