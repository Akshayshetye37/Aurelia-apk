name: Recovery hardware-attestation verifier deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: recovery-attestation-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: recovery-staging
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate staging deployment configuration
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.RECOVERY_ATTESTATION_SERVICE_ACCOUNT }}
          FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.RECOVERY_FUNCTIONS_SERVICE_ACCOUNT }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          APP_PACKAGE: ${{ vars.ATTESTATION_APP_PACKAGE }}
          APP_MIN_VERSION: ${{ vars.ATTESTATION_APP_MIN_VERSION }}
          APP_SIGNER_SHA256: ${{ vars.ATTESTATION_APP_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION RUNTIME_SERVICE_ACCOUNT FUNCTIONS_SERVICE_ACCOUNT DEPLOY_SERVICE_ACCOUNT APP_PACKAGE APP_MIN_VERSION APP_SIGNER_SHA256; do
            if [ -z "${!name}" ]; then echo "::error::Missing required GitHub environment variable: $name"; exit 1; fi
          done
          if [[ "$DEPLOY_SERVICE_ACCOUNT" == "$FUNCTIONS_SERVICE_ACCOUNT" ]]; then
            echo "::error::Use separate deploy and Functions runtime service accounts; self-impersonation is not supported."
            exit 1
          fi
          [[ "$APP_SIGNER_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
          [[ "$APP_MIN_VERSION" =~ ^[1-9][0-9]*$ ]]
          SA_POLICY="$(gcloud iam service-accounts get-iam-policy "$FUNCTIONS_SERVICE_ACCOUNT" --project "$PROJECT_ID" --format=json)"
          if ! echo "$SA_POLICY" | jq -e --arg member "serviceAccount:$DEPLOY_SERVICE_ACCOUNT" '
            [.bindings[]? | select(.role=="roles/iam.serviceAccountOpenIdTokenCreator") |
              .members[]? | select(. == $member)] | length == 1
          ' >/dev/null; then
            echo "::error::Grant roles/iam.serviceAccountOpenIdTokenCreator on the Functions runtime service account to the staging deploy service account."
            exit 1
          fi

      - name: Build isolated verifier image
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com
          gcloud artifacts repositories describe aurelia-recovery --location "$REGION" >/dev/null 2>&1 ||
            gcloud artifacts repositories create aurelia-recovery --repository-format=docker --location "$REGION" --description="Aurelia recovery security services"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/aurelia-recovery/device-attestation:$GITHUB_SHA"
          gcloud builds submit --config cloudbuild-recovery-attestation.yaml --substitutions="_IMAGE=$IMAGE" .

      - name: Deploy verifier with IAM authentication only
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.RECOVERY_ATTESTATION_SERVICE_ACCOUNT }}
          FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.RECOVERY_FUNCTIONS_SERVICE_ACCOUNT }}
          APP_PACKAGE: ${{ vars.ATTESTATION_APP_PACKAGE }}
          APP_MIN_VERSION: ${{ vars.ATTESTATION_APP_MIN_VERSION }}
          APP_SIGNER_SHA256: ${{ vars.ATTESTATION_APP_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/aurelia-recovery/device-attestation:$GITHUB_SHA"
          gcloud run deploy aurelia-recovery-attestation \
            --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --no-allow-unauthenticated --ingress all \
            --set-env-vars "ATTESTATION_BIND_HOST=0.0.0.0,PORT=8080,ATTESTATION_APP_PACKAGE=$APP_PACKAGE,ATTESTATION_APP_MIN_VERSION=$APP_MIN_VERSION,ATTESTATION_APP_SIGNER_SHA256=$APP_SIGNER_SHA256" \
            --cpu 1 --memory 512Mi --min 0 --max 3 --concurrency 4 --timeout 15s
          POLICY_FILE="$RUNNER_TEMP/aurelia-attestation-iam.json"
          gcloud run services get-iam-policy aurelia-recovery-attestation \
            --project "$PROJECT_ID" --region "$REGION" --format=json > "$POLICY_FILE"
          jq --arg member "serviceAccount:$FUNCTIONS_SERVICE_ACCOUNT" '
            .bindings = ([.bindings[]? | select(.role != "roles/run.invoker")] +
              [{"role":"roles/run.invoker","members":[$member]}])
          ' "$POLICY_FILE" > "$POLICY_FILE.next"
          gcloud run services set-iam-policy aurelia-recovery-attestation "$POLICY_FILE.next" \
            --project "$PROJECT_ID" --region "$REGION"
          gcloud run services describe aurelia-recovery-attestation --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)'

      
      - name: Verify verifier IAM policy and fail-closed HTTP probes
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.RECOVERY_FUNCTIONS_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe aurelia-recovery-attestation --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          test -n "$URL"
          POLICY="$(gcloud run services get-iam-policy aurelia-recovery-attestation --project "$PROJECT_ID" --region "$REGION" --format=json)"
          if echo "$POLICY" | jq -e '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]? | select(. == "allUsers" or . == "allAuthenticatedUsers")] | length > 0' >/dev/null; then
            echo "::error::Attestation verifier has a public invoker binding."
            exit 1
          fi
          if ! echo "$POLICY" | jq -e --arg member "serviceAccount:$FUNCTIONS_SERVICE_ACCOUNT" '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]? | select(. == $member)] | length == 1' >/dev/null; then
            echo "::error::Functions runtime service account is missing roles/run.invoker."
            exit 1
          fi
          unauth="$(curl -sS -o "$RUNNER_TEMP/attestation-unauth.json" -w '%{http_code}' "$URL/healthz")"
          if [[ "$unauth" != "401" && "$unauth" != "403" ]]; then
            echo "::error::Unauthenticated verifier probe expected 401/403, received $unauth."
            exit 1
          fi
          TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="$FUNCTIONS_SERVICE_ACCOUNT" --audiences="$URL" --include-email)"
          health="$(curl -sS -o "$RUNNER_TEMP/attestation-health.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/healthz")"
          if [[ "$health" != "200" ]]; then
            echo "::error::Authenticated verifier health probe failed with HTTP $health."
            exit 1
          fi
          malformed="$(curl -sS -o "$RUNNER_TEMP/attestation-invalid.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"certificateChainBase64":[],"challengeBase64":"AAAAAAAAAAAAAAAAAAAAAA"}' "$URL/verify")"
          if [[ "$malformed" != "400" ]]; then
            echo "::error::Authenticated malformed attestation must fail closed with HTTP 400; received $malformed."
            exit 1
          fi
          echo "Verifier IAM is private; authenticated health succeeds; malformed attestation is rejected."
