name: Recovery staging deployment and APK

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional exact candidate SHA for direct staging qualification
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate SHA to deploy and build
        required: true
        type: string
    outputs:
      staging_project_id:
        description: Non-secret staging project identifier
        value: ${{ jobs.deploy-and-build.outputs.staging_project_id }}
      production_project_id:
        description: Non-secret production project identifier
        value: ${{ jobs.deploy-and-build.outputs.production_project_id }}
      gcp_region:
        description: Staging Functions region
        value: ${{ jobs.deploy-and-build.outputs.gcp_region }}
      functions_base_url:
        description: HTTPS staging callable base URL
        value: ${{ jobs.deploy-and-build.outputs.functions_base_url }}
      recovery_callables:
        description: Owner-verification callable names covered by App Check probes
        value: ${{ jobs.deploy-and-build.outputs.recovery_callables }}
      signer_sha256:
        description: Release signer certificate SHA-256 fingerprint
        value: ${{ jobs.deploy-and-build.outputs.signer_sha256 }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: recovery-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-and-build:
    if: (github.workflow_ref == format('{0}/.github/workflows/gate-3-real-sms-staging.yml@refs/heads/{1}', github.repository, vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch')) || (github.workflow_ref == format('{0}/.github/workflows/recovery-staging-deploy.yml@refs/heads/integration/ledger-patch', github.repository))
    runs-on: ubuntu-latest
    outputs:
      staging_project_id: ${{ steps.staging-outputs.outputs.staging_project_id }}
      production_project_id: ${{ steps.staging-outputs.outputs.production_project_id }}
      gcp_region: ${{ steps.staging-outputs.outputs.gcp_region }}
      functions_base_url: ${{ steps.staging-outputs.outputs.functions_base_url }}
      recovery_callables: ${{ steps.staging-outputs.outputs.recovery_callables }}
      signer_sha256: ${{ steps.staging-outputs.outputs.signer_sha256 }}
    environment: recovery-staging
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      CANDIDATE_BRANCH: integration/ledger-patch
      CONTROL_BRANCH: ${{ vars.GATE_CONTROL_BRANCH || 'integration/ledger-patch' }}
      GH_TOKEN: ${{ github.token }}
      STAGING_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      PRODUCTION_PROJECT: ${{ vars.PRODUCTION_GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
      STAGING_FUNCTIONS_BASE_URL: ${{ vars.STAGING_FUNCTIONS_BASE_URL }}
      RECOVERY_CALLABLES: ${{ vars.RECOVERY_CALLABLES || 'exchangeOwnerEmailLink,confirmRecoveryOwnerBinding,registerRecoveryOwnerDevice,acknowledgeRecoveryOwnerAlert,getRecoveryOwnerPendingAction,getRecoveryOwnerActionReadiness' }}
      EXPECTED_SIGNER_SHA256: ${{ vars.ATTESTATION_APP_SIGNER_SHA256 }}
    steps:
      - name: Checkout trusted workflow control revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact candidate source before staging deployment
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_WORKFLOW_REF" in
            "$GITHUB_REPOSITORY/.github/workflows/gate-3-real-sms-staging.yml@refs/heads/$CONTROL_BRANCH")
              node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA" --repo "$GITHUB_REPOSITORY" --branch "$CANDIDATE_BRANCH" ;;
            "$GITHUB_REPOSITORY/.github/workflows/recovery-staging-deploy.yml@refs/heads/integration/ledger-patch")
              test "$CANDIDATE_BRANCH" = "integration/ledger-patch"
              test "$CANDIDATE_SHA" = "$GITHUB_SHA" ;;
            *) echo "::error::Untrusted workflow ref cannot invoke staging deployment."; exit 1 ;;
          esac
      - name: Checkout candidate source as build input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Build candidate Functions before granting deployment credentials
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix functions --ignore-scripts --no-audit --no-fund
          npm --prefix functions run build
          npm --prefix functions test
          npm install --global firebase-tools@13.31.2 --ignore-scripts --no-audit --no-fund
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
            if (!config.functions || config.functions.source !== "functions" || config.functions.runtime !== "nodejs22") {
              throw new Error("Unexpected Firebase Functions deployment configuration");
            }
            delete config.functions.predeploy;
            fs.writeFileSync("firebase.deploy.json", JSON.stringify(config, null, 2) + "\n", { mode: 0o600 });
          '
          test -s functions/lib/index.js
          test -s firebase.deploy.json

      - name: Preflight staging configuration before cloud authentication
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          STAGING_DEPLOY_SERVICE_ACCOUNT: ${{ vars.STAGING_DEPLOY_SERVICE_ACCOUNT || secrets.STAGING_DEPLOY_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          PRODUCTION_GCP_PROJECT_ID: ${{ vars.PRODUCTION_GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
          STAGING_FUNCTIONS_BASE_URL: ${{ vars.STAGING_FUNCTIONS_BASE_URL }}
          RECOVERY_FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.RECOVERY_FUNCTIONS_SERVICE_ACCOUNT }}
          RECOVERY_ATTESTATION_VERIFIER_URL: ${{ vars.RECOVERY_ATTESTATION_VERIFIER_URL }}
          RECOVERY_SIGNING_KEY_ID: ${{ vars.RECOVERY_SIGNING_KEY_ID }}
          RECOVERY_GRANT_PUBLIC_KEYS_JSON: ${{ vars.RECOVERY_GRANT_PUBLIC_KEYS_JSON }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          APP_CHECK_PLAY_INTEGRITY_REGISTERED: ${{ vars.APP_CHECK_PLAY_INTEGRITY_REGISTERED }}
          APP_CHECK_SIGNER_SHA256: ${{ vars.APP_CHECK_SIGNER_SHA256 }}
          ATTESTATION_APP_SIGNER_SHA256: ${{ vars.ATTESTATION_APP_SIGNER_SHA256 }}
          RECOVERY_CALLABLES: ${{ vars.RECOVERY_CALLABLES || 'exchangeOwnerEmailLink,confirmRecoveryOwnerBinding,registerRecoveryOwnerDevice,acknowledgeRecoveryOwnerAlert,getRecoveryOwnerPendingAction,getRecoveryOwnerActionReadiness' }}
        run: |
          node --check scripts/gates/staging-config-preflight.mjs
          node --test scripts/gates/staging-config-preflight.test.mjs
          node scripts/gates/staging-config-preflight.mjs

      - name: Validate Workload Identity Federation configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.STAGING_DEPLOY_SERVICE_ACCOUNT || secrets.STAGING_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "$WIF_PROVIDER" ]]; then
            echo "::error::Missing recovery-staging configuration: GCP_WORKLOAD_IDENTITY_PROVIDER (GitHub Environment variable recommended; secret fallback supported)."
            exit 1
          fi
          if [[ -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing recovery-staging configuration: STAGING_DEPLOY_SERVICE_ACCOUNT (GitHub Environment variable recommended; secret fallback supported)."
            exit 1
          fi
          if [[ ! "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER must be a full Google WIF provider resource name."
            exit 1
          fi
          if [[ ! "$DEPLOY_SERVICE_ACCOUNT" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.iam\\.gserviceaccount\\.com$ ]]; then
            echo "::error::STAGING_DEPLOY_SERVICE_ACCOUNT must be a Google service-account email."
            exit 1
          fi
          echo "PASS: Workload Identity Federation provider and deploy service-account identifiers are present and well-formed."

      - name: Authenticate to staging Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_DEPLOY_SERVICE_ACCOUNT || secrets.STAGING_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Validate staging configuration without printing secrets
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          PRODUCTION_PROJECT_ID: ${{ vars.PRODUCTION_GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          FUNCTIONS_BASE_URL: ${{ vars.STAGING_FUNCTIONS_BASE_URL }}
          RECOVERY_CALLABLES: ${{ vars.RECOVERY_CALLABLES || 'exchangeOwnerEmailLink,confirmRecoveryOwnerBinding,registerRecoveryOwnerDevice,acknowledgeRecoveryOwnerAlert,getRecoveryOwnerPendingAction,getRecoveryOwnerActionReadiness' }}
          FUNCTION_SA: ${{ vars.RECOVERY_FUNCTIONS_SERVICE_ACCOUNT }}
          VERIFIER_URL: ${{ vars.RECOVERY_ATTESTATION_VERIFIER_URL }}
          ACTIVE_KID: ${{ vars.RECOVERY_SIGNING_KEY_ID }}
          PUBLIC_KEYS: ${{ vars.RECOVERY_GRANT_PUBLIC_KEYS_JSON }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          APP_CHECK_REGISTERED: ${{ vars.APP_CHECK_PLAY_INTEGRITY_REGISTERED }}
          APP_CHECK_SIGNER_SHA256: ${{ vars.APP_CHECK_SIGNER_SHA256 }}
          ATTESTATION_SIGNER_SHA256: ${{ vars.ATTESTATION_APP_SIGNER_SHA256 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_B64: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STAGING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_BRANCH" != "integration/ledger-patch" ]]; then
            echo "::error::Candidate deployment is restricted to the protected staging qualification branch."
            exit 1
          fi
          if [[ "$PROJECT_ID" == "$PRODUCTION_PROJECT_ID" ]]; then
            echo "::error::Staging deployment is blocked because the project is production."; exit 1
          fi
          for name in PROJECT_ID PRODUCTION_PROJECT_ID REGION FUNCTIONS_BASE_URL RECOVERY_CALLABLES FUNCTION_SA VERIFIER_URL ACTIVE_KID PUBLIC_KEYS FIREBASE_WEB_API_KEY APP_CHECK_REGISTERED APP_CHECK_SIGNER_SHA256 ATTESTATION_SIGNER_SHA256 GOOGLE_SERVICES_JSON KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing recovery-staging environment setting: $name"; exit 1; fi
          done
          if [[ "$PROJECT_ID" == "$PRODUCTION_PROJECT_ID" ]]; then
            echo "::error::Staging deployment is blocked because GCP_PROJECT_ID equals the configured production project."
            exit 1
          fi
          if [[ "$APP_CHECK_REGISTERED" != "true" ]]; then
            echo "::error::Register com.aurelia.pms with Play Integrity in Firebase App Check before staging deployment."
            exit 1
          fi
          APP_CHECK_CERT="$(echo "$APP_CHECK_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          ATTESTATION_CERT="$(echo "$ATTESTATION_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          if [[ "$APP_CHECK_CERT" != "$ATTESTATION_CERT" ]]; then
            echo "::error::Firebase App Check and hardware-attestation signer fingerprints must match the release APK signer."
            exit 1
          fi
          node -e 'const u=new URL(process.env.FUNCTIONS_BASE_URL); const h=process.env.REGION+"-"+process.env.PROJECT_ID+".cloudfunctions.net"; if(u.protocol!=="https:" || u.hostname!==h || u.username || u.password || u.port || u.pathname!=="/" || u.search || u.hash) process.exit(1);'
          node -e 'const a=process.env.RECOVERY_CALLABLES.split(",").map(x=>x.trim()).filter(Boolean); if(!a.length || new Set(a).size!==a.length || a.some(x=>!/^[A-Za-z0-9_-]+$/.test(x))) process.exit(1);'
          node -e 'const o=JSON.parse(process.env.PUBLIC_KEYS); if(!o[process.env.ACTIVE_KID]) process.exit(1);'
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aurelia-staging-release.jks"
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$RUNNER_TEMP/google-services.json"
          export GOOGLE_SERVICES_PATH="$RUNNER_TEMP/google-services.json"
          node -e 'const c=require(process.env.GOOGLE_SERVICES_PATH); const p=c.client?.find(x=>x.client_info?.android_client_info?.package_name==="com.aurelia.pms"); const key=p?.api_key?.[0]?.current_key; if(!p || c.project_info?.project_id!==process.env.PROJECT_ID || key!==process.env.FIREBASE_WEB_API_KEY) process.exit(1);'
          gcloud config set project "$PROJECT_ID"
          for secret in PHONE_PEPPER RECOVERY_SIGNING_KEY_PKCS8; do
            gcloud secrets describe "$secret" --project "$PROJECT_ID" >/dev/null
            version="$(gcloud secrets versions list "$secret" --project "$PROJECT_ID" --filter='state=ENABLED' --format='value(name)' | head -n 1)"
            test -n "$version"
          done
          gcloud secrets versions access latest --secret RECOVERY_SIGNING_KEY_PKCS8 --project "$PROJECT_ID" > "$RUNNER_TEMP/recovery-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/recovery-signing-key.pem"
          export RECOVERY_PRIVATE_KEY_PATH="$RUNNER_TEMP/recovery-signing-key.pem"
          node -e 'const fs=require("fs"), crypto=require("crypto"); const pins=JSON.parse(process.env.PUBLIC_KEYS); const key=crypto.createPrivateKey(fs.readFileSync(process.env.RECOVERY_PRIVATE_KEY_PATH)); const publicKey=crypto.createPublicKey(key).export({type:"spki",format:"der"}).toString("base64"); if(pins[process.env.ACTIVE_KID]!==publicKey) { console.error("Active APK public pin does not match the Secret Manager signing key."); process.exit(1); }'
          rm -f "$RUNNER_TEMP/recovery-signing-key.pem"
          echo "Staging project, matching active public pin/private key, app config, signing keystore and Secret Manager versions are present."

      - name: Deploy Firebase Functions with staging-only recovery enabled
        working-directory: candidate
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ACTIVE_KID: ${{ vars.RECOVERY_SIGNING_KEY_ID }}
          VERIFIER_URL: ${{ vars.RECOVERY_ATTESTATION_VERIFIER_URL }}
          FUNCTION_SA: ${{ vars.RECOVERY_FUNCTIONS_SERVICE_ACCOUNT }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
        run: |
          set -euo pipefail
          printf 'RECOVERY_ENABLED=true\nRECOVERY_SIGNING_KEY_ID=%s\nRECOVERY_ATTESTATION_VERIFIER_URL=%s\nRECOVERY_FUNCTIONS_SERVICE_ACCOUNT=%s\nFIREBASE_WEB_API_KEY=%s\n' \
            "$ACTIVE_KID" "$VERIFIER_URL" "$FUNCTION_SA" "$FIREBASE_WEB_API_KEY" > "functions/.env.$PROJECT_ID"
          firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --config firebase.deploy.json
          rm -f "functions/.env.$PROJECT_ID" firebase.deploy.json
          FUNCTION_JSON="$(gcloud functions describe verifyRecoveryDeviceAttestation --gen2 --project "$PROJECT_ID" --region "$GCP_REGION" --format=json)"
          echo "$FUNCTION_JSON" | jq -e --arg sa "$FUNCTION_SA" '
            .serviceConfig.serviceAccountEmail == $sa and
            .serviceConfig.environmentVariables.RECOVERY_ENABLED == "true"
          ' >/dev/null
          echo "Staging recovery functions deployed with the configured service account and RECOVERY_ENABLED=true."

      - name: Verify deployed recovery runtime service accounts can access their secrets
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
        run: |
          set -euo pipefail
          bindings=(
            "registerRecoveryPhone:PHONE_PEPPER"
            "registerRecoveryOwnerDevice:PHONE_PEPPER"
            "acknowledgeRecoveryOwnerAlert:PHONE_PEPPER"
            "issueRecoveryGrant:PHONE_PEPPER,RECOVERY_SIGNING_KEY_PKCS8"
            "consumeRecoveryGrant:PHONE_PEPPER,RECOVERY_SIGNING_KEY_PKCS8"
          )
          for binding in "${bindings[@]}"; do
            function_name="${binding%%:*}"
            secret_list="${binding#*:}"
            function_json="$(gcloud functions describe "$function_name" --gen2 --project "$PROJECT_ID" --region "$REGION" --format=json)"
            runtime_sa="$(echo "$function_json" | jq -r '.serviceConfig.serviceAccountEmail // empty')"
            if [[ -z "$runtime_sa" ]]; then
              echo "::error::Could not determine runtime service account for $function_name."
              exit 1
            fi
            IFS=',' read -r -a secrets <<< "$secret_list"
            for secret in "${secrets[@]}"; do
              policy="$(gcloud secrets get-iam-policy "$secret" --project "$PROJECT_ID" --format=json)"
              if ! echo "$policy" | jq -e --arg member "serviceAccount:$runtime_sa" '
                [.bindings[]? | select(.role=="roles/secretmanager.secretAccessor") |
                  .members[]? | select(. == $member)] | length > 0
              ' >/dev/null; then
                echo "::error::Runtime service account for $function_name lacks secretAccessor on $secret."
                exit 1
              fi
            done
            echo "PASS: $function_name runtime identity has access to its declared secrets."
          done

      - name: Probe missing and invalid App Check tokens on every owner-verification callable
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
        run: |
          set -euo pipefail
          functions=(exchangeOwnerEmailLink confirmRecoveryOwnerBinding registerRecoveryOwnerDevice acknowledgeRecoveryOwnerAlert getRecoveryOwnerPendingAction getRecoveryOwnerActionReadiness)
          for function_name in "${functions[@]}"; do
            url="https://${REGION}-${PROJECT_ID}.cloudfunctions.net/${function_name}"
            missing_code="$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 10 -sS -o "$RUNNER_TEMP/appcheck-missing.json" -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data '{"data":{}}')"
            if [[ "$missing_code" != "401" && "$missing_code" != "403" ]]; then
              echo "::error::${function_name} accepted a request without an App Check token (HTTP $missing_code)."
              exit 1
            fi
            invalid_code="$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 10 -sS -o "$RUNNER_TEMP/appcheck-invalid.json" -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' -H 'X-Firebase-AppCheck: invalid-staging-probe-token' --data '{"data":{}}')"
            if [[ "$invalid_code" != "401" && "$invalid_code" != "403" ]]; then
              echo "::error::${function_name} did not reject an invalid App Check token (HTTP $invalid_code)."
              exit 1
            fi
            echo "PASS: ${function_name} rejects missing and invalid App Check tokens."
          done

      - name: Revoke staging deployment credentials after staging qualification
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth revoke --all --quiet
          active_accounts="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          if [[ -n "$active_accounts" ]]; then
            echo "::error::Active Google Cloud credentials remain after revocation."
            exit 1
          fi
          for credential_path in "${GOOGLE_APPLICATION_CREDENTIALS:-}" "${GOOGLE_GHA_CREDS_PATH:-}" "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"; do
            if [[ -n "$credential_path" ]]; then rm -f "$credential_path"; fi
          done
          {
            echo 'GOOGLE_APPLICATION_CREDENTIALS='
            echo 'GOOGLE_GHA_CREDS_PATH='
            echo 'CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE='
          } >> "$GITHUB_ENV"
          rm -rf "$HOME/.config/gcloud"
          echo "Staging deployment credentials revoked and verified inactive before Android build."

      - name: Generate Android project and inject staging Firebase config
        working-directory: candidate
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run build
          template_dir="$RUNNER_TEMP/aurelia-android-templates"
          mv android/templates "$template_dir"
          rmdir android
          npx cap add android
          mkdir -p android/templates android/app
          cp -a "$template_dir/." android/templates/
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Apply pinned recovery key ring and release signing
        working-directory: candidate
        env:
          RECOVERY_GRANT_PUBLIC_KEYS_JSON: ${{ vars.RECOVERY_GRANT_PUBLIC_KEYS_JSON }}
          AURELIA_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/aurelia-staging-release.jks
          STAGING_KEYSTORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          STAGING_KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
          STAGING_KEY_PASSWORD: ${{ secrets.STAGING_KEY_PASSWORD }}
          AURELIA_ANDROID_TEST_BUILD_TYPE: release
        run: |
          set -euo pipefail
          node scripts/patch-android.js
          npx cap sync android

      - name: Build staging APK
        working-directory: candidate/android
        env:
          AURELIA_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/aurelia-staging-release.jks
          STAGING_KEYSTORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          STAGING_KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
          STAGING_KEY_PASSWORD: ${{ secrets.STAGING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease assembleReleaseAndroidTest

      - name: Verify APK signature and staging Firebase project
        working-directory: candidate
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          EXPECTED_SIGNER_SHA256: ${{ vars.ATTESTATION_APP_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TEST_APK="android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          test -s "$APK"
          test -s "$TEST_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certificate.txt"
          "$APKSIGNER" verify --print-certs "$TEST_APK" > "$RUNNER_TEMP/androidTest-certificate.txt"
          ACTUAL_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2)}' "$RUNNER_TEMP/apk-certificate.txt" | tr -d ':')"
          TEST_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2)}' "$RUNNER_TEMP/androidTest-certificate.txt" | tr -d ':')"
          EXPECTED="$(echo "$EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test -n "$ACTUAL_SHA256" && test "$ACTUAL_SHA256" = "$EXPECTED"
          test -n "$TEST_SHA256" && test "$TEST_SHA256" = "$ACTUAL_SHA256"
          APP_HASH="$(sha256sum "$APK" | awk '{print $1}')"
          TEST_HASH="$(sha256sum "$TEST_APK" | awk '{print $1}')"
          printf '%s  app-release.apk\n%s  app-release-androidTest.apk\n' "$APP_HASH" "$TEST_HASH" > "$RUNNER_TEMP/apk-sha256.txt"
          mkdir -p "$RUNNER_TEMP/staging-artifacts"
          cp "$APK" "$RUNNER_TEMP/staging-artifacts/app-release.apk"
          cp "$TEST_APK" "$RUNNER_TEMP/staging-artifacts/app-release-androidTest.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$RUNNER_TEMP/staging-artifacts/"
          cp "$RUNNER_TEMP/apk-certificate.txt" "$RUNNER_TEMP/staging-artifacts/"
          cp "$RUNNER_TEMP/androidTest-certificate.txt" "$RUNNER_TEMP/staging-artifacts/"
          node -e 'const c=require("./android/app/google-services.json"); if(c.project_info.project_id!==process.env.PROJECT_ID) process.exit(1);'
          cat "$RUNNER_TEMP/apk-sha256.txt"
          grep -E 'SHA-1|SHA-256' "$RUNNER_TEMP/apk-certificate.txt"
          grep -E 'SHA-1|SHA-256' "$RUNNER_TEMP/androidTest-certificate.txt"

      - name: Remove staging configuration, response bodies and signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/google-services.json" "$RUNNER_TEMP/aurelia-staging-release.jks" "$RUNNER_TEMP/recovery-signing-key.pem" "$RUNNER_TEMP/appcheck-missing.json" "$RUNNER_TEMP/appcheck-invalid.json"
          rm -f candidate/android/app/google-services.json "candidate/functions/.env.$STAGING_PROJECT"

      - name: Expose non-secret staging metadata to Gate 3
        id: staging-outputs
        run: |
          set -euo pipefail
          echo "staging_project_id=$STAGING_PROJECT" >> "$GITHUB_OUTPUT"
          echo "production_project_id=$PRODUCTION_PROJECT" >> "$GITHUB_OUTPUT"
          echo "gcp_region=$GCP_REGION" >> "$GITHUB_OUTPUT"
          echo "functions_base_url=$STAGING_FUNCTIONS_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "recovery_callables=$RECOVERY_CALLABLES" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$EXPECTED_SIGNER_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload staging APK and non-secret fingerprints
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aurelia-recovery-staging-apk-${{ inputs.candidate_sha || github.sha }}
          path: ${{ runner.temp }}/staging-artifacts/
          if-no-files-found: error
          retention-days: 7
