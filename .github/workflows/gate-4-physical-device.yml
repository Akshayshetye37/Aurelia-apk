name: Gate 4 - Physical Android device

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      run_ids:
        required: true
        type: string
        description: "Upstream runs as gate:runId,gate:runId"
      device_label:
        required: true
        type: string

permissions: {}

concurrency:
  group: gate-4-${{ inputs.candidate_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  device:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, aurelia-android-device]
    timeout-minutes: 60
    environment: recovery-device-lab
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BRANCH: ${{ vars.FROZEN_CANDIDATE_BRANCH }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      RECOVERY_ENABLED: "false"
      RUN_IDS: ${{ inputs.run_ids }}
      REQUIRE: "1,2,3"
      DEVICE_LABEL: ${{ inputs.device_label }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen candidate
        run: node scripts/gates/check-candidate.mjs --sha "$CANDIDATE_SHA"
      - name: Validate device label
        run: '[[ "$DEVICE_LABEL" =~ ^[A-Za-z0-9._-]{1,64}$ ]]'
      - name: Verify Gates 1-3 evidence and attestations
        run: scripts/gates/fetch-and-verify.sh
      - name: Verify physical, locked, verified-boot device
        run: |
          mkdir -p proofs
          adb wait-for-device
          {
            echo "boot=$(adb shell getprop ro.boot.verifiedbootstate | tr -d '\r')"
            echo "locked=$(adb shell getprop ro.boot.flash.locked | tr -d '\r')"
            echo "emulator=$(adb shell getprop ro.kernel.qemu | tr -d '\r')"
          } | tee proofs/gate4-device.log
          grep -qx 'boot=green' proofs/gate4-device.log
          grep -qx 'locked=1' proofs/gate4-device.log
          ! grep -qx 'emulator=1' proofs/gate4-device.log
      - name: Validate device attestation (same APK as Gate 3)
        run: node scripts/gates/validate-attestation.mjs --kind device --file gates/attestations/gate4-device.json --sha "$CANDIDATE_SHA" --match-apk gates/attestations/gate3-sms.json
      - name: Write evidence
        run: node scripts/gates/write-evidence.mjs --gate 4 --sha "$CANDIDATE_SHA" --proof proofs/gate4-device.log --proof gates/attestations/gate4-device.json
      - name: Upload evidence
        uses: actions/upload-artifact@REPLACE_WITH_FULL_40_CHAR_SHA # v4.x
        with:
          name: gate-4-evidence-${{ inputs.candidate_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Attest evidence record
        uses: actions/attest-build-provenance@REPLACE_WITH_FULL_40_CHAR_SHA # v2.x
        with:
          subject-path: evidence/gate-4.json
