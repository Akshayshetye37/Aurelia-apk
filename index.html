      const newOut = offsetFromYmd(newDate);
      const extra = newOut - Number(b.out);
      if (!b || extra < 1) return;
      const r = getRoom(b.room);
      const added = extra * (Number(r?.r) || 0);
      b.extensionHistory = b.extensionHistory || [];
      b.extensionHistory.push({ from: fmtDate(b.out), to: fmtDate(newOut), nights: extra, added });
      b.out = newOut;
      b.checkOutTime = newTime;
      addAudit("Stay extended", `${b.g} · Room ${b.room} · +${extra} night(s) · ${fmtMoney(added)}`);
      closeModal();
      render();
      toast(`Stay extended by ${extra} night(s)`);
      return;
    }

    if (act === "cancel-booking") {
      const b = getBooking(actEl.dataset.id);
      if (!b) return;
      openModal("Cancel Reservation", `${esc(b.g)} · Room ${esc(b.room)}`, `
        <p class="muted">Paid to date: <strong>${fmtMoney(bookingPaid(b))}</strong>. Choose cancellation outcome. Refunds are tracked manually in the Cancellation Journal.</p>
        <div class="stack">
          <button class="btn danger full" type="button" data-action="confirm-cancel" data-id="${b.id}" data-mode="no_refund">Cancel · No Refund (Full Retention)</button>
          <button class="btn ghost full" type="button" data-action="confirm-cancel" data-id="${b.id}" data-mode="refund_pending">Cancel · Refund Pending Manual Review</button>
        </div>
      `);
      return;
    }

    if (act === "confirm-cancel") {
      const idx = S.bookings.findIndex(x => Number(x.id) === Number(actEl.dataset.id));
      if (idx < 0) return;
      const b = S.bookings.splice(idx, 1)[0];
      const mode = actEl.dataset.mode;
      S.cancelled.unshift({
        ...b,
        originalPaid: bookingPaid(b),
        cancelledAt: new Date().toISOString(),
        refundStatus: mode === "refund_pending" ? "Pending manual admin review" : "No refund (retained)"
      });
      addAudit("Booking cancelled", `${b.g} · Room ${b.room} · ${mode}`);
      closeModal();
      S.stayFilter = "cancelled";
      render();
      toast("Reservation archived in Cancelled Bookings");
      return;
    }
    if (act === "manage-refund") {
      const idx = Number(actEl.dataset.idx);
      const c = S.cancelled[idx];
      if (!c) return;
      openModal("Cancellation Accounting", `${esc(c.g)} · Room ${esc(c.room)}`, `
        <div class="card card-tight" style="margin-bottom:12px">Original Paid: <strong>${fmtMoney(c.originalPaid)}</strong></div>
        <label class="fld"><span>Refund Amount (${esc(cur())})</span><input id="rf-amt" type="number" min="0" max="${c.originalPaid}" value="${c.originalPaid}"></label>
        <label class="fld"><span>Journal Status</span>
          <select id="rf-status">
            <option value="refunded">Refund Paid via Aurelia UPI</option>
            <option value="pending">Pending Refund (Liability)</option>
            <option value="no_refund">No Refund / Full Retention</option>
          </select>
        </label>
        <button class="btn full" type="button" data-action="commit-refund" data-idx="${idx}">Commit Double-Entry Journal</button>
      `);
      return;
    }

    if (act === "commit-refund") {
      const idx = Number(actEl.dataset.idx);
      const c = S.cancelled[idx];
      if (!c) return;
      const status = document.getElementById("rf-status").value;
      const refund = status === "no_refund" ? 0 : Math.min(c.originalPaid, Math.max(0, Number(document.getElementById("rf-amt").value) || 0));
      const retained = Math.max(0, c.originalPaid - refund);
      const lines = [];
      if (status === "pending" && refund > 0) {
        lines.push({ account: "Guest Advances Liability", debit: refund, credit: 0 }, { account: "Refunds Payable Liability", debit: 0, credit: refund });
      } else {
        if (refund > 0) lines.push({ account: "Guest Advances Liability", debit: refund, credit: 0 }, { account: "Cash & Bank", debit: 0, credit: refund });
        if (retained > 0) lines.push({ account: "Guest Advances Liability", debit: retained, credit: 0 }, { account: "Cancellation Revenue", debit: 0, credit: retained });
      }
      if (lines.length) {
        S.financialLedger.push({ id: "JE-" + String(Date.now()).slice(-5), ref: "CANCEL-" + c.id, at: new Date().toISOString(), lines });
      }
      c.refundStatus = status === "refunded" ? `Refunded ${fmtMoney(refund)} (Retained ${fmtMoney(retained)})` : status === "pending" ? `Refund Pending (${fmtMoney(refund)})` : `Retained ${fmtMoney(retained)}`;
      addAudit("Cancellation journal", `${c.g} · ${c.refundStatus}`);
      closeModal();
      render();
      toast("Double-entry cancellation journal committed");
      return;
    }

    if (act === "cal-shift") {
      const delta = Number(actEl.dataset.delta);
      S.calOffset = delta === 0 ? 0 : S.calOffset + delta;
      render();
      return;
    }

    /* Rooms CRUD */
    if (act === "room-new" || act === "room-edit") {
      const r = act === "room-edit" ? getRoom(actEl.dataset.room) : { n: "", t: "Courtyard Suite", r: 4800, s: "ready" };
      const isEdit = act === "room-edit" && !!r;
      openModal(isEdit ? "Chamber " + r.n : "Add New Chamber", isEdit ? "Edit chamber rate or housekeeping status" : "Create a new bookable room", `
        <label class="fld"><span>Room Number</span><input id="rm-num" value="${esc(r.n)}" placeholder="e.g. 301"></label>
        <label class="fld"><span>Suite Category</span><input id="rm-type" value="${esc(r.t)}" placeholder="e.g. Courtyard Suite"></label>
        <label class="fld"><span>Nightly Rate (${esc(cur())})</span><input id="rm-rate" type="number" min="1" value="${r.r}"></label>
        ${isEdit && r.s !== "occ" ? `
          <label class="fld"><span>Status</span>
            <select id="rm-status">
              <option value="ready" ${r.s === "ready" ? "selected" : ""}>Ready</option>
              <option value="clean" ${r.s === "clean" ? "selected" : ""}>Needs Cleaning</option>
              <option value="out" ${r.s === "out" ? "selected" : ""}>Out of Service</option>
            </select>
          </label>
        ` : ""}
        <div class="row-wrap">
          <button class="btn full" type="button" data-action="room-save" data-orig="${isEdit ? esc(r.n) : ""}">Save Chamber</button>
          ${isEdit && r.s !== "occ" ? `<button class="btn sm danger full" type="button" data-action="room-del" data-room="${esc(r.n)}">Remove Chamber</button>` : ""}
        </div>
      `);
      return;
    }

    if (act === "room-save") {
      const orig = actEl.dataset.orig;
      const n = document.getElementById("rm-num").value.trim();
      const t = document.getElementById("rm-type").value.trim();
      const rate = Number(document.getElementById("rm-rate").value);
      if (!n || !t || !(rate > 0)) { toast("Enter room number, type, and nightly rate."); return; }
      if (!orig) {
        if (getRoom(n)) { toast("Room " + n + " already exists."); return; }
        S.rooms.push({ n, t, r: rate, s: "ready" });
        addAudit("Room added", `Room ${n} · ${t}`);
      } else {
        const r = getRoom(orig);
        if (r) {
          S.bookings.forEach(b => { if (String(b.room) === orig) b.room = n; });
          r.n = n; r.t = t; r.r = rate;
          const stSel = document.getElementById("rm-status");
          if (stSel) r.s = stSel.value;
          addAudit("Room updated", `Room ${n}`);
        }
      }
      closeModal();
      render();
      toast("Chamber saved");
      return;
    }

    if (act === "room-del") {
      const num = actEl.dataset.room;
      if (S.bookings.some(b => String(b.room) === String(num) && b.st !== "done")) { toast("Room has active bookings."); return; }
      S.rooms = S.rooms.filter(r => String(r.n) !== String(num));
      addAudit("Room removed", `Room ${num}`);
      closeModal();
      render();
      toast("Chamber removed");
      return;
    }

    /* Dining Actions */
    if (act === "dining-select-table") { S.activeTable = Number(actEl.dataset.table); render(); return; }
    if (act === "dining-cat") { S.activeCat = actEl.dataset.cat; render(); return; }
    if (act === "dining-toggle-edit") { S.editMenu = !S.editMenu; render(); return; }

    if (act === "dining-add-item") {
      const dish = (S.menu[actEl.dataset.cat] || [])[Number(actEl.dataset.idx)];
      const t = S.tables.find(x => Number(x.n) === Number(S.activeTable));
      if (!dish || !t) return;
      const ex = t.o.find(x => x.name === dish.name);
      if (ex) ex.qty++; else t.o.push({ name: dish.name, unit: dish.price, qty: 1 });
      render();
      toast(`${dish.name} added to Table ${t.n}`);
      return;
    }

    if (act === "dining-sell-stock") {
      const item = S.inventory.find(x => x.n === actEl.dataset.name);
      const t = S.tables.find(x => Number(x.n) === Number(S.activeTable));
      if (!item || !t || item.q < 1) { toast("Out of stock"); return; }
      item.q--;
      S.stockLedger.unshift({ item: item.n, delta: -1, note: "Sold at Table " + t.n, at: new Date().toISOString() });
      const ex = t.o.find(x => x.name === item.n);
      if (ex) ex.qty++; else t.o.push({ name: item.n, unit: item.price, qty: 1 });
      render();
      toast(`${item.n} added (${item.q} left in stock)`);
      return;
    }

    if (act === "dining-qty") {
      const t = S.tables.find(x => Number(x.n) === Number(S.activeTable));
      const idx = Number(actEl.dataset.idx), delta = Number(actEl.dataset.delta);
      if (!t || !t.o[idx]) return;
      t.o[idx].qty += delta;
      if (t.o[idx].qty <= 0) t.o.splice(idx, 1);
      render();
      return;
    }

    if (act === "dining-save-meta") {
      const t = S.tables.find(x => Number(x.n) === Number(S.activeTable));
      if (!t) return;
      t.guest = document.getElementById("dining-guest-name").value.trim();
      t.phone = document.getElementById("dining-guest-phone").value.trim();
      t.room = document.getElementById("dining-room-link").value;
      saveState();
      toast("Ticket details saved");
      return;
    }

    if (act === "dining-to-room") {
      const t = S.tables.find(x => Number(x.n) === Number(S.activeTable));
      const inHouse = S.bookings.filter(b => b.st === "in");
      if (!t || !t.o.length) return;
      if (!inHouse.length) { toast("No checked-in rooms available."); return; }
      const sum = t.o.reduce((s, x) => s + x.unit * x.qty, 0);
      openModal("Post Dining Ticket to Room", `Table ${t.n} · ${fmtMoney(sum)}`, `
        <div class="list-rows">
          ${inHouse.map(b => `
            <div class="list-item">
              <div class="item-main"><strong>Room ${esc(b.room)} · ${esc(b.g)}</strong><small>Current folio balance ${fmtMoney(bookingDue(b))}</small></div>
              <button class="btn sm" type="button" data-action="dining-post-room-go" data-id="${b.id}">Post ${fmtMoney(sum)}</button>
            </div>
          `).join("")}
        </div>
      `);
      return;
    }

    if (act === "dining-post-room-go") {
      const b = getBooking(actEl.dataset.id);
      const t = S.tables.find(x => Number(x.n) === Number(S.activeTable));
      if (!b || !t || !t.o.length) return;
      const sum = t.o.reduce((s, x) => s + x.unit * x.qty, 0);
      t.o.forEach(x => b.ch.push({ l: `Dining · ${x.name}${x.qty > 1 ? " (x" + x.qty + ")" : ""}`, a: x.unit * x.qty, c: "din" }));
      S.sales.push({ id: "RP-" + String(Date.now()).slice(-5), t: t.n, guest: b.g, phone: "", items: t.o.map(x => ({ ...x })), a: sum, m: "Posted to Room " + b.room, at: new Date().toISOString(), status: "paid", postedToHotel: true });
      t.o = [];
      addAudit("Dining charged to room", `Room ${b.room} · ${fmtMoney(sum)}`);
      closeModal();
      render();
      toast(`Posted ${fmtMoney(sum)} to Room ${b.room}`);
      return;
    }

    if (act === "dining-upi-settle") {
      const t = S.tables.find(x => Number(x.n) === Number(S.activeTable));
      if (!t || !t.o.length) return;
      const sum = t.o.reduce((s, x) => s + x.unit * x.qty, 0);
      S.tab = "upi";
      createUpiSession({ kind: "restaurant", tableId: t.n, guestName: t.guest || ("Table " + t.n + " Guest"), amount: sum, note: "Dining Table " + t.n });
      return;
    }

    if (act === "rest-receipt") {
      const s = S.sales.find(x => x.id === actEl.dataset.sale);
      if (!s) return;
      openThermalModal("DINING RECEIPT", s.guest || "Walk-in", s.t ? "Table " + s.t : "", s.id, (s.items || []).map(x => [`${x.name} x${x.qty}`, x.unit * x.qty]), s.a, s.a, 0);
      return;
    }

    if (act === "dining-add-table") {
      const nextNum = Math.max(0, ...S.tables.map(t => Number(t.n) || 0)) + 1;
      openModal("Add Dining Table", "", `
        <label class="fld"><span>Table Number</span><input id="dt-n" type="number" min="1" value="${nextNum}"></label>
        <label class="fld"><span>Seats</span><input id="dt-s" type="number" min="1" max="30" value="4"></label>
        <button class="btn full" type="button" data-action="dining-save-table">Add Table</button>
      `);
      return;
    }

    if (act === "dining-save-table") {
      const n = Number(document.getElementById("dt-n").value), seats = Number(document.getElementById("dt-s").value);
      if (!(n > 0) || S.tables.some(t => t.n === n)) { toast("Enter a unique positive table number."); return; }
      S.tables.push({ n, s: Math.max(1, seats || 4), guest: "", phone: "", room: "", o: [] });
      S.activeTable = n;
      closeModal();
      render();
      toast("Table " + n + " added");
      return;
    }

    if (act === "dining-edit-table") {
      const t = S.tables.find(x => Number(x.n) === Number(actEl.dataset.table));
      if (!t) return;
      openModal("Edit Table " + t.n, "", `
        <label class="fld"><span>Seats</span><input id="dt-es" type="number" min="1" max="30" value="${t.s}"></label>
        <div class="row-wrap">
          <button class="btn full" type="button" data-action="dining-update-table" data-table="${t.n}">Save</button>
          <button class="btn sm danger full" type="button" data-action="dining-del-table" data-table="${t.n}">Remove Table</button>
        </div>
      `);
      return;
    }

    if (act === "dining-update-table") {
      const t = S.tables.find(x => Number(x.n) === Number(actEl.dataset.table));
      if (t) t.s = Math.max(1, Number(document.getElementById("dt-es").value) || 2);
      closeModal();
      render();
      toast("Table updated");
      return;
    }

    if (act === "dining-del-table") {
      const n = Number(actEl.dataset.table);
      const t = S.tables.find(x => x.n === n);
      if (t && t.o.length) { toast("Settle open ticket before removing table."); return; }
      if (S.tables.length <= 1) { toast("Keep at least one table."); return; }
      S.tables = S.tables.filter(x => x.n !== n);
      S.activeTable = S.tables[0].n;
      closeModal();
      render();
      toast("Table removed");
      return;
    }

    if (act === "dining-add-cat") {
      openModal("Add Menu Category", "", `
        <label class="fld"><span>Category Name</span><input id="dc-name" placeholder="e.g. Beverages"></label>
        <button class="btn full" type="button" data-action="dining-save-cat">Add Category</button>
      `);
      return;
    }

    if (act === "dining-save-cat") {
      const name = document.getElementById("dc-name").value.trim();
      if (!name || S.menu[name]) { toast("Enter a unique category name."); return; }
      S.menu[name] = [];
      S.activeCat = name;
      closeModal();
      render();
      toast("Category added");
      return;
    }

    if (act === "dining-add-dish") {
      openModal("Add Dish", `Category: ${esc(S.activeCat)}`, `
        <label class="fld"><span>Dish Name</span><input id="dd-name" placeholder="e.g. Dal Makhani"></label>
        <label class="fld"><span>Description</span><input id="dd-desc" placeholder="Short description"></label>
        <label class="fld"><span>Price (${esc(cur())})</span><input id="dd-price" type="number" min="0" value="350"></label>
        <button class="btn full" type="button" data-action="dining-save-dish">Add to Menu</button>
      `);
      return;
    }

    if (act === "dining-save-dish") {
      const name = document.getElementById("dd-name").value.trim();
      const desc = document.getElementById("dd-desc").value.trim();
      const price = Number(document.getElementById("dd-price").value);
      if (!name || !(price >= 0)) { toast("Enter dish name and valid price."); return; }
      S.menu[S.activeCat].push({ name, price, desc });
      closeModal();
      render();
      toast("Dish added");
      return;
    }

    if (act === "dining-del-dish") {
      const list = S.menu[actEl.dataset.cat];
      if (list) list.splice(Number(actEl.dataset.idx), 1);
      render();
      toast("Dish removed");
      return;
    }

    /* Aurelia UPI Actions */
    if (act === "upi-create-folio") {
      const b = getBooking(actEl.dataset.id);
      if (!b) return;
      window.openAureliaUpiForFolio?.(b.id);
      return;
    }

    if (act === "upi-create-table") {
      const t = S.tables.find(x => Number(x.n) === Number(actEl.dataset.table));
      if (!t || !t.o.length) return;
      window.openAureliaUpiForDining?.(t.n);
      return;
    }
    if (act === "upi-cash-table") {
      const t = S.tables.find(x => Number(x.n) === Number(actEl.dataset.table));
      if (!t || !t.o.length) return;
      S.activeTable = Number(t.n);
      openManualDiningPaymentModal();
      return;
    }

    if (act === "upi-new-session") {
      if (window.AureliaUPI) window.AureliaUPI.openCollection({ kind: "general", guestName: "Walk-in payer", note: "Aurelia PMS collection" });
      else toast("Aurelia UPI payment desk is still loading.");
      return;
    }

    if (act === "upi-save-standalone") {
      const name = document.getElementById("us-name").value.trim() || "Walk-in Payer";
      const amt = Number(document.getElementById("us-amt").value);
      const note = document.getElementById("us-note").value.trim();
      if (!(amt > 0)) { toast("Enter a valid positive amount."); return; }
      createUpiSession({ kind: "standalone", guestName: name, amount: amt, note });
      return;
    }

    if (act === "upi-whatsapp-send") { shareFolioPaymentToWhatsApp(actEl.dataset.id); return; }
    if (act === "upi-open-intent") { openUpiIntentModal(actEl.dataset.id); return; }
    if (act === "upi-verify-modal") { openUpiVerifyModal(actEl.dataset.id); return; }
    if (act === "upi-commit-verify") {
      if (!document.getElementById("upi-manual-confirm").checked) { toast("Confirm that bank credit was verified manually."); return; }
      const utr = document.getElementById("upi-utr-input").value.trim();
      if (utr && !/^[A-Z0-9]{8,30}$/i.test(utr)) { toast("If supplied, the UTR must contain 8–30 letters or digits."); return; }
      commitUpiVerification(actEl.dataset.id, utr);
      return;
    }

    if (act === "upi-cancel-session") {
      const s = S.upiSessions.find(x => x.id === actEl.dataset.id);
      if (s) { s.status = "CANCELLED"; addAudit("UPI session cancelled", s.id); render(); toast("Session cancelled"); }
      return;
    }

    if (act === "upi-log-alert") {
      openModal("Log Incoming UPI Alert", "Record an incoming bank/UPI notification for manual matching", `
        <label class="fld"><span>Amount (${esc(cur())})</span><input id="ua-amt" type="number" min="1" placeholder="e.g. 5000"></label>
        <label class="fld"><span>Payer Name</span><input id="ua-payer" placeholder="Sender name"></label>
        <label class="fld"><span>UTR Reference</span><input id="ua-utr" placeholder="12-digit UTR"></label>
        <button class="btn full" type="button" data-action="upi-save-alert">Add to Observer Log</button>
      `);
      return;
    }

    if (act === "upi-save-alert") {
      const amt = Number(document.getElementById("ua-amt").value);
      if (!(amt > 0)) { toast("Enter a valid amount."); return; }
      S.upiAlerts.unshift({
        id: "SIG-" + String(Date.now()).slice(-4),
        app: "UPI Alert",
        amount: amt,
        payer: document.getElementById("ua-payer").value.trim() || "Unknown Payer",
        utr: document.getElementById("ua-utr").value.trim(),
        at: new Date().toISOString(),
        status: "OPEN"
      });
      closeModal();
      render();
      toast("Alert added to reconciliation queue");
      return;
    }

    if (act === "upi-match-alert") {
      const al = S.upiAlerts.find(x => x.id === actEl.dataset.alert);
      if (!al) return;
      const active = S.upiSessions.filter(s => s.status === "ACTIVE");
      const exact = active.find(s => Math.abs(s.amount - al.amount) < 0.01);
      if (exact) {
        openUpiVerifyModal(exact.id, al.utr);
      } else {
        openModal("Reconcile Alert", `${fmtMoney(al.amount)} · UTR ${esc(al.utr || "—")}`, `
          <p class="muted">No active collection session matches ${fmtMoney(al.amount)} exactly. Create a session for the target folio or mark this alert reviewed.</p>
          <button class="btn full ghost" type="button" data-action="upi-dismiss-alert" data-alert="${esc(al.id)}">Mark Alert Reviewed</button>
        `);
      }
      return;
    }

    if (act === "upi-dismiss-alert") {
      const al = S.upiAlerts.find(x => x.id === actEl.dataset.alert);
      if (al) al.status = "RECONCILED";
      closeModal();
      render();
      toast("Alert marked reconciled");
      return;
    }

    /* Guests CRUD */
    if (act === "guest-new" || act === "guest-edit") {
      const idx = act === "guest-edit" ? Number(actEl.dataset.idx) : -1;
      const g = idx >= 0 ? S.guests[idx] : { n: "", ph: "", em: "", idt: ID_TYPES[0], idn: "", occ: [], veh: [] };
      openModal(idx >= 0 ? "Edit Guest Profile" : "Add Guest Profile", "", `
        <label class="fld"><span>Full Name</span><input id="gp-n" value="${esc(g.n)}"></label>
        <div class="grid g2">
          <label class="fld"><span>Phone</span><input id="gp-ph" type="tel" value="${esc(g.ph)}"></label>
          <label class="fld"><span>Email</span><input id="gp-em" type="email" value="${esc(g.em)}"></label>
        </div>
        <div class="grid g2">
          <label class="fld"><span>ID Type</span><select id="gp-idt">${ID_TYPES.map(t => `<option ${g.idt === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
          <label class="fld"><span>ID Number</span><input id="gp-idn" value="${esc(g.idn)}"></label>
        </div>
        <button class="btn full" type="button" data-action="guest-save" data-idx="${idx}">Save Guest</button>
      `);
      return;
    }

    if (act === "guest-save") {
      const idx = Number(actEl.dataset.idx);
      const n = document.getElementById("gp-n").value.trim();
      if (!n) { toast("Guest name is required."); return; }
      const rec = {
        n,
        ph: document.getElementById("gp-ph").value.trim(),
        em: document.getElementById("gp-em").value.trim(),
        idt: document.getElementById("gp-idt").value,
        idn: document.getElementById("gp-idn").value.trim(),
        occ: idx >= 0 ? (S.guests[idx].occ || []) : [],
        veh: idx >= 0 ? (S.guests[idx].veh || []) : []
      };
      if (idx >= 0) {
        const oldName = S.guests[idx].n;
        S.guests[idx] = rec;
        if (oldName !== n) S.bookings.forEach(b => { if (b.g === oldName) b.g = n; });
      } else S.guests.unshift(rec);
      addAudit("Guest saved", n);
      closeModal();
      render();
      toast("Guest profile saved");
      return;
    }

    /* Housekeeping */
    if (act === "hk-status") {
      const r = getRoom(actEl.dataset.room);
      if (r) {
        r.s = actEl.dataset.status;
        addAudit("Housekeeping", `Room ${r.n} → ${r.s}`);
        render();
        toast(`Room ${r.n} marked ${r.s}`);
      }
      return;
    }

    /* Inventory */
    if (act === "inv-new") {
      openModal("Add Stock Item", "", `
        <label class="fld"><span>Item Name</span><input id="in-n" placeholder="e.g. Herbal Tea Box"></label>
        <div class="grid g2">
          <label class="fld"><span>Opening Quantity</span><input id="in-q" type="number" min="0" value="10"></label>
          <label class="fld"><span>Reorder Level</span><input id="in-ro" type="number" min="0" value="4"></label>
        </div>
        <div class="grid g2">
          <label class="fld"><span>Unit Cost (${esc(cur())})</span><input id="in-u" type="number" min="0" value="120"></label>
          <label class="fld"><span>POS Sell Price (optional)</span><input id="in-p" type="number" min="0" value="0"></label>
        </div>
        <button class="btn full" type="button" data-action="inv-save">Add Item</button>
      `);
      return;
    }

    if (act === "inv-save") {
      const n = document.getElementById("in-n").value.trim();
      const q = Math.max(0, Number(document.getElementById("in-q").value) || 0);
      const ro = Math.max(0, Number(document.getElementById("in-ro").value) || 0);
      const u = Math.max(0, Number(document.getElementById("in-u").value) || 0);
      const p = Math.max(0, Number(document.getElementById("in-p").value) || 0);
      if (!n) { toast("Enter an item name."); return; }
      S.inventory.unshift({ n, q, ro, u, price: p, sellable: p > 0 });
      S.stockLedger.unshift({ item: n, delta: q, note: "Opening stock", at: new Date().toISOString() });
      closeModal();
      render();
      toast("Stock item added");
      return;
    }

    if (act === "inv-adjust") {
      const idx = Number(actEl.dataset.idx), dir = Number(actEl.dataset.dir);
      const x = S.inventory[idx];
      if (!x) return;
      openModal(dir > 0 ? "Purchase Stock" : "Issue Stock", x.n, `
        <label class="fld"><span>Quantity</span><input id="ia-q" type="number" min="1" value="1"></label>
        <button class="btn full" type="button" data-action="inv-adjust-go" data-idx="${idx}" data-dir="${dir}">Confirm</button>
      `);
      return;
    }

    if (act === "inv-adjust-go") {
      const idx = Number(actEl.dataset.idx), dir = Number(actEl.dataset.dir);
      const x = S.inventory[idx], q = Math.floor(Number(document.getElementById("ia-q").value));
      if (!x || !(q > 0)) { toast("Enter a valid quantity."); return; }
      if (dir < 0 && q > x.q) { toast(`Only ${x.q} in stock.`); return; }
      x.q += dir * q;
      S.stockLedger.unshift({ item: x.n, delta: dir * q, note: dir > 0 ? "Purchase" : "Issued", at: new Date().toISOString() });
      closeModal();
      render();
      toast(`Updated ${x.n} (${x.q} remaining)`);
      return;
    }

    if (act === "inv-del") {
      S.inventory.splice(Number(actEl.dataset.idx), 1);
      render();
      toast("Stock item removed");
      return;
    }

    /* Expenses */
    if (act === "exp-new") {
      openModal("Record Expense", "", `
        <label class="fld"><span>Description</span><input id="ex-t" placeholder="e.g. Fresh linen purchase"></label>
        <label class="fld"><span>Category</span><select id="ex-c"><option>Kitchen</option><option>Utilities</option><option>Staff</option><option>Maintenance</option><option>Other</option></select></label>
        <label class="fld"><span>Amount (${esc(cur())})</span><input id="ex-a" type="number" min="1"></label>
        <button class="btn full" type="button" data-action="exp-save">Save Expense</button>
      `);
      return;
    }

    if (act === "exp-save") {
      const t = document.getElementById("ex-t").value.trim();
      const c = document.getElementById("ex-c").value;
      const a = Number(document.getElementById("ex-a").value);
      if (!t || !(a > 0)) { toast("Enter a description and positive amount."); return; }
      S.expenses.unshift({ id: Date.now(), t, c, a, v: false, at: new Date().toISOString() });
      addAudit("Expense recorded", `${t} · ${fmtMoney(a)}`);
      closeModal();
      render();
      toast("Expense saved");
      return;
    }

    if (act === "exp-void") {
      const ex = S.expenses.find(e => Number(e.id) === Number(actEl.dataset.id));
      if (ex) { ex.v = true; addAudit("Expense voided", ex.t); render(); toast("Expense voided"); }
      return;
    }

    /* Exports */
    if (act === "export-csv") {
      const m = computeFinancials();
      const kind = actEl.dataset.kind;
      if (kind === "pl") {
        downloadCsv("aurelia-profit-and-loss.csv", [
          [S.settings.name + " — Management Profit & Loss"],
          ["Generated", new Date().toISOString()],
          ["Particulars", "Amount (" + cur() + ")"],
          ["Room Revenue", m.rooms],
          ["Dining Revenue", m.dining],
          ["Extras", m.extras],
          ["Cancellation Retention", m.retention],
          ["Less Discounts", -m.discounts],
          ["Total Revenue", m.totalRevenue],
          ["Less Operating Expenses", -m.expenses],
          ["Estimated Operating Profit", m.profit]
        ]);
      } else if (kind === "bs") {
        downloadCsv("aurelia-balance-sheet-schedule.csv", [
          [S.settings.name + " — Provisional Balance Sheet Schedule"],
          ["Generated", new Date().toISOString()],
          ["Line Item", "Amount (" + cur() + ")"],
          ["Recorded Collections (Cash/Bank Proxy)", m.collected],
          ["Guest Receivables", m.receivables],
          ["Inventory Valuation", m.stockVal],
          ["Total Provisional Current Assets", m.collected + m.receivables + m.stockVal],
          ["Refunds Payable Liability", m.refundsPayable]
        ]);
      } else {
        const rows = [["Date", "Reference", "Account", "Debit", "Credit"]];
        S.financialLedger.forEach(e => e.lines.forEach(l => rows.push([e.at, e.ref, l.account, l.debit || 0, l.credit || 0])));
        downloadCsv("aurelia-cancellation-journal.csv", rows);
      }
      return;
    }

    /* Settings & Backup */
    if (act === "save-settings") {
      const upi = document.getElementById("set-upi").value.trim();
      if (upi && !/^[^\s@]+@[^\s@]+$/.test(upi)) { toast("Enter a valid UPI ID (e.g. hotel@bank)."); return; }
      S.settings.name = document.getElementById("set-name").value.trim() || "Aurelia PMS";
      S.settings.tag = document.getElementById("set-tag").value.trim();
      S.settings.phone = document.getElementById("set-phone").value.trim();
      S.settings.tax = document.getElementById("set-tax").value.trim();
      S.settings.addr = document.getElementById("set-addr").value.trim();
      S.settings.upi = upi;
      S.settings.gst = Math.max(0, Number(document.getElementById("set-gst").value) || 0);
      S.settings.checkInTime = document.getElementById("set-cin").value || "14:00";
      S.settings.checkOutTime = document.getElementById("set-cout").value || "11:00";
      addAudit("Settings updated", "Property identity saved");
      render();
      toast("Property identity saved");
      return;
    }

    if (act === "save-rest-settings") {
      S.restaurant.name = document.getElementById("rset-name").value.trim() || "The Dining Room";
      S.restaurant.phone = document.getElementById("rset-phone").value.trim();
      S.restaurant.addr = document.getElementById("rset-addr").value.trim();
      addAudit("Settings updated", "Restaurant identity saved");
      render();
      toast("Restaurant identity saved");
      return;
    }

    if (act === "save-terms") {
      S.settings.terms = document.getElementById("set-terms").value.trim();
      saveState();
      toast("Guest terms saved");
      return;
    }

    if (act === "toggle-auto") {
      const k = actEl.dataset.key;
      S.autopilot[k] = !S.autopilot[k];
      render();
      return;
    }

    if (act === "backup-download") {
      const blob = new Blob([JSON.stringify({ v: 3, exportedAt: new Date().toISOString(), data: S }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "aurelia-pms-backup-" + ymd(0) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast("JSON backup downloaded");
      return;
    }

    if (act === "health-check") {
      const missingRooms = S.bookings.filter(b => !getRoom(b.room)).length;
      openModal("System Health Check", "Integrity scan of local PMS records", `
        <div class="list-rows">
          <div class="list-item"><span>Chambers</span><span class="tag ready">${S.rooms.length} OK</span></div>
          <div class="list-item"><span>Bookings</span><span class="tag ready">${S.bookings.length} OK</span></div>
          <div class="list-item"><span>Guest Profiles</span><span class="tag ready">${S.guests.length} OK</span></div>
          <div class="list-item"><span>Orphan Room References</span><span class="tag ${missingRooms ? "out" : "ready"}">${missingRooms || "None"}</span></div>
          <div class="list-item"><span>Aurelia UPI VPA</span><span class="tag ${S.settings.upi ? "ready" : "clean"}">${S.settings.upi ? "Configured" : "Not Set"}</span></div>
        </div>
      `);
      return;
    }

    if (act === "reset-demo") {
      openModal("Reset to Sample Data?", "This restores the default Aurelia PMS sample dataset.", `
        <p class="muted">Any edits made in this browser session will be replaced with the fresh sample dataset.</p>
        <div class="row-wrap">
          <button class="btn ghost" type="button" data-action="close-modal">Cancel</button>
          <button class="btn danger" type="button" data-action="confirm-reset-demo">Reset Data</button>
        </div>
      `);
      return;
    }

    if (act === "confirm-reset-demo") {
      S = createDefaultState();
      closeModal();
      render();
      toast("Workspace restored to fresh sample data");
      return;
    }
  });

  /* Change Handlers (Room Link in Dining + JSON Restore) */
  document.addEventListener("change", e => {
    if (e.target.id === "dining-room-link") {
      const t = S.tables.find(x => Number(x.n) === Number(S.activeTable));
      if (!t) return;
      const roomNum = e.target.value;
      t.room = roomNum;
      const b = S.bookings.find(x => String(x.room) === String(roomNum) && x.st === "in");
      if (b) {
        const g = getGuest(b.g);
        t.guest = b.g;
        t.phone = (g && g.ph) || "";
      } else {
        t.guest = "";
        t.phone = "";
      }
      render();
      return;
    }

    if (e.target.id === "restore-json-input") {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      file.text().then(txt => {
        const parsed = JSON.parse(txt);
        const data = parsed && parsed.data ? parsed.data : parsed;
        if (!validatePersistedState(data)) {
          toast("Invalid or incomplete Aurelia PMS backup file.");
          return;
        }
        const previous = S;
        try { normalizeLoadedState(data); }
        catch (_) { S = previous; toast("Backup validation failed; existing records were left unchanged."); return; }
        saveState(true).then(saved => {
          if (!saved) { S = previous; toast("Restore blocked: device storage is unavailable."); return; }
          render();
          toast("Backup restored and saved to device");
        });
      }).catch(() => toast("Could not parse backup JSON."));
      e.target.value = "";
    }
  });

  /* Static Header & Sidebar Listeners */
  document.getElementById("sb-new-booking").addEventListener("click", () => openNewBookingModal());
  document.getElementById("mobile-new-booking").addEventListener("click", () => openNewBookingModal());
  document.getElementById("btn-global-search").addEventListener("click", openGlobalSearch);
  document.getElementById("btn-theme-toggle").addEventListener("click", () => {
    S.settings.theme = S.settings.theme === "light" ? "dark" : "light";
    render();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      openGlobalSearch();
    }
  });

  window.addEventListener("storage", e => {
    if (e.key === STORAGE_KEY && e.newValue !== e.oldValue) {
      setPersistenceState("conflict", "This PMS data changed in another tab/window. Reload before making further changes to avoid overwriting newer records.");
    }
  });
  window.addEventListener("pagehide", () => { saveState(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveState(); });

  function updateClock() {
    const el = document.getElementById("topbar-clock");
    if (el) el.textContent = new Intl.DateTimeFormat("en-IN", { timeZone: IST_TZ, hour: "2-digit", minute: "2-digit", hour12: true }).format(new Date()) + " IST";
  }

  window.AureliaPmsContext = {
    getSettings: () => ({ name: S.settings.name || "Aurelia PMS", upi: S.settings.upi || "" }),
    getBookings: () => S.bookings.filter(booking => bookingDue(booking) > 0).map(booking => {
      const guest = getGuest(booking.g) || {};
      return {
        id: booking.id, guestName: booking.g, room: booking.room,
        balancePaise: Math.round(bookingDue(booking) * 100),
        guestPhone: guest.ph || booking.ph || booking.phone || ""
      };
    }),
    getTables: () => S.tables.filter(table => Array.isArray(table.o) && table.o.length > 0).map(table => ({
      id: String(table.n),
      amountPaise: Math.round(table.o.reduce((sum, item) => sum + (Number(item.unit) || 0) * (Number(item.qty) || 0), 0) * 100),
      guestName: table.guest || "Dining guest",
      phone: table.phone || ""
    })),
    toast: message => toast(message),
    render: () => render(),
    go: tab => { S.tab = tab; closeModal(); render(); },
    isPaymentTab: () => S.tab === "upi",
    launchUpi: uri => {
      try { window.location.assign(String(uri)); return true; } catch (_) { return false; }
    },
    launchExternalUrl: url => {
      try {
        const opened = window.open(String(url), "_blank", "noopener,noreferrer");
        if (!opened) window.location.assign(String(url));
        return true;
      } catch (_) { try { window.location.assign(String(url)); return true; } catch (_) { return false; } }
    },
    openNotificationSettings: async () => {
      const plugin = window.Capacitor?.Plugins?.CapacitorPmsStorage;
      if (plugin && typeof plugin.openNotificationAccessSettings === "function") {
        try { await plugin.openNotificationAccessSettings(); return true; } catch (_) { return false; }
      }
      return false;
    },
    applyFolioPayment: async (session, utr) => {
      const booking = getBooking(session.bookingId);
      const amount = Number(session.amountPaise) / 100;
      if (!booking) throw new Error("The linked guest folio no longer exists.");
      if (!(amount > 0) || amount > bookingDue(booking) + 0.009) throw new Error("The folio balance changed. Refresh the collection before posting.");
      booking.pays = Array.isArray(booking.pays) ? booking.pays : [];
      const sessionMarker = "AURELIA-UPI:" + String(session.id);
      if (booking.pays.some(payment => payment.sessionId === session.id || payment.r === sessionMarker)) return true;
      const beforePays = booking.pays.slice(), beforeRevenue = Number(S.todayRevenue) || 0, beforeAudit = S.audit.slice();
      const reference = String(utr || session.reference || session.id).trim().slice(0, 80);
      booking.pays.push({ a: amount, m: "Aurelia UPI", r: reference, sessionId: session.id, at: new Date().toISOString(), source: "AURELIA_UPI" });
      S.todayRevenue = beforeRevenue + amount;
      addAudit("Aurelia UPI payment posted", booking.g + " · Room " + booking.room + " · " + fmtMoney(amount) + " · " + (reference || "Bank credit verified"));
      if (!(await persistMutation())) {
        booking.pays = beforePays; S.todayRevenue = beforeRevenue; S.audit = beforeAudit;
        throw new Error("PMS folio payment was not saved. The verified Aurelia UPI payment remains pending posting for a safe retry.");
      }
      render();
      return true;
    },
    applyRestaurantPayment: async (session, utr) => {
      const table = S.tables.find(row => String(row.n) === String(session.tableId));
      const amount = Number(session.amountPaise) / 100;
      if (!table || !Array.isArray(table.o) || !table.o.length) throw new Error("The linked dining ticket is no longer open.");
      const current = table.o.reduce((sum, item) => sum + (Number(item.unit) || 0) * (Number(item.qty) || 0), 0);
      if (!(amount > 0) || Math.abs(current - amount) > 0.009) throw new Error("The dining bill changed. Refresh the ticket before posting.");
      S.sales = Array.isArray(S.sales) ? S.sales : [];
      if (S.sales.some(sale => sale.aureliaUpiSessionId === session.id)) return true;
      const beforeOrders = table.o.map(item => ({ ...item })), beforeSales = S.sales.slice();
      const beforeRevenue = Number(S.todayRevenue) || 0, beforeAudit = S.audit.slice();
      const now = new Date().toISOString();
      const sale = {
        id: "RS-UPI-" + String(session.id).replace(/[^A-Za-z0-9_-]/g, "").slice(-48),
        t: table.n, guest: table.guest || session.guestName || "Dining guest",
        phone: table.phone || session.guestPhone || "",
        items: beforeOrders.map(item => ({ ...item })), a: amount, m: "Aurelia UPI",
        ref: String(utr || session.reference || session.id).trim().slice(0, 80),
        aureliaUpiSessionId: session.id, at: now, status: "paid", postedToHotel: false
      };
      S.sales.push(sale); table.o = []; S.todayRevenue = beforeRevenue + amount;
      addAudit("Dining Aurelia UPI payment posted", sale.guest + " · Table " + table.n + " · " + fmtMoney(amount));
      if (!(await persistMutation())) {
        table.o = beforeOrders; S.sales = beforeSales; S.todayRevenue = beforeRevenue; S.audit = beforeAudit;
        throw new Error("Dining payment was not saved. The verified Aurelia UPI payment remains pending posting for a safe retry.");
      }
      render();
      return true;
    }
  };

  window.openAureliaUpiForFolio = function (id, requestedAmount) {
    const booking = getBooking(id);
    if (!booking) { toast("Guest folio not found."); return; }
    const due = bookingDue(booking);
    const amount = requestedAmount == null ? due : Number(requestedAmount);
    if (!(amount > 0) || amount > due + 0.009) { toast("Enter an amount within the current folio balance."); return; }
    if (!window.AureliaUPI) { toast("Aurelia UPI payment desk is still loading."); return; }
    closeModal();
    window.AureliaUPI.openCollection({
      kind: "folio", bookingId: booking.id, guestName: booking.g,
      guestPhone: getGuest(booking.g)?.ph || booking.ph || booking.phone || "",
      room: booking.room, amountPaise: Math.round(amount * 100),
      note: "Folio " + (booking.iv || ("Room " + booking.room))
    });
  };

  window.openAureliaUpiForDining = function (tableId) {
    const table = S.tables.find(row => String(row.n) === String(tableId));
    if (!table || !Array.isArray(table.o) || !table.o.length) { toast("Dining ticket has no open items."); return; }
    if (!window.AureliaUPI) { toast("Aurelia UPI payment desk is still loading."); return; }
    const amount = table.o.reduce((sum, item) => sum + (Number(item.unit) || 0) * (Number(item.qty) || 0), 0);
    closeModal();
    window.AureliaUPI.openCollection({
      kind: "restaurant", tableId: String(table.n),
      guestName: table.guest || "Dining guest", guestPhone: table.phone || "",
      amountPaise: Math.round(amount * 100), note: "Dining table " + table.n
    });
  };

  window.AureliaPaymentPolicy = Object.freeze({
    enabledMethods: Object.freeze(["AURELIA_UPI", "CASH", "BANK_TRANSFER"]),
    providerGatewaysEnabled: false, automaticSettlement: false,
    manualConfirmationRequired: true, notificationEvidenceCanSettle: false,
    qrGeneration: "LOCAL", currency: "INR"
  });

  window.addEventListener("load", () => {
    if (S.tab === "upi" && window.AureliaUPI) render();
    if (window.AureliaUPI && Array.isArray(S.upiAlerts) && S.upiAlerts.length && !S.legacyAlertsImported) {
      const alerts = S.upiAlerts.slice();
      Promise.all(alerts.map(alert => {
        const amountPaise = Math.round(Number(alert.amount) * 100);
        if (!Number.isSafeInteger(amountPaise) || amountPaise <= 0) return Promise.resolve(false);
        return window.AureliaUPI.importSignal({
          id: alert.id, amountPaise, utr: alert.utr || "",
          source: alert.app || "LEGACY_PMS_ALERT",
          receivedAt: alert.at || new Date().toISOString(),
          rawText: "UPI payment received INR " + (amountPaise / 100).toFixed(2) + (alert.utr ? " UTR " + alert.utr : "")
        }).catch(error => { console.warn("Legacy UPI alert import deferred:", error); return false; });
      })).then(() => { S.legacyAlertsImported = true; persistMutation(); });
    }
  });

  /* Boot only after the durable store has been checked and any legacy data migrated. */
  loadState().finally(() => {
    render();
    updateClock();
    setInterval(updateClock, 30000);
  });
})();
</script>
<script src="./assets/qrcode.min.js"></script>
<script type="module" src="./src/aurelia-upi/app.mjs"></script>
