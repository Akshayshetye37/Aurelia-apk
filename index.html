<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https:; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelia PMS — Boutique Property Management Workspace</title>

<style>
:root {
  --bg: #081711;
  --bg-elev: #10271d;
  --bg-card: #173628;
  --bg-card-2: #1e4635;
  --bg-input: rgba(247, 242, 231, 0.055);
  --border: rgba(220, 194, 133, 0.18);
  --border-strong: rgba(220, 194, 133, 0.32);
  --gold: #e2c783;
  --gold-bright: #ffe39e;
  --gold-dim: #c79b4b;
  --gold-soft: rgba(226, 199, 131, 0.12);
  --text: #f7f2e7;
  --text-muted: #afc0b5;
  --text-dim: rgba(175, 192, 181, 0.68);
  --emerald: #52c79a;
  --emerald-soft: rgba(82, 199, 154, 0.15);
  --amber: #edbb5d;
  --amber-soft: rgba(237, 187, 93, 0.15);
  --crimson: #df7c70;
  --crimson-soft: rgba(223, 124, 112, 0.15);
  --sky: #8ab7e8;
  --sky-soft: rgba(138, 183, 232, 0.14);
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.38);
  --shadow-sm: 0 8px 22px rgba(4, 11, 8, 0.24);
  --radius-xl: 24px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --serif: "EB Garamond", Georgia, serif;
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sidebar-w: 256px;
}

body[data-theme="light"] {
  --bg: #f5f3ec;
  --bg-elev: #ffffff;
  --bg-card: #ffffff;
  --bg-card-2: #f6f2e8;
  --bg-input: #f2efe7;
  --border: rgba(20, 61, 45, 0.12);
  --border-strong: rgba(20, 61, 45, 0.28);
  --gold: #9a742c;
  --gold-bright: #7d5b1c;
  --gold-dim: #b58d43;
  --gold-soft: rgba(154, 116, 44, 0.11);
  --text: #15231c;
  --text-muted: #52665c;
  --text-dim: #798c82;
  --emerald: #177d56;
  --emerald-soft: rgba(23, 125, 86, 0.12);
  --amber: #b37412;
  --amber-soft: rgba(179, 116, 18, 0.12);
  --crimson: #b83b31;
  --crimson-soft: rgba(184, 59, 49, 0.11);
  --sky: #2563eb;
  --sky-soft: rgba(37, 99, 235, 0.1);
  --shadow: 0 14px 36px rgba(17, 36, 27, 0.08);
  --shadow-sm: 0 4px 14px rgba(17, 36, 27, 0.06);
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4 { margin: 0; font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; }
img { max-width: 100%; height: auto; }

/* App Shell */
.shell { display: flex; min-height: 100vh; }

/* Desktop Sidebar */
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 14px 16px;
  z-index: 30;
}
.brand-block {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 8px 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}
.brand-mark {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
  color: #161105;
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: 0 6px 18px rgba(223, 192, 123, 0.25);
}
.brand-mark svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.brand-copy { min-width: 0; }
.brand-copy strong { display: block; font: 700 13px/1.2 var(--sans); letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; }
.brand-copy small { display: block; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

.nav-scroll { flex: 1; overflow-y: auto; padding-right: 2px; }
.nav-group-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 12px 10px 6px;
}
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  border-radius: 11px;
  color: var(--text-muted);
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.18s, color 0.18s;
  margin-bottom: 2px;
  text-align: left;
}
.nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-item:hover { background: var(--gold-soft); color: var(--text); }
.nav-item.active {
  background: linear-gradient(135deg, rgba(223, 192, 123, 0.2), rgba(223, 192, 123, 0.06));
  color: var(--gold);
  box-shadow: inset 0 0 0 1px var(--border-strong);
}
body[data-theme="light"] .nav-item.active {
  background: rgba(20, 61, 45, 0.09);
  color: #143d2d;
  box-shadow: inset 0 0 0 1px rgba(20, 61, 45, 0.18);
}
.nav-badge {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--gold-soft);
  color: var(--gold);
}
.nav-badge.alert { background: var(--crimson-soft); color: var(--crimson); }

.sidebar-footer {
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: grid;
  gap: 8px;
}

/* Main Content Column */
.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mobile-brand { display: none; align-items: center; gap: 9px; }
.mobile-brand .brand-mark { width: 34px; height: 34px; border-radius: 10px; }
.page-crumb { display: flex; align-items: center; gap: 8px; min-width: 0; }
.page-crumb h2 { font: 600 22px/1.1 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-dot-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
}
.status-dot-pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 0 3px var(--emerald-soft);
}

.topbar-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  height: 36px;
  min-width: 36px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 500;
  transition: border-color 0.18s, color 0.18s, background 0.18s;
}
.icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.main-pad {
  width: 100%;
  max-width: 1220px;
  margin: 0 auto;
  padding: 22px 24px 48px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 16px;
  border-radius: 11px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.2;
  color: #181205;
  background: linear-gradient(135deg, #f3dc9e, #cba04f);
  box-shadow: 0 6px 18px rgba(203, 160, 79, 0.25);
  transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

body[data-theme="light"] .btn {
  background: linear-gradient(135deg, #1b4d38, #123627);
  color: #f9f4e8;
  box-shadow: 0 6px 18px rgba(18, 54, 39, 0.2);
}

.btn.ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-strong);
  box-shadow: none;
}
.btn.ghost:hover { background: var(--gold-soft); border-color: var(--gold); }
.btn.subtle {
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: none;
}
.btn.subtle:hover { border-color: var(--border-strong); }
.btn.danger {
  background: var(--crimson-soft);
  color: var(--crimson);
  border: 1px solid rgba(224, 109, 96, 0.35);
  box-shadow: none;
}
.btn.danger:hover { background: var(--crimson); color: #fff; }
.btn.emerald {
  background: var(--emerald-soft);
  color: var(--emerald);
  border: 1px solid rgba(62, 196, 141, 0.35);
  box-shadow: none;
}
.btn.emerald:hover { background: var(--emerald); color: #071912; }
.btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 9px; }
.btn.xs { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
.btn.full { width: 100%; }

/* Cards & Grids */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.card-tight { padding: 15px 16px; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g2-wide { grid-template-columns: 1.45fr 1fr; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.stack { display: grid; gap: 12px; }
.muted { color: var(--text-muted); font-size: 13px; }
.dim { color: var(--text-dim); font-size: 12px; }

/* Hero Banner */
.hero {
  position: relative;
  border-radius: var(--radius-xl);
  overflow: hidden;
  border: 1px solid var(--border-strong);
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
  background: linear-gradient(135deg, #10271d, #173628 72%, #1e4635);
}
.hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 45%;
  filter: brightness(0.62) saturate(1.06);
  transform: scale(1.01);
}
.hero-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, rgba(6, 18, 13, 0.92) 0%, rgba(6, 18, 13, 0.68) 52%, rgba(6, 18, 13, 0.32) 100%);
}
.hero-content { position: relative; z-index: 2; max-width: 620px; }
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #f2da9c;
  margin-bottom: 8px;
}
.hero h1 {
  font-size: clamp(28px, 4vw, 38px);
  line-height: 1.05;
  color: #fbf7ee;
  margin-bottom: 8px;
}
.hero-tagline {
  font: italic 500 18px/1.35 var(--serif);
  color: #e6d7b5;
  margin: 0;
}

.avail-bar {
  position: relative;
  z-index: 2;
  margin-top: 22px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: 10px;
  padding: 12px;
  border-radius: 16px;
  background: rgba(7, 20, 15, 0.78);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(223, 192, 123, 0.28);
  max-width: 620px;
}
.avail-field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #b8cabf; margin-bottom: 3px; }
.avail-field input {
  width: 100%;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 9px;
  padding: 8px 10px;
  color: #fff;
  font-size: 13.5px;
  color-scheme: dark;
  outline: 0;
}
.avail-field input:focus { border-color: #f2da9c; }

/* Compact dashboard alerts */
.dashboard-alerts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
.dashboard-alerts:has(> .card:only-child) { grid-template-columns:1fr; }
.dashboard-alerts .card { display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:7px; min-width:0; padding:10px; }
.dashboard-alerts .card > div { flex:1; width:auto; min-width:0; }
.dashboard-alerts .card strong { font-size:12px; line-height:1.3; }
.dashboard-alerts .card .dim { font-size:10px; overflow-wrap:anywhere; }
.dashboard-alerts .card .btn { width:auto; flex:none; justify-content:center; padding:6px 9px; font-size:10px; }

/* KPI Cards */
.kpi-card { position: relative; overflow: hidden; }
.kpi-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.kpi-value { font: 600 36px/1.08 var(--serif); margin: 8px 0 4px; color: var(--text); }
.kpi-sub { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.kpi-accent { color: var(--gold); }
.kpi-up { color: var(--emerald); }

/* Tags & Chips */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
.tag.ready { background: var(--emerald-soft); color: var(--emerald); }
.tag.occ { background: var(--gold-soft); color: var(--gold); }
.tag.clean { background: var(--amber-soft); color: var(--amber); }
.tag.out { background: var(--crimson-soft); color: var(--crimson); }
.tag.sky { background: var(--sky-soft); color: var(--sky); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 7px 14px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  transition: all 0.16s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.on {
  background: var(--gold);
  color: #181205;
  border-color: var(--gold);
  font-weight: 600;
}
body[data-theme="light"] .chip.on { background: #143d2d; color: #fff; border-color: #143d2d; }

/* Progress Bars */
.bar { height: 7px; border-radius: 99px; background: var(--bg-input); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); transition: width 0.5s ease; }

/* Lists & Rows */
.list-rows > * + * { border-top: 1px solid var(--border); }
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font: 600 18px var(--serif);
  background: var(--gold-soft);
  color: var(--gold);
  border: 1px solid var(--border);
  flex: none;
}
.item-main { flex: 1; min-width: 0; }
.item-main strong { display: block; font-weight: 600; font-size: 14px; color: var(--text); }
.item-main small { display: block; color: var(--text-muted); font-size: 12.5px; margin-top: 1px; }

/* Room Grid */
.room-card {
  cursor: pointer;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.room-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow); }
.room-num { font: 600 34px/1 var(--serif); color: var(--text); }
.room-rate { font-size: 13px; font-weight: 600; color: var(--gold); }

/* Planner Calendar */
.planner-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--bg-elev); }
.planner-table { width: 100%; min-width: 780px; border-collapse: separate; border-spacing: 0; font-size: 12px; }
.planner-table th, .planner-table td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 0; text-align: center; }
.planner-table thead th { padding: 10px 4px; background: var(--bg-card-2); color: var(--text-muted); font-weight: 500; }
.planner-table thead th strong { display: block; font-size: 14px; color: var(--text); margin-top: 2px; }
.planner-table .sticky-col {
  position: sticky;
  left: 0;
  z-index: 3;
  background: var(--bg-card);
  min-width: 110px;
  text-align: left;
  padding: 10px 12px;
  border-right: 1px solid var(--border-strong);
}
.planner-table td { height: 52px; min-width: 52px; cursor: pointer; transition: background 0.14s; }
.planner-table td.empty-cell:hover { background: var(--gold-soft); }
.planner-table td.cell-in { background: rgba(223, 192, 123, 0.24); color: var(--text); font-weight: 600; }
.planner-table td.cell-res { background: var(--amber-soft); color: var(--amber); font-weight: 600; }
.planner-cell-lbl { display: block; max-width: 68px; margin: 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; padding: 0 3px; }

/* Dining Tables */
.table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.table-tile {
  padding: 14px 10px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--bg-card-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.16s;
}
.table-tile:hover { border-color: var(--border-strong); }
.table-tile.selected { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.table-tile.has-order { background: var(--gold-soft); border-color: var(--gold); }
.table-tile strong { font: 600 22px/1 var(--serif); }
.table-tile small { font-size: 11.5px; color: var(--text-muted); }

.menu-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--border);
}
.menu-row:last-child { border-bottom: 0; }
.menu-tap { flex: 1; text-align: left; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.menu-tap strong { font: 600 17px/1.2 var(--serif); color: var(--text); }
.menu-tap .price { font-weight: 600; color: var(--gold); font-size: 13.5px; }

/* Tables */
.data-table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 10px 8px; border-bottom: 1px solid var(--border-strong); }
.data-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table td.num, .data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table tr.total-row td { font-weight: 700; border-top: 1px solid var(--border-strong); color: var(--gold); }

/* Forms */
.fld { display: block; margin-bottom: 12px; }
.fld > span { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
.fld input, .fld select, .fld textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-input);
  color: var(--text);
  font-size: 14px;
  outline: 0;
  transition: border-color 0.16s, box-shadow 0.16s;
}
.fld input:focus, .fld select:focus, .fld textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-soft);
}
.fld textarea { min-height: 92px; resize: vertical; }
.fld select option { background: var(--bg-elev); color: var(--text); }

.check-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-input);
  margin: 12px 0;
  cursor: pointer;
}
.check-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); margin-top: 2px; flex: none; }

/* Toggle Switch */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--border);
}
.toggle-row:last-child { border-bottom: 0; }
.switch {
  width: 44px;
  height: 24px;
  border-radius: 99px;
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  position: relative;
  flex: none;
  transition: background 0.2s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: transform 0.2s, background 0.2s;
}
.switch.on { background: var(--gold); border-color: var(--gold); }
.switch.on::after { transform: translateX(20px); background: #161105; }

/* Modal / Slide-over Sheet */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(3, 10, 7, 0.72);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.show { display: flex; }
.modal-panel {
  width: min(620px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
  animation: modalIn 0.22s cubic-bezier(0.2, 0.85, 0.3, 1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(0.98); } }
.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.modal-head h2 { font-size: 28px; line-height: 1.1; color: var(--gold); }
.modal-close {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  color: var(--text-muted);
  flex: none;
}
.modal-close:hover { color: var(--text); border-color: var(--border-strong); }

/* UPI intent and locally generated QR */
.upi-qr-panel { display:flex; flex-direction:column; align-items:center; gap:6px; margin:12px auto; }
.upi-qr-canvas { display:block; width: min(256px, 72vw); height:auto; aspect-ratio:1; padding:8px; background:#fff; border:1px solid #d7c394; border-radius:12px; image-rendering:pixelated; }
.upi-qr-caption { color:#52665a; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
.checkout-note { padding:10px 12px; border:1px solid var(--border); border-radius:10px; color:var(--text-muted); font-size:12px; line-height:1.5; background:var(--bg-card-2); }
/* UPI intent card */
.upi-intent-card {
  background: #fffdf8;
  color: #182920;
  border: 1px solid #d7c394;
  border-radius: 16px;
  padding: 18px;
  text-align: center;
  margin: 14px 0;
}
.upi-intent-card .btn.ghost, .upi-intent-card button.btn {
  color: #17392b !important;
  background: #f2ead7 !important;
  border: 1px solid #b99a55 !important;
  opacity: 1 !important;
  text-shadow: none !important;
}
.upi-intent-card .btn:disabled { opacity: .55 !important; }
/* Invoice & Thermal Receipt */
.invoice-paper {
  background: #fffdf8;
  color: #1f2b24;
  border-radius: 14px;
  padding: 24px;
  border: 1px solid #e3dac6;
  position: relative;
  overflow: hidden;
  font-family: var(--sans);
}
.invoice-paper::before {
  content: "";
  display: block;
  height: 5px;
  margin: -24px -24px 20px;
  background: linear-gradient(90deg, #133829, #2b674c 60%, #c8a253);
}
.invoice-paper h3 { font-family: var(--serif); font-size: 26px; color: #133829; }
.invoice-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
.invoice-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #5b6e63; border-bottom: 1px solid #cbd5ce; padding: 8px 4px; }
.invoice-table td { padding: 9px 4px; border-bottom: 1px solid #eeeae0; }
.invoice-table td:last-child, .invoice-table th:last-child { text-align: right; }
.paid-stamp {
  position: absolute;
  right: 24px;
  top: 120px;
  transform: rotate(-14deg);
  border: 3px double #1d7a52;
  color: #1d7a52;
  font: 700 22px var(--serif);
  letter-spacing: 0.18em;
  padding: 3px 14px;
  border-radius: 8px;
  opacity: 0.45;
  pointer-events: none;
}

.thermal-paper {
  background: #fff;
  color: #111;
  font: 12px/1.45 "Courier New", monospace;
  padding: 16px 12px;
  margin: 0 auto;
  border-radius: 8px;
  border: 1px solid #ddd;
}
.thermal-paper.w80 { width: 300px; max-width: 100%; }
.thermal-paper.w58 { width: 224px; max-width: 100%; }
.thermal-rule { border: 0; border-top: 1px dashed #444; margin: 9px 0; }

/* Toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 90px);
  z-index: 90;
  padding: 11px 18px;
  border-radius: 99px;
  background: var(--gold);
  color: #161105;
  font-weight: 600;
  font-size: 13.5px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
  transition: transform 0.28s cubic-bezier(0.2, 1.2, 0.3, 1), opacity 0.25s;
  opacity: 0;
  pointer-events: none;
  max-width: calc(100vw - 32px);
  text-align: center;
}
#toast.show { transform: translate(-50%, 0); opacity: 1; }

/* Device persistence status */
.persistence-alert {
  margin: 10px 24px 0;
  padding: 10px 13px;
  border: 1px solid rgba(223, 124, 112, 0.5);
  border-radius: 12px;
  background: var(--crimson-soft);
  color: var(--crimson);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.persistence-alert[hidden] { display: none !important; }
.persistence-alert[data-state="conflict"] { color: var(--crimson); border-color: rgba(223,124,112,.65); background: var(--crimson-soft); }
.persistence-alert[data-state="checking"] { color: var(--sky); border-color: rgba(138,183,232,.45); background: var(--sky-soft); }

.persistence-alert[data-state="warning"], .persistence-alert[data-state="fallback"] {
  color: var(--amber);
  border-color: rgba(237, 187, 93, 0.5);
  background: var(--amber-soft);
}
@media (max-width: 900px) { .persistence-alert { margin: 6px 14px 0; padding: 8px 10px; font-size: 10.5px; } }

/* Mobile Bottom Dock */
.mobile-new-booking {
  display: none;
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  z-index: 41;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 1px solid rgba(255,255,255,.38);
  border-radius: 14px;
  background: linear-gradient(135deg, #e2c783, #c79b4b);
  color: #081711;
  box-shadow: 0 10px 26px rgba(4, 11, 8, .42);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .01em;
}
.mobile-new-booking svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.mobile-dock {
  display: none;
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  background: color-mix(in srgb, var(--bg-elev) 92%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  padding: 5px;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
}
.dock-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 7px 2px;
  border-radius: 14px;
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  line-height: 1.1;
  min-width: 0;
}
.dock-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.dock-btn.active { background: var(--gold-soft); color: var(--gold); font-weight: 600; }

 .nb-repeat-section {
  padding: 13px;
  margin: 12px 0;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(8, 23, 17, .22);
}
.nb-repeat-section-head, .nb-repeat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.nb-repeat-section-head { margin-bottom: 10px; }
.nb-repeat-row { padding: 12px; margin-top: 9px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card-2); }
.nb-repeat-head { margin-bottom: 8px; }
.nb-repeat-row .grid { gap: 8px; }
.nb-repeat-row .fld { min-width: 0; }

.empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-muted);
  font: italic 500 18px var(--serif);
}

.chart-box { position: relative; height: 240px; width: 100%; }
.chart-box-sm { position: relative; height: 210px; width: 100%; }
.chart-fallback { display:flex; align-items:stretch; justify-content:space-around; gap:10px; height:100%; padding:12px 4px 4px; }
.chart-fallback-bar { display:flex; flex:1; min-width:0; flex-direction:column; align-items:center; justify-content:flex-end; gap:7px; height:100%; }
.chart-fallback-bar strong { color:var(--text-muted); font-size:9px; font-weight:600; white-space:nowrap; }
.chart-fallback-bar i { display:block; width:min(26px,72%); min-height:4px; border-radius:7px 7px 2px 2px; background:linear-gradient(180deg,var(--gold-bright),var(--gold-dim)); }
.chart-fallback-bar span { color:var(--text-dim); font-size:10px; }
.donut-fallback-wrap { display:flex; align-items:center; justify-content:center; gap:18px; height:100%; }
.donut-fallback { width:132px; height:132px; flex:none; display:grid; place-items:center; border-radius:50%; position:relative; }
.donut-fallback::before { content:""; position:absolute; inset:17px; border-radius:50%; background:var(--bg-card); }
.donut-fallback span { position:relative; z-index:1; color:var(--text); font-size:12px; font-weight:800; }
.donut-legend { display:grid; gap:8px; color:var(--text-muted); font-size:11px; }
.donut-legend span { display:flex; align-items:center; gap:7px; }
.donut-legend i { width:8px; height:8px; flex:none; border-radius:50%; }

/* Responsive Breakpoints */
@media (max-width: 1040px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g2-wide { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .sidebar { display: none; }
  .mobile-brand { display: flex; }
  .mobile-dock { display: grid; }
  .mobile-new-booking { display: flex; }
  .topbar { padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; }
  .main-pad { padding: 16px 14px calc(164px + env(safe-area-inset-bottom, 0px)); }
  .page-crumb { display: none; }
  #toast { bottom: calc(148px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 640px) {
  .g2, .g3 { grid-template-columns: 1fr; }
  .hero { padding: 10px; min-height: 0; margin-bottom: 10px; }
  .hero-eyebrow { font-size: 9px; margin-bottom: 2px; }
  .hero h1 { font-size: 24px; margin-bottom: 0; }
  .hero-tagline { display:none; }
  .avail-bar { grid-template-columns: 1fr 1fr; margin-top: 8px; padding: 8px; gap: 7px; }
  .avail-field input { padding: 5px 7px; font-size: 11.5px; }
  .avail-bar .btn { min-height: 32px; padding: 6px 8px; }
  .dashboard-alerts { gap: 7px; margin-bottom: 10px; }
  .dashboard-alerts .card { padding: 8px; gap: 6px; }
  .dashboard-alerts .card strong { font-size: 11px; }
  .dashboard-alerts .card .dim { font-size: 9px; }
  .dashboard-alerts .card .btn { padding: 5px 7px; font-size: 9px; }
  .kpi-card { padding: 10px; }
  .kpi-label { font-size: 10px; }
  .kpi-value { font-size: 27px; margin: 4px 0 2px; }
  .kpi-sub { font-size: 10px; }
  .avail-bar .btn { grid-column: 1 / -1; width: 100%; }
  .modal-backdrop { align-items: flex-end; padding: 0; }
  .modal-panel { border-radius: 24px 24px 0 0; max-height: 92vh; padding: 20px 16px calc(26px + env(safe-area-inset-bottom, 0px)); }
}

@media print {
  body * { visibility: hidden; }
  .print-area, .print-area * { visibility: visible; }
  .print-area { position: fixed; left: 0; top: 0; width: 100%; margin: 0; box-shadow: none; border: 0; }
  .no-print { display: none !important; }
}

        !value.settings || typeof value.settings !== "object" || Array.isArray(value.settings)) return false;
    if (!value.rooms.every(x => x && typeof x === "object") || !value.bookings.every(x => x && typeof x === "object")) return false;
    const optionalArrays = ["guests", "inventory", "expenses", "tables", "sales", "audit", "histRevenue", "upiSessions", "upiAlerts", "cancelled", "financialLedger"];
    return optionalArrays.every(key => value[key] == null || Array.isArray(value[key]));
  }

  function normalizeLoadedState(value) {
    if (!validatePersistedState(value)) throw new Error("Saved PMS data is incomplete or has an unsupported structure.");
    const defaults = createDefaultState();
    S = Object.assign(defaults, value);
    S.settings = Object.assign(defaults.settings, value.settings || {});
    S.restaurant = Object.assign(defaults.restaurant, value.restaurant || {});
    S.autopilot = Object.assign(defaults.autopilot, value.autopilot || {});
    S.menu = Object.assign(defaults.menu, value.menu || {});
    ["inventory", "expenses", "tables", "sales", "audit", "histRevenue", "upiSessions", "upiAlerts", "cancelled", "financialLedger"].forEach(key => {
      if (!Array.isArray(value[key])) S[key] = [];
    });
    if (!Array.isArray(value.guests)) {
      const names = [...new Set(S.bookings.map(b => String(b.g || "").trim()).filter(Boolean))];
      S.guests = names.map(n => ({ n, ph: "", em: "", idt: "Aadhaar (UIDAI)", idn: "", occ: [], veh: [] }));
    }
    if (S.tab === "more") S.tab = "set";
    const validTabs = ["home", "rooms", "stays", "upi", "dining", "guests", "hk", "inv", "exp", "rep", "aud", "set", "more"];
    if (!validTabs.includes(S.tab)) S.tab = "home";
    S.bookings = S.bookings.map(b => Object.assign({ oc: [], veh: [] }, b, {
      oc: Array.isArray(b.oc) ? b.oc : [],
      veh: Array.isArray(b.veh) ? b.veh : []
    }));
    S.guests = S.guests.filter(g => g && typeof g === "object").map(g => Object.assign({ occ: [], veh: [] }, g, {
      occ: Array.isArray(g.occ) ? g.occ : [],
      veh: Array.isArray(g.veh) ? g.veh : []
    }));
    if (!S.settings.name || S.settings.name === "Hari Om Retreat") S.settings.name = "Aurelia PMS";
    if (S.settings.tag === "Peace, comfort and mindful hospitality.") S.settings.tag = "Property operations, unified.";
    if (S.settings.addr === "14 Lotus Courtyard Road, Nashik, Maharashtra 422005") S.settings.addr = "";
    if (S.settings.upi === "hariomretreat@icici") S.settings.upi = "";
    if (String(S.restaurant.addr || "").includes("Hari Om Retreat")) S.restaurant.addr = "";
  }

  function openDeviceDatabase() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("IndexedDB is not supported by this WebView/browser.")); return; }
      const request = window.indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => db.close();
        resolve(db);
      };
      request.onerror = () => reject(request.error || new Error("Could not open the device database."));
      request.onblocked = () => reject(new Error("The device database is blocked by another open app tab."));
    });
  }

  function readDeviceRecord(db) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, "readonly");
      const req = tx.objectStore(DB_STORE).get(DB_KEY);
      req.onsuccess = () => resolve(req.result == null ? null : req.result);
      req.onerror = () => reject(req.error || new Error("Could not read the device database."));
      tx.onabort = () => reject(tx.error || new Error("Device database read was aborted."));
    });
  }

  function writeDeviceRecord(db, raw) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(raw, DB_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error || new Error("Device database write failed."));
      tx.onabort = () => reject(tx.error || new Error("Device database write was aborted."));
    });
  }

  function readLegacyStorage() {
    try { return { raw: window.localStorage.getItem(STORAGE_KEY), error: null }; }
    catch (error) { return { raw: null, error }; }
  }

  async function requestPersistentStorage() {
    try {
      if (navigator.storage && typeof navigator.storage.persist === "function") {
        persistentStorageGranted = await navigator.storage.persist();
      }
    } catch (_) { persistentStorageGranted = null; }
  }

  function markDeviceSaved() {
    if (persistentStorageGranted !== true) {
      setPersistenceState("warning", persistentStorageGranted === false
        ? "Saved on this device. Browser storage-persistence protection was not granted; export regular JSON backups."
        : "Saved on this device. Browser storage-persistence protection is not confirmed; export regular JSON backups.");
    } else {
      setPersistenceState("verified", "PMS records are saved in IndexedDB and browser storage-persistence protection was granted.");
    }
  }

  function migrateLegacyProjectState(value) {
    if (!value || typeof value !== "object" || Array.isArray(value) ||
        !Array.isArray(value.rooms) || !Array.isArray(value.b) ||
        !Array.isArray(value.g) || !Array.isArray(value.t) ||
        !value.set || typeof value.set !== "object" || Array.isArray(value.set) ||
        !value.menu || typeof value.menu !== "object" || Array.isArray(value.menu)) {
      throw new Error("Previous Aurelia PMS records do not match the supported v2 backup structure.");
    }
    const defaults = createDefaultState();
    const now = new Date().toISOString();
    const bookings = value.b.map((source, index) => {
      const booking = { ...source };
      booking.ch = (Array.isArray(source.ch) ? source.ch : []).map(item =>
        Array.isArray(item) ? { l: String(item[0] || "Charge"), a: Number(item[1]) || 0, c: String(item[2] || "ext") } : item
      );
      const pays = Array.isArray(source.pays) ? source.pays.slice() : [];
      const recorded = pays.reduce((sum, payment) => sum + Math.max(0, Number(payment.a) || 0), 0);
      const legacyPaid = Math.max(0, Number(source.p) || 0);
      if (legacyPaid > recorded + 0.009) {
        pays.push({
          a: Math.round((legacyPaid - recorded) * 100) / 100,
          m: "Previous PMS payment · migrated",
          r: "LEGACY-MIGRATION-" + String(source.id ?? index),
          at: source.updatedAt || source.actualCheckInAt || now,
          source: "legacy-v2-migration"
        });
      }
      booking.pays = pays;
      booking.extensionHistory = Array.isArray(source.extensionHistory) ? source.extensionHistory : [];
      return booking;
    });
    const tables = value.t.map(table => {
      const metadata = value.tableGuests && value.tableGuests[table.n] || {};
      const room = value.tableRooms && value.tableRooms[table.n];
      const orders = (Array.isArray(table.o) ? table.o : []).map(item => {
        if (!Array.isArray(item)) return {
          ...item,
          name: String(item.name || item.n || "Dining item"),
          qty: Math.max(1, Number(item.qty) || 1),
          unit: Math.max(0, Number(item.unit) || 0)
        };
        const qty = Math.max(1, Number(item[2]) || 1);
        const total = Math.max(0, Number(item[1]) || 0);
        const unit = Number.isFinite(Number(item[3])) && Number(item[3]) > 0
          ? Number(item[3]) : total / qty;
        return { name: String(item[0] || "Dining item"), unit, qty };
      });
      return { ...table, guest: metadata.name || table.guest || "", phone: metadata.phone || table.phone || "", room: room || table.room || "", o: orders };
    });
    const menu = Object.keys(value.menu).length
      ? Object.fromEntries(Object.entries(value.menu).map(([category, rows]) => [
          category,
          (Array.isArray(rows) ? rows : []).map(item => Array.isArray(item)
            ? { name: String(item[0] || "Menu item"), price: Number(item[1]) || 0, desc: String(item[2] || "") }
            : item)
        ]))
      : defaults.menu;
    const settings = {
      ...defaults.settings,
      ...value.set,
      name: value.set.name || value.set.n || defaults.settings.name,
      tag: value.set.tag || defaults.settings.tag,
      phone: value.set.phone || value.set.ph || "",
      addr: value.set.addr || "",
      upi: value.set.upi || "",
      cur: value.set.cur || "₹",
      terms: value.terms || value.set.terms || defaults.settings.terms
    };
    const sales = (Array.isArray(value.sales) ? value.sales : []).map(sale => ({
      ...sale,
      items: (Array.isArray(sale.items) ? sale.items : []).map(item => Array.isArray(item)
        ? { name: String(item[0] || "Dining item"), unit: Number(item[1]) || 0, qty: 1 }
        : item)
    }));
    const upiAlerts = (Array.isArray(value.sig) ? value.sig : []).map((alert, index) => ({
      id: String(alert.id || "legacy-alert-" + index),
      amount: Number(alert.amt ?? alert.amount) || 0,
      utr: String(alert.ref || alert.utr || ""),
      app: String(alert.app || "Previous PMS alert"),
      payer: String(alert.payer || alert.name || ""),
      at: alert.at || alert.receivedAt || now,
      status: ["reconciled", "RECONCILED"].includes(alert.st) ? "RECONCILED" : "OPEN"
    })).filter(alert => alert.amount > 0);
    const audit = (Array.isArray(value.aud) ? value.aud : []).map(entry => ({
      action: String(entry.action || entry.a || "Previous PMS event"),
      detail: String(entry.detail || entry.d || ""),
      at: entry.at || now
    }));
    return {
      ...defaults,
      tab: ["home", "rooms", "stays", "upi", "dining", "guests", "hk", "inv", "exp", "rep", "aud", "set"].includes(value.tab) ? value.tab : "home",
      rooms: value.rooms,
      bookings,
      guests: value.g,
      inventory: Array.isArray(value.inv) ? value.inv : [],
      expenses: Array.isArray(value.exp) ? value.exp : [],
      tables,
      sales,
      audit,
      histRevenue: Array.isArray(value.hist) ? value.hist : [],
      todayRevenue: Number(value.today) || 0,
      settings,
      restaurant: { ...defaults.restaurant, ...(value.restaurant || {}) },
      menu,
      financialLedger: Array.isArray(value.financialLedger) ? value.financialLedger : [],
      cancelled: Array.isArray(value.cancelled) ? value.cancelled : [],
      upiAlerts,
      nextId: Math.max(Number(value.nextId) || 0, ...bookings.map(row => Number(row.id) || 0), 100) + 1,
      invoiceSeq: Number(value.invoiceSeq) || defaults.invoiceSeq,
      legacyBackupMetadata: value.bk || null,
      legacyInventoryLedger: Array.isArray(value.led) ? value.led : []
    };
  }

  async function loadState() {
    const legacy = readLegacyStorage();
    let projectLegacy = { raw: null, error: null };
    try { projectLegacy.raw = window.localStorage.getItem("aurelia_lodge_v2"); }
    catch (error) { projectLegacy.error = error; }
    let deviceDbReadCompleted = false;
    let deviceRecordPresent = false;
    try {
      persistenceDb = await openDeviceDatabase();
      const stored = await readDeviceRecord(persistenceDb);
      deviceDbReadCompleted = true;
      deviceRecordPresent = stored != null;
      if (stored != null) {
        const parsed = typeof stored === "string" ? JSON.parse(stored) : stored;
        normalizeLoadedState(parsed);
        const normalized = JSON.stringify(S);
        if (typeof stored !== "string" || normalized !== stored) await writeDeviceRecord(persistenceDb, normalized);
        await requestPersistentStorage();
        markDeviceSaved();
        return true;
      }

      if (legacy.raw) {
        const parsed = JSON.parse(legacy.raw);
        normalizeLoadedState(parsed);
        await writeDeviceRecord(persistenceDb, JSON.stringify(S));
        await requestPersistentStorage();
        markDeviceSaved();
        return true;
      }

      if (projectLegacy.raw) {
        try {
          normalizeLoadedState(migrateLegacyProjectState(JSON.parse(projectLegacy.raw)));
          const normalized = JSON.stringify(S);
          await writeDeviceRecord(persistenceDb, normalized);
          try {
            window.localStorage.setItem(STORAGE_KEY, normalized);
            if (window.localStorage.getItem(STORAGE_KEY) !== normalized) throw new Error("Migrated state read-back did not match.");
          } catch (_) { /* IndexedDB remains the authoritative committed copy. */ }
          await requestPersistentStorage();
          markDeviceSaved();
          addAudit("PMS data migration", "Previous Aurelia main-branch records migrated into the uploaded workspace schema; original source key retained.");
          await writeDeviceRecord(persistenceDb, JSON.stringify(S));
          return true;
        } catch (migrationError) {
          persistenceLoadBlocked = true;
          setPersistenceState("unavailable", "MIGRATION BLOCKED — previous Aurelia PMS records could not be mapped safely. Original records were retained. Restore a verified backup before continuing (" + String(migrationError.message || "validation failed").slice(0, 140) + ").");
          return false;
        }
      }
      if (projectLegacy.error) throw new Error("Could not read the previous Aurelia PMS data key safely.");

      normalizeLoadedState(S);
      await writeDeviceRecord(persistenceDb, JSON.stringify(S));
      await requestPersistentStorage();
      markDeviceSaved();
      return true;
    } catch (error) {
      const deviceDbWasOpened = !!persistenceDb;
      persistenceDb = null;
      if (legacy.raw) {
        try {
          normalizeLoadedState(JSON.parse(legacy.raw));
          persistenceLoadBlocked = false;
          setPersistenceState("fallback", "IndexedDB is unavailable. Records were loaded from legacy browser storage; persistence is best-effort and may be cleared by the browser. Export a JSON backup.");
          return true;
        } catch (legacyError) {
          persistenceLoadBlocked = true;
          setPersistenceState("unavailable", "PERSISTENCE ERROR — saved records could not be validated. Writes are blocked to protect existing data. Restore a verified JSON backup before continuing.");
          return false;
        }
      }
      if (projectLegacy.raw) {
        try {
          normalizeLoadedState(migrateLegacyProjectState(JSON.parse(projectLegacy.raw)));
          const normalized = JSON.stringify(S);
          window.localStorage.setItem(STORAGE_KEY, normalized);
          if (window.localStorage.getItem(STORAGE_KEY) !== normalized) throw new Error("Migrated browser state read-back did not match.");
          persistenceLoadBlocked = false;
          setPersistenceState("fallback", "Previous Aurelia PMS records were migrated to browser storage only because IndexedDB is unavailable. Export a verified JSON backup.");
          return true;
        } catch (migrationError) {
          persistenceLoadBlocked = true;
          setPersistenceState("unavailable", "MIGRATION BLOCKED — previous Aurelia PMS records were retained but could not be migrated safely. " + String(migrationError.message || "Storage unavailable").slice(0, 160));
          return false;
        }
      }
      if (projectLegacy.error) {
        persistenceLoadBlocked = true;
        setPersistenceState("unavailable", "PERSISTENCE UNAVAILABLE — the previous Aurelia PMS data key could not be read. New writes are blocked to protect existing records.");
        return false;
      }
      if (!legacy.error && !deviceRecordPresent && (!deviceDbWasOpened || deviceDbReadCompleted)) {
        try {
          const raw = JSON.stringify(S);
          window.localStorage.setItem(STORAGE_KEY, raw);
          if (window.localStorage.getItem(STORAGE_KEY) !== raw) throw new Error("Legacy storage read-back verification failed.");
          persistenceLoadBlocked = false;
          setPersistenceState("fallback", "IndexedDB is unavailable. Records are saved using browser storage only; this is not guaranteed durable. Export a JSON backup.");
          return true;
        } catch (_) { /* Continue to explicit unavailable state. */ }
      }
      persistenceLoadBlocked = true;
      const reason = error && error.message ? String(error.message).slice(0, 180) : "Unknown storage error";
      setPersistenceState("unavailable", `PERSISTENCE UNAVAILABLE — neither IndexedDB nor browser storage could be verified (${reason}). Changes will not be reported as saved. Do not clear app data; export or restore a verified backup after storage access is repaired.`);
      return false;
    }
  }

  function saveState(forceAfterValidatedRestore = false) {
    if (persistenceLoadBlocked && !forceAfterValidatedRestore) {
      setPersistenceState("unavailable", "SAVE BLOCKED — existing device data could not be read safely. Restore a verified backup before making further changes.");
      return Promise.resolve(false);
    }
    const serialized = JSON.stringify(S);
    let legacyMirrorError = null;
    try {
      window.localStorage.setItem(STORAGE_KEY, serialized);
      if (window.localStorage.getItem(STORAGE_KEY) !== serialized) throw new Error("Browser storage read-back verification failed.");
    } catch (error) { legacyMirrorError = error; }

    pendingWrite = pendingWrite.catch(() => false).then(async () => {
      if (persistenceDb) {
        try {
          await writeDeviceRecord(persistenceDb, serialized);
          persistenceLoadBlocked = false;
          markDeviceSaved();
          return true;
        } catch (error) {
          if (!legacyMirrorError) {
            persistenceLoadBlocked = false;
            setPersistenceState("fallback", "IndexedDB write failed. Latest records are mirrored to browser storage only; export a JSON backup and check app storage permissions.");
            return true;
          }
          setPersistenceState("unavailable", "NOT SAVED — both IndexedDB and browser storage writes failed. Changes currently exist only in memory.");
          return false;
        }
      }
      if (!legacyMirrorError) {
        persistenceLoadBlocked = false;
        setPersistenceState("fallback", "Records are saved using browser storage only; this is not guaranteed durable. Export a JSON backup.");
        return true;
      }
      setPersistenceState("unavailable", "NOT SAVED — " + (legacyMirrorError.message || "device storage write failed.") + " Changes currently exist only in memory.");
      return false;
    });
    return pendingWrite;
  }

  async function persistMutation(successMessage) {
    const saved = await saveState();
    if (!saved) {
      toast("NOT SAVED — device storage could not confirm this change. Do not rely on it; restore storage or backup first.");
      return false;
    }
    if (successMessage) toast(successMessage);
    return true;
  }

  /* Core Calculations */
  const cur = () => (S.settings && S.settings.cur) || "₹";
  const fmtMoney = n => cur() + Math.round(Number(n) || 0).toLocaleString("en-IN");
  const getRoom = num => S.rooms.find(r => String(r.n) === String(num));
  const getBooking = id => S.bookings.find(b => Number(b.id) === Number(id));
  const getGuest = name => S.guests.find(g => String(g.n || "").toLowerCase() === String(name || "").toLowerCase());
  const nightsOf = b => Math.max(1, Number(b.out) - Number(b.in));
  const roomSubtotal = b => nightsOf(b) * (Number((getRoom(b.room) || {}).r) || 0);
  const chargesSubtotal = b => (b.ch || []).reduce((s, x) => s + (Number(x.a) || 0), 0);
  const bookingTotal = b => Math.max(0, roomSubtotal(b) + chargesSubtotal(b) - (Number(b.dc) || 0));
  const bookingPaid = b => (b.pays || []).reduce((s, x) => s + (Number(x.a) || 0), 0);
  const bookingDue = b => Math.max(0, bookingTotal(b) - bookingPaid(b));
  const isRoomFree = (roomNum, start, end, excludeId) => !S.bookings.some(b =>
    Number(b.id) !== Number(excludeId) &&
    String(b.room) === String(roomNum) &&
    b.st !== "done" &&
    Number(b.in) < Number(end) &&
    Number(b.out) > Number(start)
  );
  const addAudit = (a, d) => {
    S.audit.unshift({ a, d, at: new Date().toISOString() });
    if (S.audit.length > 120) S.audit.length = 120;
  };
  const idComplete = g => !!(g && String(g.idn || "").trim());

  /* Toast & Modal */
  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    const statusSuffix = persistenceState === "unavailable" && /saved|restored|updated|created|deleted|added|settled|checked in|checked out|posted|recorded/i.test(String(msg || ""))
      ? " · NOT SAVED TO DEVICE" : persistenceState === "fallback" ? " · BROWSER STORAGE ONLY" : "";
    el.textContent = String(msg || "") + statusSuffix;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  function openModal(title, subtitle, bodyHtml) {
    const root = document.getElementById("modal-root");
    const panel = document.getElementById("modal-panel");
    panel.innerHTML =
      '<div class="modal-head no-print">' +
        '<div><h2>' + esc(title) + '</h2>' + (subtitle ? '<div class="muted" style="margin-top:3px">' + subtitle + '</div>' : '') + '</div>' +
        '<button class="modal-close" type="button" data-action="close-modal" aria-label="Close">✕</button>' +
      '</div>' +
      bodyHtml;
    root.classList.add("show");
    renderUpiQrBlocks(panel);
  }

  function closeModal() {
    document.getElementById("modal-root").classList.remove("show");
  }

  function buildUpiUri(amount, note, ref) {
    const vpa = String(S.settings.upi || "").trim();
    if (!vpa || !vpa.includes("@")) return "";
    const value = Math.max(0, Number(amount) || 0);
    if (!(value > 0)) return "";
    const params = new URLSearchParams({
      pa: vpa,
      pn: S.settings.name || "Aurelia PMS",
      am: value.toFixed(2),
      cu: "INR",
      tn: note || "Aurelia PMS Payment",
      tr: ref || ("AUR" + Date.now())
    });
    return "upi://pay?" + params.toString();
  }

  function buildUpiVpaUri() {
    const vpa = String(S.settings.upi || "").trim();
    if (!/^[^\s@]+@[^\s@]+$/.test(vpa)) return "";
    return "upi://pay?" + new URLSearchParams({ pa: vpa, pn: S.settings.name || "Aurelia PMS", cu: "INR", tn: "Aurelia PMS Payment" }).toString();
  }

  function upiStaticQrAction(uri, vpa) {
    if (!uri) return '<div class="checkout-note">Add your UPI ID in Settings to generate a reusable receive-money QR.</div>';
    return `<div class="upi-qr-panel"><canvas class="upi-qr-canvas" data-upi-qr="${esc(uri)}" width="256" height="256" role="img" aria-label="Reusable UPI receive QR for ${esc(vpa)}"></canvas><div class="upi-qr-caption">Reusable · payer enters amount</div></div>
      <div class="row-wrap no-print" style="justify-content:center;margin-top:8px">
        <button class="btn sm ghost" type="button" data-action="upi-copy-link" data-uri="${esc(uri)}">Copy UPI Link</button>
        <button class="btn sm ghost" type="button" data-action="upi-share" data-uri="${esc(uri)}" data-amount="0">Share QR / Details</button>
        <button class="btn sm ghost" type="button" data-action="upi-download-qr" data-uri="${esc(uri)}">Download QR</button>
      </div>`;
  }

  /* UPI payloads are encoded locally: QR rendering works offline and does not upload payment data. */
  function upiIntentAction(uri, amount, vpa) {
    return `<div class="upi-qr-panel">
      <canvas class="upi-qr-canvas" data-upi-qr="${esc(uri)}" width="256" height="256" role="img" aria-label="Scan to pay ${esc(fmtMoney(amount))} to ${esc(vpa || "configured UPI ID")}"></canvas>
      <div class="upi-qr-caption">Scan with any supported UPI app</div>
    </div>
    <div class="checkout-note no-print" style="margin-top:10px;text-align:center;color:#294438;background:#edf4ee;border-color:#c9d8c9"><strong>Guest pays on their own device:</strong> Share the link with the guest. They tap it on their phone, choose their own installed UPI app, and approve the prefilled exact amount. Staff must not open a UPI app or initiate payment on the guest’s behalf. Opening the app is not proof of payment.</div>
    <div class="row-wrap no-print" style="justify-content:center;margin-top:10px">
      <button class="btn sm ghost" type="button" data-action="upi-copy-link" data-uri="${esc(uri)}">Copy UPI Link</button>
      <button class="btn sm ghost" type="button" data-action="upi-share" data-uri="${esc(uri)}" data-amount="${Number(amount)||0}">Share QR / Details</button>
      <button class="btn sm ghost" type="button" data-action="upi-download-qr" data-uri="${esc(uri)}">Download QR</button>
    </div>
    <div class="dim" style="margin-top:8px;text-align:center">UPI ID: <strong>${esc(vpa || "Not configured")}</strong> · Fixed amount ${fmtMoney(amount)} · Guest chooses UPI app · Verify the bank credit before posting; UTR is optional.</div>`;
  }

  function renderUpiQrBlocks(scope) {
    if (!window.AureliaQRCode) return;
    (scope || document).querySelectorAll("canvas[data-upi-qr]").forEach(canvas => {
      if (canvas.dataset.rendered === "true") return;
      const payload = canvas.getAttribute("data-upi-qr") || "";
      if (!payload) return;
      try {
        const qr = new window.AureliaQRCode(-1, window.AureliaQRErrorCorrectLevel.M);
        qr.addData(payload); qr.make();
        const ctx = canvas.getContext("2d");
        const size = canvas.width || 256, quiet = 4, count = qr.getModuleCount();
        const cell = Math.floor(size / (count + quiet * 2));
        const drawn = cell * (count + quiet * 2), offset = Math.floor((size - drawn) / 2);
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = "#071610";
        for (let row = 0; row < count; row++) for (let col = 0; col < count; col++) {
          if (qr.isDark(row, col)) ctx.fillRect(offset + (col + quiet) * cell, offset + (row + quiet) * cell, cell, cell);
        }
        canvas.dataset.rendered = "true";
      } catch (error) {
        const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#a00"; ctx.font = "12px sans-serif"; ctx.fillText("QR could not be generated", 12, 24);
      }
    });
  }

  function findUpiQr(uri) {
    return Array.from(document.querySelectorAll("canvas[data-upi-qr]")).find(c => c.getAttribute("data-upi-qr") === uri);
  }

  function normalizeWhatsAppPhone(value) {
    const digits = String(value || "").replace(/\D/g, "");
    return digits.length >= 10 && digits.length <= 15 ? digits : "";
  }

  function buildUpiShareMessage(sess, uri) {
    return [
      "Aurelia PMS · Aurelia UPI payment request",
      `Guest: ${sess.guestName || "Guest"}`,
      `Folio: ${sess.note || sess.id}`,
      `Exact amount due: ${fmtMoney(sess.amount)}`,
      `UPI payment link: ${uri}`,
      "Tap the link on your phone, choose your preferred UPI app, and approve the exact amount.",
      "Payment is confirmed only after the receiving bank credit is verified."
    ].join("\n");
  }

  async function shareFolioPaymentToWhatsApp(sessId) {
    const sess = S.upiSessions.find(x => x.id === sessId && x.status === "ACTIVE");
    if (!sess) { toast("This payment request is no longer active."); return; }
    const uri = buildUpiUri(sess.amount, sess.note, sess.id);
    if (!uri) { toast("Configure a valid Aurelia UPI receiving ID first."); return; }
    const phone = normalizeWhatsAppPhone(sess.guestPhone);
    const message = buildUpiShareMessage(sess, uri);
    if (!phone) {
      if (navigator.share) {
        try { await navigator.share({ title: "Aurelia PMS · Aurelia UPI", text: message }); return; }
        catch (error) { if (error && error.name === "AbortError") return; }
      }
      copyText(message, "Payment request copied. Add the guest's WhatsApp number and send it.");
      return;
    }
    const url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
    window.open(url, "_blank", "noopener,noreferrer");
  }

  async function shareUpiPayment(uri, amount) {
    const amountLine = Number(amount) > 0 ? `Amount: ${fmtMoney(amount)}` : "Amount: Enter the amount in your UPI app";
    const text = `Aurelia PMS payment request\n${amountLine}\nPayee: ${S.settings.name || "Aurelia PMS"}\nUPI ID: ${S.settings.upi || ""}\nOpen this link on your own phone to choose your UPI app and pay: ${uri}\n\nPlease pay only the amount shown. Payment is confirmed only after the bank credit is verified.`;
    const canvas = findUpiQr(uri);
    try {
      if (canvas && canvas.toBlob && navigator.share) {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        if (blob) {
          const file = new File([blob], "Aurelia-UPI-QR.png", { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title: "Aurelia PMS UPI Payment", text, files: [file] }); return;
          }
        }
      }
      if (navigator.share) { await navigator.share({ title: "Aurelia PMS UPI Payment", text }); return; }
    } catch (error) { if (error && error.name === "AbortError") return; }
    copyText(text, "Payment details copied. Paste them into WhatsApp or another chat.");
  }

  function downloadUpiQr(uri) {
    const canvas = findUpiQr(uri);
    if (!canvas) { toast("Payment QR is not ready yet."); return; }
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png"); link.download = "Aurelia-UPI-QR.png";
    document.body.appendChild(link); link.click(); link.remove();
    toast("UPI QR downloaded");
  }
