                    ${(occupantRecords.length || vehicleRecords.length) ? `<div class="dim" style="margin-top:3px">${occupantRecords.length ? "Occupants: " + esc(occupantRecords.map(x => x.n).filter(Boolean).join(", ")) : ""}${occupantRecords.length && vehicleRecords.length ? " · " : ""}${vehicleRecords.length ? "Vehicles: " + esc(vehicleRecords.map(x => [x.ty, x.reg].filter(Boolean).join(" ")).join(", ")) : ""}</div>` : ""}
                  </div>
                  <span class="tag ${tagCls}">${tagLbl}</span>
                </div>
                <div class="row" style="padding:10px 12px;border-radius:10px;background:var(--bg-input)">
                  <div><span class="dim">Total</span> <strong style="margin-left:4px">${fmtMoney(bookingTotal(b))}</strong></div>
                  <div><span class="dim">Paid</span> <strong style="margin-left:4px;color:var(--emerald)">${fmtMoney(bookingPaid(b))}</strong></div>
                  <div><span class="dim">Balance</span> <strong style="margin-left:4px;color:${due > 0 ? "var(--gold)" : "var(--emerald)"}">${fmtMoney(due)}</strong></div>
                </div>
                <div class="row" style="flex-wrap:wrap">
                  <span class="tag ${idComplete(g) ? "ready" : "out"}">${idComplete(g) ? "ID Verified" : "ID Incomplete"}</span>
                  <div class="row-wrap">
                    ${g && g.ph ? `<a class="btn xs subtle" href="tel:${esc(g.ph.replace(/[^\d+]/g, ""))}">Call</a>` : ""}
                    ${b.st === "res" ? `
                      <button class="btn xs ghost" type="button" data-action="extend-stay" data-id="${b.id}">Dates</button>
                      <button class="btn xs danger" type="button" data-action="cancel-booking" data-id="${b.id}">Cancel</button>
                      <button class="btn xs" type="button" data-action="checkin" data-id="${b.id}">Check In</button>
                    ` : b.st === "in" ? `
                      <button class="btn xs ghost" type="button" data-action="extend-stay" data-id="${b.id}">Extend</button>
                      <button class="btn xs ghost" type="button" data-action="folio" data-id="${b.id}">Folio</button>
                      <button class="btn xs" type="button" data-action="checkout" data-id="${b.id}">Check Out</button>
                    ` : `
                      <button class="btn xs ghost" type="button" data-action="invoice" data-id="${b.id}">Invoice</button>
                    `}
                  </div>
                </div>
              </div>
            `;
          }).join("") || '<div class="card empty-state" style="grid-column:1/-1">No stays match this view.</div>'}
        </div>
      `;
    },

    dining() {
      const cats = Object.keys(S.menu);
      if (!cats.includes(S.activeCat)) S.activeCat = cats[0] || "Mains";
      const table = S.tables.find(t => Number(t.n) === Number(S.activeTable)) || S.tables[0];
      const ticketTotal = (table.o || []).reduce((s, x) => s + x.unit * x.qty, 0);
      const inHouse = S.bookings.filter(b => b.st === "in");
      const sellable = S.inventory.filter(x => x.sellable && Number(x.price) > 0 && Number(x.q) > 0);

      return `
        <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
          <div>
            <div class="dim">${esc(S.restaurant.name)} · Independent Restaurant Ledger</div>
          </div>
          <div class="row-wrap">
            <button class="btn sm ghost" type="button" data-action="dining-add-table">+ Table</button>
            <button class="btn sm ghost" type="button" data-action="dining-edit-table" data-table="${table.n}">Edit Table ${table.n}</button>
            <button class="chip ${S.editMenu ? "on" : ""}" type="button" data-action="dining-toggle-edit">${S.editMenu ? "Done Editing Menu" : "Edit Menu"}</button>
          </div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="table-grid">
            ${S.tables.map(t => {
              const sum = (t.o || []).reduce((a, x) => a + x.unit * x.qty, 0);
              return `
                <button class="table-tile ${t.n === table.n ? "selected" : ""} ${sum > 0 ? "has-order" : ""}" type="button" data-action="dining-select-table" data-table="${t.n}">
                  <strong>T${t.n}</strong>
                  <small>${sum > 0 ? fmtMoney(sum) : t.s + " seats"}</small>
                </button>
              `;
            }).join("")}
          </div>
        </div>

        <div class="grid g2-wide">
          <div class="stack">
            <div class="card">
              <div class="row" style="margin-bottom:12px;flex-wrap:wrap">
                <div class="chips">
                  ${cats.map(c => `<button class="chip ${c === S.activeCat ? "on" : ""}" type="button" data-action="dining-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
                  ${S.editMenu ? '<button class="chip" type="button" data-action="dining-add-cat">+ Category</button>' : ""}
                </div>
                ${S.editMenu ? '<button class="btn sm" type="button" data-action="dining-add-dish">+ Add Dish</button>' : ""}
              </div>
              <div>
                ${(S.menu[S.activeCat] || []).map((dish, idx) => `
                  <div class="menu-row">
                    <button class="menu-tap" type="button" data-action="dining-add-item" data-cat="${esc(S.activeCat)}" data-idx="${idx}">
                      <div>
                        <strong>${esc(dish.name)}</strong>
                        <div class="dim">${esc(dish.desc || "")}</div>
                      </div>
                      <span class="price">${fmtMoney(dish.price)}</span>
                    </button>
                    ${S.editMenu ? `<button class="btn xs danger" type="button" data-action="dining-del-dish" data-cat="${esc(S.activeCat)}" data-idx="${idx}">Remove</button>` : ""}
                  </div>
                `).join("") || '<div class="empty-state">No dishes in this category yet.</div>'}
              </div>
            </div>

            ${sellable.length ? `
              <div class="card">
                <h3 style="font-size:20px;margin-bottom:4px">Retail &amp; Minibar Stock</h3>
                <div class="dim" style="margin-bottom:10px">Adding an item deducts from inventory automatically.</div>
                ${sellable.map(item => `
                  <div class="menu-row">
                    <button class="menu-tap" type="button" data-action="dining-sell-stock" data-name="${esc(item.n)}">
                      <div><strong>${esc(item.n)}</strong><div class="dim">${item.q} in stock</div></div>
                      <span class="price">${fmtMoney(item.price)}</span>
                    </button>
                  </div>
                `).join("")}
              </div>
            ` : ""}
          </div>

          <div class="stack">
            <div class="card">
              <div class="row" style="margin-bottom:12px">
                <h3 style="font-size:24px">Table ${table.n} Ticket</h3>
                <span style="font:600 26px var(--serif);color:var(--gold)">${fmtMoney(ticketTotal)}</span>
              </div>
              <div class="list-rows">
                ${(table.o || []).map((line, i) => `
                  <div class="list-item">
                    <div class="item-main">
                      <strong>${esc(line.name)}</strong>
                      <small>${fmtMoney(line.unit)} × ${line.qty} = ${fmtMoney(line.unit * line.qty)}</small>
                    </div>
                    <div class="row-wrap">
                      <button class="btn xs subtle" type="button" data-action="dining-qty" data-idx="${i}" data-delta="-1">−</button>
                      <span style="min-width:20px;text-align:center;font-weight:600">${line.qty}</span>
                      <button class="btn xs subtle" type="button" data-action="dining-qty" data-idx="${i}" data-delta="1">+</button>
                    </div>
                  </div>
                `).join("") || '<div class="empty-state">Tap any dish to add it to Table ' + table.n + '.</div>'}
              </div>
              ${table.o.length ? `
                <div class="grid g2" style="margin-top:16px">
                  <button class="btn ghost full" type="button" data-action="dining-to-room">Charge to Room</button>
                  <button class="btn full" type="button" data-action="dining-upi-settle">Collect via Aurelia UPI</button>
                  <button class="btn full" style="grid-column:1/-1" type="button" data-action="dining-manual-settle">Cash / Bank (card gateway not configured) Transfer</button>
                </div>
              ` : ""}
            </div>

            <div class="card">
              <h3 style="font-size:19px;margin-bottom:8px">Customer &amp; Room Link</h3>
              <label class="fld">
                <span>Link Occupied Room (auto-fills guest)</span>
                <select id="dining-room-link" data-action="dining-link-room">
                  <option value="">Walk-in / Independent Restaurant Bill</option>
                  ${inHouse.map(b => `<option value="${esc(b.room)}" ${String(table.room) === String(b.room) ? "selected" : ""}>Room ${esc(b.room)} · ${esc(b.g)}</option>`).join("")}
                </select>
              </label>
              <label class="fld"><span>Customer Name</span><input id="dining-guest-name" value="${esc(table.guest || "")}" placeholder="Walk-in guest name"></label>
              <label class="fld"><span>Phone Number</span><input id="dining-guest-phone" type="tel" value="${esc(table.phone || "")}" placeholder="+91 ..."></label>
              <button class="btn sm ghost" type="button" data-action="dining-save-meta">Save Ticket Details</button>
            </div>

            <div class="card">
              <h3 style="font-size:19px;margin-bottom:8px">Settled Dining Bills (${S.sales.length})</h3>
              <div class="list-rows">
                ${S.sales.slice().reverse().slice(0, 6).map(s => `
                  <div class="list-item">
                    <div class="item-main">
                      <strong>${esc(s.guest || "Walk-in")} · ${fmtMoney(s.a)}</strong>
                      <small>${esc(s.id)} · T${esc(s.t)} · ${esc(s.m)}</small>
                    </div>
                    <button class="btn xs ghost" type="button" data-action="rest-receipt" data-sale="${esc(s.id)}">Receipt</button>
                  </div>
                `).join("") || '<div class="dim">No settled bills yet.</div>'}
              </div>
            </div>
          </div>
        </div>
      `;
    },

    upi() {
      const openFolios = S.bookings.filter(b => bookingDue(b) > 0);
      const openTables = S.tables.filter(t => (t.o || []).length > 0);
      const folioRows = openFolios.map(b => `
        <div class="list-item" style="flex-wrap:wrap">
          <div class="item-main"><strong>${esc(b.g)} · Room ${esc(b.room)}</strong><small>Folio balance due: ${fmtMoney(bookingDue(b))}</small></div>
          <div class="row-wrap">
            <button class="btn xs emerald" type="button" data-action="upi-create-folio" data-id="${b.id}">Aurelia UPI · ${fmtMoney(bookingDue(b))}</button>
            <button class="btn xs ghost" type="button" data-action="folio-manual-payment" data-id="${b.id}">Cash / Bank</button>
          </div>
        </div>`).join("");
      const diningRows = openTables.map(t => {
        const amount = t.o.reduce((sum, item) => sum + Number(item.unit || 0) * Number(item.qty || 0), 0);
        return `
          <div class="list-item" style="flex-wrap:wrap">
            <div class="item-main"><strong>Dining Table ${esc(t.n)} · ${esc(t.guest || "Walk-in")}</strong><small>Open dining ticket: ${fmtMoney(amount)}</small></div>
            <div class="row-wrap">
              <button class="btn xs emerald" type="button" data-action="upi-create-table" data-table="${esc(t.n)}">Aurelia UPI · ${fmtMoney(amount)}</button>
              <button class="btn xs ghost" type="button" data-action="upi-cash-table" data-table="${esc(t.n)}">Cash / Bank</button>
            </div>
          </div>`;
      }).join("");
      return `
        <section class="card" style="margin-bottom:16px">
          <div class="row" style="flex-wrap:wrap;margin-bottom:10px"><div><h3 style="font-size:22px">Open Balances Ready to Collect</h3><div class="dim">Every room folio and dining ticket supports Aurelia UPI, cash or bank transfer.</div></div><span class="tag occ">${openFolios.length + openTables.length} open</span></div>
          <div class="list-rows">
            ${folioRows}${diningRows}
            ${(!openFolios.length && !openTables.length) ? '<div class="empty-state">All folios and dining tickets are settled.</div>' : ""}
          </div>
        </section>
        <div id="aurelia-upi-root">${window.AureliaUPI ? window.AureliaUPI.render(window.AureliaPmsContext) : '<div class="card"><h3>Aurelia UPI is loading</h3><p class="dim">Encrypted payment storage and the notification observer are initializing.</p></div>'}</div>
      `;
    },

    guests() {
      return `
        <div class="row" style="margin-bottom:16px;flex-wrap:wrap">
          <div class="dim">${S.guests.length} registered guest profiles</div>
          <button class="btn sm" type="button" data-action="guest-new">+ Add Guest</button>
        </div>
        <div class="grid g2">
          ${S.guests.map((g, idx) => {
            const stayCount = S.bookings.filter(b => b.g === g.n).length;
            const occupantNames = (g.occ || []).map(x => x.n).filter(Boolean).join(", ");
            const vehicleNames = (g.veh || []).map(x => [x.ty, x.reg].filter(Boolean).join(" ")).filter(Boolean).join(", ");
            return `
              <div class="card stack" style="gap:10px">
                <div class="row">
                  <div class="row" style="justify-content:flex-start">
                    <div class="avatar">${esc((g.n || "?")[0])}</div>
                    <div>
                      <strong style="font-size:15px">${esc(g.n)}</strong>
                      <div class="dim">${esc(g.ph || "No phone")} · ${esc(g.em || "No email")}</div>
                    </div>
                  </div>
                  <span class="tag ${idComplete(g) ? "ready" : "out"}">${idComplete(g) ? esc(g.idt) : "ID Missing"}</span>
                </div>
                <div class="dim">${stayCount} stay(s) · ${(g.occ || []).length} occupant(s) · ${(g.veh || []).length} vehicle(s)</div>
                ${occupantNames ? `<div class="dim">Occupants: ${esc(occupantNames)}</div>` : ""}
                ${vehicleNames ? `<div class="dim">Vehicles: ${esc(vehicleNames)}</div>` : ""}
                <div class="row">
                  <div class="row-wrap">
                    <button class="btn xs ghost" type="button" data-action="guest-edit" data-idx="${idx}">Edit</button>
                    <button class="btn xs" type="button" data-action="new-booking" data-guest="${esc(g.n)}">Book</button>
                  </div>
                </div>
              </div>
            `;
          }).join("") || '<div class="card empty-state" style="grid-column:1/-1">No guest profiles yet.</div>'}
        </div>
      `;
    },

    hk() {
      const nonOcc = S.rooms.filter(r => r.s !== "occ");
      return `
        <div class="card">
          <div class="row" style="margin-bottom:12px">
            <div>
              <h3 style="font-size:22px">Housekeeping Queue</h3>
              <div class="dim">Release cleaned chambers or place suites out of service</div>
            </div>
            <span class="tag clean">${S.rooms.filter(r => r.s === "clean").length} need cleaning</span>
          </div>
          <div class="list-rows">
            ${nonOcc.map(r => `
              <div class="list-item" style="flex-wrap:wrap">
                <div class="item-main">
                  <strong>Room ${esc(r.n)} · ${esc(r.t)}</strong>
                  <small>${fmtMoney(r.r)} / night</small>
                </div>
                <div class="row-wrap">
                  <span class="tag ${esc(r.s)}">${{ ready: "Ready", clean: "Cleaning", out: "Out of Service" }[r.s]}</span>
                  ${r.s === "ready"
                    ? `<button class="btn xs ghost" type="button" data-action="hk-status" data-room="${esc(r.n)}" data-status="clean">Mark Cleaning</button>`
                    : `<button class="btn xs emerald" type="button" data-action="hk-status" data-room="${esc(r.n)}" data-status="ready">Release Ready</button>`}
                  ${r.s !== "out"
                    ? `<button class="btn xs danger" type="button" data-action="hk-status" data-room="${esc(r.n)}" data-status="out">Out of Service</button>`
                    : ""}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    },

    inv() {
      return `
        <div class="row" style="margin-bottom:16px">
          <div class="dim">${S.inventory.length} tracked stock items</div>
          <button class="btn sm" type="button" data-action="inv-new">+ Add Stock Item</button>
        </div>
        <div class="grid g2" style="margin-bottom:16px">
          ${S.inventory.map((x, idx) => {
            const low = Number(x.q) <= Number(x.ro);
            const pct = Math.min(100, Math.round((x.q / Math.max(1, x.ro * 2)) * 100));
            return `
              <div class="card">
                <div class="row">
                  <h3 style="font-size:21px">${esc(x.n)}</h3>
                  ${low ? '<span class="tag out">Low Stock</span>' : '<span class="tag ready">Healthy</span>'}
                </div>
                <div class="muted" style="margin-top:4px">${x.q} in stock · Reorder at ${x.ro} · Value ${fmtMoney(x.q * x.u)}</div>
                <div class="dim">${x.sellable ? "Sellable in Dining POS at " + fmtMoney(x.price) : "Internal housekeeping / kitchen stock"}</div>
                <div class="bar"><i style="width:${pct}%"></i></div>
                <div class="row-wrap" style="margin-top:12px">
                  <button class="btn xs emerald" type="button" data-action="inv-adjust" data-idx="${idx}" data-dir="1">+ Purchase</button>
                  <button class="btn xs ghost" type="button" data-action="inv-adjust" data-idx="${idx}" data-dir="-1">− Issue</button>
                  <button class="btn xs danger" type="button" data-action="inv-del" data-idx="${idx}">Remove</button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
        <div class="card">
          <h3 style="font-size:20px;margin-bottom:8px">Stock Movement Ledger</h3>
          <div class="list-rows">
            ${S.stockLedger.slice(0, 15).map(l => `
              <div class="list-item">
                <div class="item-main"><strong>${esc(l.item)}</strong><small>${esc(l.note)} · ${fmtDateTime(l.at)}</small></div>
                <span class="tag ${l.delta > 0 ? "ready" : "clean"}">${l.delta > 0 ? "+" : ""}${l.delta}</span>
              </div>
            `).join("") || '<div class="empty-state">No stock movements recorded yet.</div>'}
          </div>
        </div>
      `;
    },

    exp() {
      const activeTotal = S.expenses.filter(e => !e.v).reduce((s, e) => s + (Number(e.a) || 0), 0);
      return `
        <div class="row" style="margin-bottom:16px">
          <div><div class="dim">Active Operating Expenses</div><div style="font:600 28px var(--serif);color:var(--gold)">${fmtMoney(activeTotal)}</div></div>
          <button class="btn sm" type="button" data-action="exp-new">+ Record Expense</button>
        </div>
        <div class="card">
          <div class="list-rows">
            ${S.expenses.map(e => `
              <div class="list-item" style="${e.v ? "opacity:.45;text-decoration:line-through" : ""}">
                <div class="item-main">
                  <strong>${esc(e.t)}</strong>
                  <small>${esc(e.c)} · ${fmtDateFull(e.at)}${e.v ? " · Voided" : ""}</small>
                </div>
                <div class="row-wrap">
                  <strong>${fmtMoney(e.a)}</strong>
                  ${!e.v ? `<button class="btn xs danger" type="button" data-action="exp-void" data-id="${e.id}">Void</button>` : ""}
                </div>
              </div>
            `).join("") || '<div class="empty-state">No expenses recorded.</div>'}
          </div>
        </div>
      `;
    },

    rep() {
      const m = computeFinancials();
      return `
        <div class="grid g4" style="margin-bottom:16px">
          <div class="card kpi-card"><div class="kpi-label">Total Revenue</div><div class="kpi-value kpi-accent">${fmtMoney(m.totalRevenue)}</div><div class="kpi-sub">Rooms, dining &amp; extras</div></div>
          <div class="card kpi-card"><div class="kpi-label">Active Expenses</div><div class="kpi-value">${fmtMoney(m.expenses)}</div><div class="kpi-sub">Operating outflows</div></div>
          <div class="card kpi-card"><div class="kpi-label">Operating Profit</div><div class="kpi-value" style="color:${m.profit >= 0 ? "var(--emerald)" : "var(--crimson)"}">${fmtMoney(m.profit)}</div><div class="kpi-sub">Before tax &amp; depreciation</div></div>
          <div class="card kpi-card"><div class="kpi-label">Guest Receivables</div><div class="kpi-value">${fmtMoney(m.receivables)}</div><div class="kpi-sub">Unsettled folio balances</div></div>
        </div>

        <div class="grid g2" style="margin-bottom:16px">
          <div class="card">
            <h3 style="font-size:21px;margin-bottom:10px">Revenue Mix</h3>
            <div class="chart-box-sm"><canvas id="rep-donut-chart"></canvas></div>
          </div>
          <div class="card">
            <div class="row" style="margin-bottom:10px">
              <h3 style="font-size:21px">Management Export</h3>
              <span class="tag sky">CSV Ready</span>
            </div>
            <p class="muted" style="margin:0 0 14px">Export structured operational Profit &amp; Loss, provisional Balance Sheet schedule, or the double-entry Cancellation Journal for your Chartered Accountant.</p>
            <div class="stack">
              <button class="btn sm" type="button" data-action="export-csv" data-kind="pl">Export Profit &amp; Loss (CSV)</button>
              <button class="btn sm ghost" type="button" data-action="export-csv" data-kind="bs">Export Balance Sheet Schedule (CSV)</button>
              <button class="btn sm ghost" type="button" data-action="export-csv" data-kind="journal">Export Cancellation Journal (CSV)</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
            <h3 style="font-size:22px">Financial Control</h3>
            <div class="chips">
              <button class="chip ${S.finTab === "pl" ? "on" : ""}" type="button" data-fin-tab="pl">Profit &amp; Loss</button>
              <button class="chip ${S.finTab === "bs" ? "on" : ""}" type="button" data-fin-tab="bs">Balance Sheet</button>
              <button class="chip ${S.finTab === "journal" ? "on" : ""}" type="button" data-fin-tab="journal">Cancellation Journal</button>
            </div>
          </div>
          ${S.finTab === "pl" ? `
            <div class="data-table-wrap">
              <table class="data-table">
                <thead><tr><th>Particulars</th><th class="num">Amount (${esc(cur())})</th></tr></thead>
                <tbody>
                  <tr><td>Room Revenue (Active &amp; Past Stays)</td><td class="num">${fmtMoney(m.rooms)}</td></tr>
                  <tr><td>Dining &amp; Restaurant Revenue</td><td class="num">${fmtMoney(m.dining)}</td></tr>
                  <tr><td>Extras &amp; Ancillary Services</td><td class="num">${fmtMoney(m.extras)}</td></tr>
                  <tr><td>Cancellation Retention Revenue</td><td class="num">${fmtMoney(m.retention)}</td></tr>
                  <tr><td>Less: Guest Discounts</td><td class="num" style="color:var(--crimson)">−${fmtMoney(m.discounts)}</td></tr>
                  <tr class="total-row"><td>Total Recorded Revenue</td><td class="num">${fmtMoney(m.totalRevenue)}</td></tr>
                  <tr><td>Less: Operating Expenses</td><td class="num" style="color:var(--crimson)">−${fmtMoney(m.expenses)}</td></tr>
                  <tr class="total-row"><td>Estimated Operating Profit / (Loss)</td><td class="num">${fmtMoney(m.profit)}</td></tr>
                </tbody>
              </table>
            </div>
          ` : S.finTab === "bs" ? `
            <div class="data-table-wrap">

  function computeFinancials() {
    const activeStays = S.bookings.filter(b => b.st !== "res");
    const rooms = activeStays.reduce((s, b) => s + roomSubtotal(b), 0);
    const dinFolio = activeStays.flatMap(b => b.ch || []).filter(x => x.c === "din").reduce((s, x) => s + (Number(x.a) || 0), 0);
    const dinSales = S.sales.filter(x => !x.postedToHotel).reduce((s, x) => s + (Number(x.a) || 0), 0);
    const dining = dinFolio + dinSales;
    const extras = activeStays.flatMap(b => b.ch || []).filter(x => x.c !== "din").reduce((s, x) => s + (Number(x.a) || 0), 0);
    const discounts = activeStays.reduce((s, b) => s + (Number(b.dc) || 0), 0);
    const retention = S.financialLedger.reduce((sum, e) => sum + e.lines.filter(l => l.account === "Cancellation Revenue").reduce((a, l) => a + (l.credit || 0), 0), 0);
    const refundsPayable = S.financialLedger.reduce((sum, e) => sum + e.lines.filter(l => l.account === "Refunds Payable Liability").reduce((a, l) => a + (l.credit || 0) - (l.debit || 0), 0), 0);
    const totalRevenue = rooms + dining + extras + retention - discounts;
    const expenses = S.expenses.filter(e => !e.v).reduce((s, e) => s + (Number(e.a) || 0), 0);
    const profit = totalRevenue - expenses;
    const collected = S.bookings.reduce((s, b) => s + bookingPaid(b), 0) + dinSales;
    const receivables = S.bookings.filter(b => b.st === "in").reduce((s, b) => s + bookingDue(b), 0);
    const stockVal = S.inventory.reduce((s, x) => s + (Number(x.q) || 0) * (Number(x.u) || 0), 0);
    return { rooms, dining, extras, discounts, retention, refundsPayable, totalRevenue, expenses, profit, collected, receivables, stockVal };
  }
  /* Charts */
  function mountCharts() {
    if (revenueChartInst) { revenueChartInst.destroy(); revenueChartInst = null; }
    if (donutChartInst) { donutChartInst.destroy(); donutChartInst = null; }
    if (typeof window.Chart !== "function") {
      const revCanvas = document.getElementById("home-rev-chart");
      if (revCanvas) {
        const values = [...(Array.isArray(S.histRevenue) ? S.histRevenue : []), Number(S.todayRevenue) || 0].slice(-7);
        const labels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Today"].slice(-values.length);
        const max = Math.max(1, ...values.map(v => Number(v) || 0));
        revCanvas.parentElement.innerHTML = `<div class="chart-fallback">${values.map((v, i) => `<div class="chart-fallback-bar"><strong>${fmtMoney(v)}</strong><i style="height:${Math.max(4, (Number(v) || 0) / max * 100)}%"></i><span>${labels[i]}</span></div>`).join("")}</div>`;
      }
      const donutCanvas = document.getElementById("rep-donut-chart");
      if (donutCanvas) {
        const m = computeFinancials();
        const values = [Math.max(0, m.rooms), Math.max(0, m.dining), Math.max(0, m.extras)];
        const total = values.reduce((a, b) => a + b, 0);
        const p1 = total ? values[0] / total * 100 : 0;
        const p2 = total ? (values[0] + values[1]) / total * 100 : 0;
        donutCanvas.parentElement.innerHTML = `<div class="donut-fallback-wrap"><div class="donut-fallback" style="background:conic-gradient(var(--gold) 0 ${p1}%, var(--emerald) ${p1}% ${p2}%, var(--sky) ${p2}% 100%)"><span>${fmtMoney(total)}</span></div><div class="donut-legend"><span><i style="background:var(--gold)"></i>Rooms ${fmtMoney(values[0])}</span><span><i style="background:var(--emerald)"></i>Dining ${fmtMoney(values[1])}</span><span><i style="background:var(--sky)"></i>Extras ${fmtMoney(values[2])}</span></div></div>`;
      }
      return;
    }

    const isLight = S.settings.theme === "light";
    const tickColor = isLight ? "#52665c" : "#9ab0a4";
    const gridColor = isLight ? "rgba(20,61,45,0.08)" : "rgba(223,192,123,0.1)";
    const gold = isLight ? "#1b4d38" : "#dfc07b";

    const revCanvas = document.getElementById("home-rev-chart");
    if (revCanvas) {
      const ctx = revCanvas.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 0, 220);
      grad.addColorStop(0, isLight ? "rgba(27,77,56,0.28)" : "rgba(223,192,123,0.34)");
      grad.addColorStop(1, "rgba(223,192,123,0)");
      revenueChartInst = new Chart(ctx, {
        type: "line",
        data: {
          labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Today"],
          datasets: [{
            label: "Revenue",
            data: [...S.histRevenue, S.todayRevenue],
            borderColor: gold,
            backgroundColor: grad,
            fill: true,
            tension: 0.38,
            pointBackgroundColor: gold,
            pointRadius: 4,
            borderWidth: 2.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: tickColor }, grid: { display: false } },
            y: { ticks: { color: tickColor, callback: v => cur() + (v >= 1000 ? (v / 1000).toFixed(0) + "k" : v) }, grid: { color: gridColor } }
          }
        }
      });
    }

    const donutCanvas = document.getElementById("rep-donut-chart");
    if (donutCanvas) {
      const m = computeFinancials();
      donutChartInst = new Chart(donutCanvas.getContext("2d"), {
        type: "doughnut",
        data: {
          labels: ["Rooms", "Dining", "Extras"],
          datasets: [{
            data: [m.rooms, m.dining, m.extras],
            backgroundColor: [gold, "#3ec48d", "#6ea8fe"],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "66%",
          plugins: { legend: { position: "bottom", labels: { color: tickColor, padding: 14 } } }
        }
      });
    }
  }

  function recordManualFolioPayment(bookingId) {
    const b = getBooking(bookingId); if (!b) return;
    const due = bookingDue(b), amount = Math.round((Number(document.getElementById("manual-pay-amount").value) || 0) * 100) / 100;
    const method = document.getElementById("manual-pay-method").value;
    const reference = document.getElementById("manual-pay-reference").value.trim();
    if (!(amount > 0) || amount > due + 0.009) { toast(`Enter an amount no more than ${fmtMoney(due)}.`); return; }
    if (!document.getElementById("manual-pay-confirm").checked) { toast("Confirm that the payment was received or approved."); return; }
    if (!['cash', 'bank'].includes(method)) { toast("This payment method is unavailable. Use Aurelia UPI, cash or bank transfer."); return; }
    const label = method === "bank" ? "Bank Transfer" : "Cash";
    b.pays = b.pays || []; b.pays.push({ a: amount, m: label, r: reference || (method === "cash" ? "CASH-" + Date.now() : ""), at: new Date().toISOString(), source: "front-desk" });
    S.todayRevenue += amount; addAudit("Folio payment recorded", `${b.g} · Room ${b.room} · ${label} · ${fmtMoney(amount)} · ${reference || label}`);

  function recordManualDiningPayment(tableId) {
    const table = S.tables.find(x => Number(x.n) === Number(tableId)); if (!table || !table.o.length) return;
    const amount = table.o.reduce((sum, item) => sum + Number(item.unit) * Number(item.qty), 0);
    const entered = Math.round((Number(document.getElementById("manual-pay-amount").value) || 0) * 100) / 100;
    const method = document.getElementById("manual-pay-method").value;
    const reference = document.getElementById("manual-pay-reference").value.trim();
    if (Math.abs(entered - amount) > 0.009) { toast(`Dining bill must be settled in full: ${fmtMoney(amount)}.`); return; }
    if (!document.getElementById("manual-pay-confirm").checked) { toast("Confirm that the payment was received or approved."); return; }
    if (!['cash', 'bank'].includes(method)) { toast("This payment method is unavailable. Use Aurelia UPI, cash or bank transfer."); return; }
    const label = method === "bank" ? "Bank Transfer" : "Cash";
    const sale = { id: "RS-" + String(Date.now()).slice(-5), t: table.n, guest: table.guest || "Walk-in", phone: table.phone || "", items: table.o.map(x => ({...x})), a: amount, m: label, ref: reference || (method === "cash" ? "CASH-" + Date.now() : ""), at: new Date().toISOString(), status: "paid", postedToHotel: false };
    S.sales.push(sale); table.o = []; S.todayRevenue += amount; addAudit("Dining bill settled", `${sale.guest} · Table ${table.n} · ${label} · ${fmtMoney(amount)} · ${reference || label}`);
    closeModal(); render(); toast(`${label} dining payment recorded: ${fmtMoney(amount)}.`);

  function recordCheckoutPayment(bookingId) {
    const b = getBooking(bookingId); if (!b || b.st !== "in") return;
    const due = bookingDue(b);
    const amount = Math.round((Number(document.getElementById("checkout-amount")?.value) || 0) * 100) / 100;
    const method = document.getElementById("checkout-method")?.value || "cash";
    const reference = document.getElementById("checkout-reference")?.value.trim() || "";
    const confirmed = !!document.getElementById("checkout-payment-confirm")?.checked;
    if (!(amount > 0) || amount > due + 0.009) { toast(`Enter an amount greater than zero and no more than ${fmtMoney(due)}.`); return; }
    if (!["cash", "bank", "upi"].includes(method)) { toast("This payment method is unavailable. Use Aurelia UPI, cash or bank transfer."); return; }
    if (method === "upi") {
      if (!/^[^\\s@]+@[^\\s@]+$/.test(String(S.settings.upi || "").trim())) { toast("Configure a valid Aurelia UPI ID in Settings before creating a payment request."); return; }
      if (typeof window.openAureliaUpiForFolio !== "function") { toast("Aurelia UPI payment desk is still loading."); return; }
      closeModal();
      window.openAureliaUpiForFolio(b.id, amount);
      return;
    }
    if (!confirmed) { toast("Confirm that the cash or bank payment was actually received."); return; }
    const label = method === "bank" ? "Bank Transfer" : "Cash";
    b.pays = b.pays || [];
    b.pays.push({ a: amount, m: label, r: reference || (method === "cash" ? "CASH-" + Date.now() : ""), at: new Date().toISOString(), source: "front-desk" });
    S.todayRevenue += amount;
    addAudit("Front-desk payment recorded", `${b.g} · Room ${b.room} · ${label} · ${fmtMoney(amount)} · ${reference || label}`);
    persistMutation().then(saved => {
      if (!saved) return;
      closeModal(); render(); openCheckoutModal(b.id);
      toast(`${label} payment recorded: ${fmtMoney(amount)}.`);
    });
  }

    openModal("Extend Stay", `${esc(b.g)} · Room ${esc(b.room)} · Current checkout ${fmtDate(b.out)}`, `

        btn.disabled = true;
        return;
      }
      const conflict = S.bookings.find(x => x.id !== b.id && String(x.room) === String(b.room) && x.st !== "done" && Number(x.in) < newOut && Number(x.out) > Number(b.out));

        box.innerHTML = `<span style="color:var(--crimson)">Conflict: Room ${esc(b.room)} is reserved by ${esc(conflict.g)} (${fmtDate(conflict.in)} – ${fmtDate(conflict.out)}).</span>`;

  function createUpiSession({ kind, bookingId, tableId, guestName, room, amount, note }) {
    const numericAmount = Number(amount);
    if (!Number.isFinite(numericAmount) || numericAmount <= 0 || Math.round(numericAmount * 100) !== numericAmount * 100) {
      toast("Enter a valid positive amount with no more than two decimal places."); return null;
    }
    if (!/^[^\s@]+@[^\s@]+$/.test(String(S.settings.upi || "").trim())) {
      toast("Configure a valid receiving UPI ID in Settings before creating a guest payment link."); return null;
    }
    const linkedBooking = bookingId ? getBooking(bookingId) : null;
    const linkedTable = tableId ? S.tables.find(x => Number(x.n) === Number(tableId)) : null;
    const resolvedGuestName = guestName || (linkedBooking && linkedBooking.g) || (linkedTable && linkedTable.guest) || "Guest";
    const guestRecord = S.guests.find(x => x.n === resolvedGuestName);
    const guestPhone = String((linkedBooking && (linkedBooking.phone || linkedBooking.ph)) ||
      (linkedTable && linkedTable.phone) || (guestRecord && (guestRecord.ph || guestRecord.phone)) || "").trim();
    const sess = {
      id: "UPI-" + Date.now().toString(36).toUpperCase() + "-" + Math.random().toString(36).slice(2, 7).toUpperCase(),
      kind,
      bookingId: bookingId || null,
      tableId: tableId || null,
      guestName: resolvedGuestName,
      guestPhone,
      room: room || "",
      amount: Math.round(numericAmount * 100) / 100,
      note: note || "Aurelia UPI Collection",
      status: "ACTIVE",
      createdAt: new Date().toISOString(),
      utr: ""
    };
    S.upiSessions.unshift(sess);
    addAudit("Aurelia UPI session created", `${sess.id} · ${sess.guestName} · ${fmtMoney(sess.amount)}`);
    persistMutation().then(saved => {
      if (!saved) return;
      render();
      openUpiIntentModal(sess.id);
    });
    return sess;
  }

  function commitUpiVerification(sessId, utr) {
    const s = S.upiSessions.find(x => x.id === sessId);
    if (!s || s.status !== "ACTIVE") return;
    const before = JSON.stringify(S);
    const checkoutBookingId = s.kind === "folio" ? s.bookingId : null;
    const now = new Date().toISOString();
    if (s.kind === "folio" && s.bookingId) {
      const b = getBooking(s.bookingId);
      if (!b) { toast("Linked folio not found."); return; }
      b.pays = b.pays || [];
      b.pays.push({ a: s.amount, m: "Aurelia UPI", r: utr, at: now });
      S.todayRevenue += s.amount;
      addAudit("Aurelia UPI payment posted", `${fmtMoney(s.amount)} · Room ${b.room} · UTR ${utr}`);
    } else if (s.kind === "restaurant" && s.tableId) {
      const t = S.tables.find(x => Number(x.n) === Number(s.tableId));
      if (!t || !t.o.length) { toast("Linked dining table has no open order."); return; }
      const sale = {
        id: "RS-" + String(Date.now()).slice(-5),
        t: t.n,
        guest: t.guest || s.guestName || "Walk-in",
        phone: t.phone || "",
        items: t.o.map(x => ({ ...x })),
        a: s.amount,
        m: "Aurelia UPI",
        ref: utr,
        at: now,
        status: "paid",
        postedToHotel: false
      };
      S.sales.push(sale);
      t.o = [];
      S.todayRevenue += s.amount;
      addAudit("Restaurant UPI settled", `${sale.guest} · Table ${t.n} · ${fmtMoney(s.amount)}`);
    } else {
      S.todayRevenue += s.amount;
      addAudit("Standalone UPI verified", `${s.guestName} · ${fmtMoney(s.amount)} · UTR ${utr}`);
    }
    s.status = "VERIFIED";
    s.utr = utr;
    s.verifiedAt = now;
    S.upiAlerts.forEach(al => {
      if (al.status === "OPEN" && utr && al.utr === utr && Math.abs(al.amount - s.amount) < 0.01) al.status = "RECONCILED";
    });
    persistMutation().then(saved => {
      if (!saved) {
        // Restore the pre-posting in-memory snapshot so a failed write cannot leave a
        // session appearing VERIFIED while the ledger remains uncommitted on device.
        try { normalizeLoadedState(JSON.parse(before)); render(); openUpiIntentModal(sessId); }
        catch (_) { setPersistenceState("unavailable", "NOT SAVED — verification could not be committed. Restore a verified backup before further changes."); }
        return;
      }
      closeModal();
      render();
      toast(`${fmtMoney(s.amount)} bank credit verified and posted.`);
      if (checkoutBookingId) openCheckoutModal(checkoutBookingId);
    });
  }

  function downloadCsv(filename, rows) {
    const csv = "\uFEFF" + rows.map(r => r.map(v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Exported " + filename);
  }

  function copyText(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast(successMsg), () => fallbackCopy(text, successMsg));
    } else fallbackCopy(text, successMsg);
  }

  function fallbackCopy(text, successMsg) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast(successMsg);
    } catch (e) { toast("Copy failed."); }
  }

  /* ================= DELEGATED EVENT HANDLER ================= */
  document.addEventListener("click", e => {
    if (e.target.id === "modal-root") { closeModal(); return; }

    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) {
      S.tab = navBtn.dataset.nav;
      window.scrollTo({ top: 0, behavior: "auto" });
      render();
      return;
    }

    const rf = e.target.closest("[data-room-filter]");
    if (rf) { S.roomFilter = rf.dataset.roomFilter; render(); return; }

    const sf = e.target.closest("[data-stay-filter]");
    if (sf) { S.stayFilter = sf.dataset.stayFilter; render(); return; }

    const ft = e.target.closest("[data-fin-tab]");
    if (ft) { S.finTab = ft.dataset.finTab; render(); return; }

    const actEl = e.target.closest("[data-action]");
    if (!actEl) return;
    const act = actEl.dataset.action;

    if (act === "close-modal") { closeModal(); return; }
    if (act === "print-now") { window.print(); return; }
    if (act === "check-avail") { openAvailabilityModal(); return; }
    if (act === "new-booking") { openNewBookingModal(actEl.dataset.room, actEl.dataset.day, actEl.dataset.nights, actEl.dataset.guest); return; }

    if (act === "add-booking-occupant") {
      const host = document.getElementById("nb-occupants");
      const count = host.querySelectorAll(".nb-occupant-row").length;
      host.insertAdjacentHTML("beforeend", bookingOccupantRow({}, count));
      return;
    }
    if (act === "remove-booking-occupant") { actEl.closest(".nb-occupant-row")?.remove(); return; }
    if (act === "add-booking-vehicle") {
      const host = document.getElementById("nb-vehicles");
      const count = host.querySelectorAll(".nb-vehicle-row").length;
      host.insertAdjacentHTML("beforeend", bookingVehicleRow({}, count));
      return;
    }
    if (act === "remove-booking-vehicle") { actEl.closest(".nb-vehicle-row")?.remove(); return; }

    if (act === "submit-booking") {
      const ci = document.getElementById("nb-in").value;
      const co = document.getElementById("nb-out").value;
      const tin = document.getElementById("nb-tin").value || "14:00";
      const tout = document.getElementById("nb-tout").value || "11:00";
      const selectedRooms = [...document.querySelectorAll(".nb-room-choice:checked")].map(input => input.value);
      const name = document.getElementById("nb-name").value.trim();
      const phone = document.getElementById("nb-phone").value.trim();
      const idt = document.getElementById("nb-idt").value;
      const idn = document.getElementById("nb-idn").value.trim();
      const occupants = [...document.querySelectorAll(".nb-occupant-row")].map(row => ({
        n: row.querySelector('[data-nb-occ="name"]').value.trim(),
        rel: row.querySelector('[data-nb-occ="rel"]').value.trim(),
        idt: row.querySelector('[data-nb-occ="idt"]').value,
        idn: row.querySelector('[data-nb-occ="idn"]').value.trim()
      })).filter(x => x.n || x.rel || x.idn);
      const vehicles = [...document.querySelectorAll(".nb-vehicle-row")].map(row => ({
        ty: row.querySelector('[data-nb-veh="type"]').value.trim(),
        reg: row.querySelector('[data-nb-veh="reg"]').value.trim().toUpperCase().replace(/\s+/g, " ")
      })).filter(x => x.ty || x.reg);
      const a = offsetFromYmd(ci), z = offsetFromYmd(co);
      const advance = Math.round((Number(document.getElementById("nb-advance").value) || 0) * 100) / 100;
      const advanceMethod = document.getElementById("nb-advance-method").value;
      const advanceReference = document.getElementById("nb-advance-reference").value.trim();
      const advanceConfirmed = document.getElementById("nb-advance-confirm").checked;
      if (!name || !selectedRooms.length || z <= a) { toast("Enter guest name, select at least one room, and choose valid dates."); return; }
      const unavailable = selectedRooms.find(roomNum => !isRoomFree(roomNum, a, z));
      if (unavailable) { toast(`Room ${unavailable} is already booked during those dates.`); return; }
      const reservationValue = selectedRooms.reduce((sum, roomNum) => sum + (Number(getRoom(roomNum)?.r) || 0) * (z - a), 0);
      if (advance < 0 || advance > reservationValue) { toast(`Advance must be between 0 and the reservation total (${fmtMoney(reservationValue)}).`); return; }
      if (advance > 0 && !advanceConfirmed) { toast("Confirm that the advance was actually received and verified."); return; }
      if (advance > 0 && !advanceReference) { toast("Enter the UPI UTR / bank reference for this advance."); return; }
      if (occupants.some(x => !x.n || !x.idn)) { toast("Each additional occupant needs a name and government ID number."); return; }
      if (vehicles.some(x => !x.ty || !x.reg)) { toast("Each vehicle needs a type and registration number."); return; }
      let g = getGuest(name);
      if (!g) { S.guests.push({ n: name, ph: phone, em: "", idt, idn, occ: occupants, veh: vehicles }); }
      else {
        if (phone) g.ph = phone;
        if (idn) { g.idt = idt; g.idn = idn; }
        g.occ = occupants;
        g.veh = vehicles;
      }
      const groupId = "GRP-" + String(Date.now()).slice(-8) + "-" + String(S.nextId + 1);
      const roomWeights = selectedRooms.map(roomNum => Math.max(0, (Number(getRoom(roomNum)?.r) || 0) * (z - a)));
      const totalWeight = roomWeights.reduce((sum, value) => sum + value, 0) || selectedRooms.length;
      let advanceRemaining = advance;
      selectedRooms.forEach((roomNum, index) => {
        const proportionalShare = totalWeight > 0 ? advance * roomWeights[index] / totalWeight : advance / selectedRooms.length;
        const share = index === selectedRooms.length - 1 ? advanceRemaining : Math.min(advanceRemaining, Math.round(proportionalShare * 100) / 100);
        advanceRemaining = Math.round((advanceRemaining - share) * 100) / 100;
        const pays = share > 0 ? [{ a: share, m: "Aurelia UPI Advance", r: advanceReference || ("ADV-" + groupId), at: new Date().toISOString() }] : [];
        const nb = { id: ++S.nextId, groupId, groupLead: index === 0, g: name, room: roomNum, in: a, out: z, st: "res", checkInTime: tin, checkOutTime: tout, dc: 0, ch: [], pays, oc: occupants, veh: vehicles, extensionHistory: [] };
        S.bookings.unshift(nb);
      });
      if (advance > 0) S.todayRevenue += advance;
      addAudit("Reservation group confirmed", `${name} · ${selectedRooms.length} room(s): ${selectedRooms.join(", ")} · Advance ${fmtMoney(advance)} · ${fmtDate(a)} – ${fmtDate(z)}`);
      closeModal();
      S.tab = "stays";
      S.stayFilter = "res";
      render();
      toast(`${selectedRooms.length} room(s) reserved under ${name}${advance > 0 ? ` · Advance ${fmtMoney(advance)} recorded` : ""}`);
      return;
    }

    if (act === "checkin") {
      const b = getBooking(actEl.dataset.id);
      if (!b) return;
      const g = getGuest(b.g);
      const r = getRoom(b.room);
      if (r && r.s !== "ready") { toast(`Room ${b.room} is currently ${r.s}. Release it in Housekeeping first.`); return; }
      openModal("Confirm Check-In", `${esc(b.g)} · Room ${esc(b.room)}`, `
        ${!idComplete(g) ? '<div class="card card-tight" style="border-color:var(--crimson);margin-bottom:12px;color:var(--crimson)">ID number missing on guest profile. Record it below before completing check-in.</div>' : ""}
        <label class="fld"><span>Actual Check-In Time</span><input id="ci-time" type="time" value="${esc(b.checkInTime || "14:00")}"></label>
        <label class="fld"><span>Verified Government ID Number</span><input id="ci-idn" value="${esc(g ? g.idn : "")}" placeholder="Required for check-in"></label>
        <button class="btn full emerald" type="button" data-action="submit-checkin" data-id="${b.id}">Complete Check-In</button>
      `);
      return;
    }

    if (act === "submit-checkin") {
      const b = getBooking(actEl.dataset.id);
      if (!b) return;
      const idn = document.getElementById("ci-idn").value.trim();
      if (!idn) { toast("Government ID number is mandatory for check-in."); return; }
      let g = getGuest(b.g);
      if (g) g.idn = idn; else S.guests.push({ n: b.g, ph: "", em: "", idt: ID_TYPES[0], idn, occ: [], veh: [] });
      b.checkInTime = document.getElementById("ci-time").value || b.checkInTime;
      b.actualCheckInAt = new Date().toISOString();
      b.st = "in";
      const r = getRoom(b.room);
      if (r) r.s = "occ";
      addAudit("Check-in", `${b.g} · Room ${b.room} at ${b.checkInTime}`);
      closeModal();
      render();
      toast(`${b.g} checked into Room ${b.room}`);
      return;
    }

    if (act === "folio-manual-payment") { openManualFolioPaymentModal(actEl.dataset.id); return; }
    if (act === "folio-record-manual-payment") { recordManualFolioPayment(actEl.dataset.id); return; }
    if (act === "dining-manual-settle") { openManualDiningPaymentModal(); return; }
    if (act === "dining-record-manual-payment") { recordManualDiningPayment(actEl.dataset.id); return; }
    if (act === "checkout") { openCheckoutModal(actEl.dataset.id); return; }
    if (act === "checkout-record-payment") { recordCheckoutPayment(actEl.dataset.id); return; }
    if (act === "checkout-finish") { completeCheckout(actEl.dataset.id); return; }
    if (act === "upi-copy-link") { copyText(actEl.dataset.uri || "", "UPI payment link copied"); return; }
    if (act === "upi-share") { shareUpiPayment(actEl.dataset.uri || "", Number(actEl.dataset.amount) || 0); return; }
    if (act === "upi-download-qr") { downloadUpiQr(actEl.dataset.uri || ""); return; }

    if (act === "folio") { openFolioModal(actEl.dataset.id); return; }
    if (act === "invoice") { openInvoiceModal(actEl.dataset.id); return; }
    if (act === "copy-invoice") {
      const b = getBooking(actEl.dataset.id);
      if (!b) return;
      copyText(`${S.settings.name} Invoice ${b.iv || ""} · ${b.g} (Room ${b.room}) · Total ${fmtMoney(bookingTotal(b))}, Paid ${fmtMoney(bookingPaid(b))}, Balance ${fmtMoney(bookingDue(b))}.`, "Invoice summary copied");
      return;

      const b = getBooking(actEl.dataset.id);
      if (!b) return;
      const items = [[`Room ${b.room} (${nightsOf(b)}n)`, roomSubtotal(b)], ...(b.ch || []).map(c => [c.l, c.a])];
      openThermalModal("GUEST FOLIO", b.g, b.room, b.iv || ("BK-" + b.id), items, bookingTotal(b), bookingPaid(b), bookingDue(b));

    if (act === "folio-add-charge") {

      const l = document.getElementById("fol-ch-lbl").value.trim();
      const a = Number(document.getElementById("fol-ch-amt").value);
      if (!b || !l || !(a > 0)) { toast("Enter a charge description and valid amount."); return; }
      b.ch.push({ l, a, c: "ext" });

      openFolioModal(b.id);

    if (act === "folio-discount") {
      const b = getBooking(actEl.dataset.id);

      toast("Discount updated");
