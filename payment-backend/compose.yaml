services:
  payment-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8085"
      DATABASE_PATH: /data/aurelia-payments.sqlite
      TRUST_PROXY_HOPS: "1"
    volumes:
      - payment-data:/data
    expose:
      - "8085"
    networks:
      - payment-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/readyz',{headers:{'X-Forwarded-Proto':'https'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  https:
    image: caddy:2
    environment:
      AURELIA_LAN_HOSTNAME: ${AURELIA_LAN_HOSTNAME:?Set AURELIA_LAN_HOSTNAME in .env}
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      payment-backend:
        condition: service_healthy
    networks:
      - payment-private
volumes:
  payment-data:
  caddy-data:
  caddy-config:
networks:
  payment-private:
    driver: bridge
